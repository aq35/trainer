<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="VS Codeのソース管理パネルとBranchの公開ボタンの位置">
  <rect width="720" height="380" fill="#ffffff"/>
  <rect x="0" y="0" width="720" height="32" fill="#e7eaf0"/>
  <circle cx="18" cy="16" r="5" fill="#ff5f57"/><circle cx="36" cy="16" r="5" fill="#febc2e"/><circle cx="54" cy="16" r="5" fill="#28c840"/>
  <text x="360" y="21" font-family="sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle">practice — Visual Studio Code</text>

  <!-- activity bar -->
  <rect x="0" y="32" width="52" height="348" fill="#2f3542"/>
  <g fill="#9aa3b2">
    <rect x="16" y="50" width="20" height="20" rx="3"/>
    <rect x="16" y="86" width="20" height="20" rx="3"/>
  </g>
  <!-- source control icon (branch) highlighted -->
  <g>
    <circle cx="22" cy="126" r="4.5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <circle cx="22" cy="152" r="4.5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <circle cx="38" cy="126" r="4.5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M22 130.5 V147.5" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M38 130.5 v6 a10 10 0 0 1 -10 10 h-1" stroke="#ffffff" stroke-width="2.2" fill="none"/>
  </g>
  <circle cx="28" cy="139" r="27" fill="none" stroke="#ff5f57" stroke-width="3"/>
  <path d="M62 139 L108 139" stroke="#ff5f57" stroke-width="2.5" marker-end="url(#p1)"/>
  <text x="118" y="135" font-family="sans-serif" font-size="13" font-weight="700" fill="#c0392b">① ここを押す</text>
  <text x="118" y="154" font-family="sans-serif" font-size="11.5" fill="#8892a0">「ソース管理」</text>

  <!-- panel -->
  <rect x="52" y="32" width="270" height="348" fill="#f4f6fa"/>
  <text x="70" y="60" font-family="sans-serif" font-size="12" font-weight="700" fill="#5b6472">ソース管理</text>
  <rect x="66" y="72" width="240" height="34" rx="5" fill="#ffffff" stroke="#c7cede"/>
  <text x="78" y="94" font-family="sans-serif" font-size="12" fill="#a8b2c1">メッセージ</text>

  <!-- publish button -->
  <rect x="66" y="118" width="240" height="34" rx="5" fill="#2f6fed"/>
  <text x="186" y="140" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Branch の公開</text>
  <rect x="59" y="111" width="254" height="48" rx="9" fill="none" stroke="#ff5f57" stroke-width="3"/>

  <path d="M320 200 L390 200" stroke="#ff5f57" stroke-width="2.5" marker-end="url(#p1)"/>
  <text x="404" y="196" font-family="sans-serif" font-size="13" font-weight="700" fill="#c0392b">② この青いボタンを押す</text>
  <text x="404" y="216" font-family="sans-serif" font-size="11.5" fill="#8892a0">英語なら「Publish Branch」</text>

  <rect x="66" y="170" width="240" height="70" rx="6" fill="#ffffff" stroke="#e1e6f0"/>
  <text x="78" y="192" font-family="sans-serif" font-size="11.5" fill="#8892a0">変更はありません</text>
  <text x="78" y="212" font-family="sans-serif" font-size="11.5" fill="#8892a0">（すべて commit 済み）</text>

  <rect x="404" y="248" width="290" height="76" rx="9" fill="#fff8e9" stroke="#f0d9a8" stroke-width="1.5"/>
  <text x="549" y="272" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#8a6412" text-anchor="middle">ボタンが出ていないときは</text>
  <text x="549" y="294" font-family="sans-serif" font-size="12" fill="#8a6412" text-anchor="middle">まだ1回も commit していない可能性大。</text>
  <text x="549" y="313" font-family="sans-serif" font-size="12" fill="#8a6412" text-anchor="middle">Step 2 に戻って commit してください。</text>

  <defs>
    <marker id="p1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ff5f57"/>
    </marker>
  </defs>
</svg>
