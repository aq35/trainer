<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="全角スペースと全角の引用符が、日本語入力のときに混ざるという図">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b6472" text-anchor="middle">見た目はほぼ同じ。でもパソコンには「別の文字」です</text>

  <!-- 上段: スペース -->
  <rect x="30" y="44" width="316" height="110" rx="9" fill="#eefaf1" stroke="#b7e3c6" stroke-width="1.5"/>
  <text x="48" y="68" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#2b7d52">◯ 半角スペース（正しい）</text>
  <rect x="48" y="82" width="280" height="34" rx="5" fill="#1e2229"/>
  <text x="60" y="105" font-family="monospace" font-size="13" fill="#dfe5ef">&lt;p id="message"&gt;</text>
  <text x="48" y="140" font-family="sans-serif" font-size="11.5" fill="#2b7d52">英語入力のまま押したスペース</text>

  <rect x="374" y="44" width="316" height="110" rx="9" fill="#fff0f2" stroke="#f6cdd8" stroke-width="1.5"/>
  <text x="392" y="68" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#be3455">× 全角スペース（動かない）</text>
  <rect x="392" y="82" width="280" height="34" rx="5" fill="#1e2229"/>
  <text x="404" y="105" font-family="monospace" font-size="13" fill="#dfe5ef">&lt;p</text>
  <rect x="424" y="88" width="15" height="22" rx="2" fill="none" stroke="#ff6b8a" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="442" y="105" font-family="monospace" font-size="13" fill="#dfe5ef">id="message"&gt;</text>
  <text x="392" y="136" font-family="sans-serif" font-size="11.5" fill="#be3455">日本語入力のまま押したスペース。</text>
  <text x="392" y="151" font-family="sans-serif" font-size="11.5" fill="#be3455">VS Code が枠で囲んで教えてくれます</text>

  <!-- 下段: 引用符 -->
  <rect x="30" y="168" width="316" height="102" rx="9" fill="#eefaf1" stroke="#b7e3c6" stroke-width="1.5"/>
  <text x="48" y="192" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#2b7d52">◯ まっすぐな引用符</text>
  <rect x="48" y="206" width="280" height="34" rx="5" fill="#1e2229"/>
  <text x="60" y="229" font-family="monospace" font-size="14" fill="#a5e3b8">"こんにちは"</text>
  <text x="48" y="258" font-family="sans-serif" font-size="11.5" fill="#2b7d52">キーボードから直接打ったもの</text>

  <rect x="374" y="168" width="316" height="102" rx="9" fill="#fff0f2" stroke="#f6cdd8" stroke-width="1.5"/>
  <text x="392" y="192" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#be3455">× 曲がった引用符</text>
  <rect x="392" y="206" width="280" height="34" rx="5" fill="#1e2229"/>
  <text x="404" y="229" font-family="monospace" font-size="14" fill="#ff8f8f">“こんにちは”</text>
  <text x="392" y="258" font-family="sans-serif" font-size="11.5" fill="#be3455">メールやWordから貼るとこうなります</text>

  <text x="360" y="290" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b6472" text-anchor="middle">プログラムを打つときは、日本語入力をオフに。文字の中身だけ日本語でOK</text>
</svg>
