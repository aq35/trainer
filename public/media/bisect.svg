<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356" role="img" aria-label="11個のコミットを二分探索し、3回の判定で壊れた1つを確定させる図">
  <rect width="720" height="356" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">半分ずつ切り捨てる。だから11個でも3回で終わります</text>

  <text x="24" y="58" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8892a0">はじめに分かっていること</text>
  <g>
    <circle cx="70" cy="80" r="9" fill="#2f8f4e"/>
    <circle cx="128" cy="80" r="8" fill="#e8ecf3"/><circle cx="186" cy="80" r="8" fill="#e8ecf3"/>
    <circle cx="244" cy="80" r="8" fill="#e8ecf3"/><circle cx="302" cy="80" r="8" fill="#e8ecf3"/>
    <circle cx="360" cy="80" r="8" fill="#e8ecf3"/><circle cx="418" cy="80" r="8" fill="#e8ecf3"/>
    <circle cx="476" cy="80" r="8" fill="#e8ecf3"/><circle cx="534" cy="80" r="8" fill="#e8ecf3"/>
    <circle cx="592" cy="80" r="8" fill="#e8ecf3"/>
    <circle cx="650" cy="80" r="9" fill="#c0392b"/>
  </g>
  <path d="M70 80 L650 80" stroke="#c7cede" stroke-width="1.5"/>
  <circle cx="70" cy="80" r="9" fill="#2f8f4e"/><circle cx="650" cy="80" r="9" fill="#c0392b"/>
  <text x="70" y="104" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#2f8f4e" text-anchor="middle">good（動く）</text>
  <text x="650" y="104" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#c0392b" text-anchor="middle">bad（壊れている）</text>
  <text x="360" y="104" font-family="sans-serif" font-size="10.5" fill="#8892a0" text-anchor="middle">この間のどこかで壊れた。候補10個</text>

  <text x="24" y="140" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#26456f">1回目</text>
  <path d="M70 156 L650 156" stroke="#e8ecf3" stroke-width="1.5"/>
  <path d="M360 156 L650 156" stroke="#f0d5d0" stroke-width="6"/>
  <circle cx="360" cy="156" r="9" fill="#c0392b"/>
  <text x="360" y="140" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#c0392b" text-anchor="middle">ここでテスト → 落ちた（bad）</text>
  <text x="668" y="160" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#c0392b" text-anchor="end">右半分は、まとめて除外</text>

  <text x="24" y="196" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#26456f">2回目</text>
  <path d="M70 212 L360 212" stroke="#e8ecf3" stroke-width="1.5"/>
  <path d="M70 212 L215 212" stroke="#d6e6dc" stroke-width="6"/>
  <circle cx="215" cy="212" r="9" fill="#2f8f4e"/>
  <text x="215" y="196" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#2f8f4e" text-anchor="middle">ここでテスト → 通った（good）</text>
  <text x="378" y="216" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#2f8f4e">左半分も、まとめて除外</text>

  <text x="24" y="252" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#26456f">3回目</text>
  <path d="M215 268 L360 268" stroke="#e8ecf3" stroke-width="1.5"/>
  <circle cx="288" cy="268" r="11" fill="#c0392b"/>
  <text x="288" y="294" font-family="monospace" font-size="10.5" font-weight="700" fill="#c0392b" text-anchor="middle">f6822e6 is the first bad commit</text>
  <text x="378" y="272" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#c0392b">犯人が1つに確定</text>

  <path d="M24 306 L696 306" stroke="#c7cede" stroke-width="1"/>
  <text x="24" y="326" font-family="sans-serif" font-size="12" fill="#26456f">コミットが増えても、手間はほとんど増えません —— <tspan font-weight="700">10個で3〜4回、100個で7回、1000個でも10回</tspan>。</text>
  <text x="24" y="344" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0392b">「2乗で増える」の、ちょうど反対です。</text>
</svg>
