<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-label="ブランチは進むがタグは動かない。タグはそのときのコードに戻るための名札">
<rect width="720" height="270" fill="#ffffff"/>
<text x="24" y="28" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#26456f">ブランチは<tspan fill="#2f6fed">進みます</tspan>。タグは<tspan fill="#c0392b">動きません</tspan></text>

<path d="M60 92 L660 92" stroke="#c7cede" stroke-width="3"/>
<circle cx="110" cy="92" r="9" fill="#ffffff" stroke="#9fb4d8" stroke-width="2.5"/>
<circle cx="250" cy="92" r="9" fill="#ffffff" stroke="#9fb4d8" stroke-width="2.5"/>
<circle cx="390" cy="92" r="9" fill="#ffffff" stroke="#9fb4d8" stroke-width="2.5"/>
<circle cx="530" cy="92" r="9" fill="#ffffff" stroke="#9fb4d8" stroke-width="2.5"/>
<circle cx="640" cy="92" r="9" fill="#2f6fed" stroke="#2f6fed" stroke-width="2.5"/>
<text x="60" y="97" font-family="sans-serif" font-size="12" fill="#8892a0" text-anchor="end">main</text>

<rect x="72" y="112" width="76" height="24" rx="5" fill="#fdf0ee" stroke="#e6b5ad"/>
<text x="110" y="129" font-family="monospace" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">v1.0.0</text>
<rect x="212" y="112" width="76" height="24" rx="5" fill="#fdf0ee" stroke="#e6b5ad"/>
<text x="250" y="129" font-family="monospace" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">v1.0.1</text>
<rect x="352" y="112" width="76" height="24" rx="5" fill="#fdf0ee" stroke="#e6b5ad"/>
<text x="390" y="129" font-family="monospace" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">v1.1.0</text>
<text x="530" y="129" font-family="sans-serif" font-size="11.5" fill="#8892a0" text-anchor="middle">（まだ出していない）</text>

<rect x="592" y="112" width="96" height="24" rx="5" fill="#eef3ff" stroke="#9fb4d8"/>
<text x="640" y="129" font-family="monospace" font-size="12" font-weight="700" fill="#2f6fed" text-anchor="middle">main は ここ</text>

<text x="24" y="62" font-family="sans-serif" font-size="12" fill="#5a6f92">タグ ＝ ある一点に打つ<tspan font-weight="700">名札</tspan>。「このときのコードを、お客さんに出しました」という記録です</text>

<rect x="24" y="156" width="330" height="98" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
<text x="40" y="178" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39">タグがあると</text>
<text x="40" y="200" font-family="sans-serif" font-size="12" fill="#3f7a5c">「先週のバージョンに戻して」と言われたとき</text>
<text x="40" y="222" font-family="monospace" font-size="12" font-weight="700" fill="#1f5c39">git switch --detach v1.0.0</text>
<text x="40" y="242" font-family="sans-serif" font-size="12" fill="#3f7a5c">これ1行で、そのときのコードが手に入ります</text>

<rect x="366" y="156" width="330" height="98" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
<text x="382" y="178" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7a2f24">タグが無いと</text>
<text x="382" y="200" font-family="sans-serif" font-size="12" fill="#9c5a4e">「たぶん、このコミットだったと思います」</text>
<text x="382" y="222" font-family="sans-serif" font-size="12" fill="#9c5a4e">履歴を1つずつ見て、日付から推測することに</text>
<text x="382" y="242" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0392b">障害対応中に、これをやる時間はありません</text>
</svg>
