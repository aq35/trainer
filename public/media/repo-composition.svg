<svg xmlns="http://www.w3.org/2000/svg" width="720" height="388" viewBox="0 0 720 388" role="img" aria-label="この教材のリポジトリ2万5千行の内訳。自分で動きを書いた部分は3,323行しかない">
  <rect width="720" height="388" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">「2万5千行」の中身を、開けてみます</text>

  <text x="24" y="56" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8892a0">全 25,226 行 ／ 259 ファイル</text>

  <rect x="24" y="66" width="672" height="30" rx="5" fill="#e8ecf3"/>
  <rect x="24" y="66" width="202" height="30" fill="#c7cede"/>
  <rect x="226" y="66" width="164" height="30" fill="#d8dfe9"/>
  <rect x="390" y="66" width="128" height="30" fill="#e2e7ef"/>
  <rect x="518" y="66" width="89" height="30" fill="#2f6fed"/>
  <rect x="607" y="66" width="67" height="30" fill="#9fb4d8"/>
  <rect x="674" y="66" width="23" height="30" fill="#eef1f6"/>
  <text x="562" y="112" font-family="sans-serif" font-size="11" font-weight="700" fill="#2f6fed" text-anchor="middle">ここだけ</text>

  <g font-family="sans-serif" font-size="11.5">
    <rect x="24" y="128" width="672" height="26" rx="5" fill="#f7f9fd" stroke="#c7cede"/>
    <text x="40" y="146" fill="#5b6472">教材の文章（.js）</text>
    <text x="170" y="146" font-weight="700" fill="#26456f">7,574 行</text>
    <text x="250" y="146" fill="#8892a0">31ファイル　content/ の中。ナビの手順・問題・設定。ぜんぶ文章データ</text>
    <rect x="24" y="158" width="672" height="26" rx="5" fill="#f7f9fd" stroke="#c7cede"/>
    <text x="40" y="176" fill="#5b6472">Markdown</text>
    <text x="170" y="176" font-weight="700" fill="#26456f">6,171 行</text>
    <text x="250" y="176" fill="#8892a0">28ファイル　読み物・用語集・改訂履歴。ぜんぶ文章</text>
    <rect x="24" y="188" width="672" height="26" rx="5" fill="#f7f9fd" stroke="#c7cede"/>
    <text x="40" y="206" fill="#5b6472">SVG</text>
    <text x="170" y="206" font-weight="700" fill="#26456f">4,791 行</text>
    <text x="250" y="206" fill="#8892a0">136ファイル　図。1枚あたり35行ほどの座標の羅列</text>
    <rect x="24" y="218" width="672" height="26" rx="5" fill="#eef4ff" stroke="#2f6fed" stroke-width="2"/>
    <text x="40" y="236" font-weight="700" fill="#2f6fed">画面と道具</text>
    <text x="170" y="236" font-weight="700" fill="#2f6fed">3,323 行</text>
    <text x="250" y="236" font-weight="700" fill="#26456f">51ファイル　←　自分で「動き」を書いたのは、ここだけ</text>
    <rect x="24" y="248" width="672" height="26" rx="5" fill="#f7f9fd" stroke="#c7cede"/>
    <text x="40" y="266" fill="#5b6472">借りた部品</text>
    <text x="170" y="266" font-weight="700" fill="#26456f">2,509 行</text>
    <text x="250" y="266" fill="#8892a0">4ファイル　sunao/ の中。よそから借りてきた、画面を書く道具</text>
    <rect x="24" y="278" width="672" height="26" rx="5" fill="#f7f9fd" stroke="#c7cede"/>
    <text x="40" y="296" fill="#5b6472">CSS ほか</text>
    <text x="170" y="296" font-weight="700" fill="#26456f">858 行</text>
    <text x="250" y="296" fill="#8892a0">8ファイル　見た目の指定と、設定ファイル</text>
  </g>

  <path d="M24 318 L696 318" stroke="#c7cede" stroke-width="1"/>
  <text x="24" y="340" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0392b">これは、この教材が特別なのではありません。案件のコードも、同じような比率です。</text>
  <text x="24" y="360" font-family="sans-serif" font-size="12" fill="#26456f">設定・文言・データ・借りてきた部品が大半を占め、<tspan font-weight="700">「動き」を自分で書いた部分は思ったより小さい</tspan>。</text>
  <text x="24" y="378" font-family="sans-serif" font-size="11.5" fill="#8892a0">だから「全部読む」は無理でも、<tspan font-weight="700">「動いている場所を探し当てる」なら、今日できます。</tspan></text>
</svg>
