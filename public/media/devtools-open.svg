<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="Chrome や Edge で開発者ツールを開く3つの方法">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b6472" text-anchor="middle">開き方は3つ。どれでも同じものが出ます</text>

  <!-- 1: キーボード -->
  <rect x="24" y="46" width="212" height="216" rx="10" fill="#eef3ff" stroke="#c9dbff" stroke-width="1.5"/>
  <circle cx="52" cy="74" r="13" fill="#2f6fed"/>
  <text x="52" y="79" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="76" y="79" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#2f6fed">キーを押す</text>

  <text x="46" y="112" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#5b6472">Windows</text>
  <rect x="46" y="122" width="46" height="30" rx="6" fill="#ffffff" stroke="#9fb6e8" stroke-width="1.5"/>
  <text x="69" y="142" font-family="sans-serif" font-size="13" font-weight="700" fill="#2f4a86" text-anchor="middle">F12</text>

  <text x="46" y="180" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#5b6472">Mac</text>
  <rect x="46" y="190" width="44" height="30" rx="6" fill="#ffffff" stroke="#9fb6e8" stroke-width="1.5"/>
  <text x="68" y="210" font-family="sans-serif" font-size="12" font-weight="700" fill="#2f4a86" text-anchor="middle">Cmd</text>
  <text x="96" y="210" font-family="sans-serif" font-size="13" fill="#5b6472" text-anchor="middle">+</text>
  <rect x="106" y="190" width="56" height="30" rx="6" fill="#ffffff" stroke="#9fb6e8" stroke-width="1.5"/>
  <text x="134" y="210" font-family="sans-serif" font-size="12" font-weight="700" fill="#2f4a86" text-anchor="middle">Option</text>
  <text x="170" y="210" font-family="sans-serif" font-size="13" fill="#5b6472" text-anchor="middle">+</text>
  <rect x="180" y="190" width="34" height="30" rx="6" fill="#ffffff" stroke="#9fb6e8" stroke-width="1.5"/>
  <text x="197" y="210" font-family="sans-serif" font-size="13" font-weight="700" fill="#2f4a86" text-anchor="middle">I</text>
  <text x="130" y="242" font-family="sans-serif" font-size="11" fill="#6b7482" text-anchor="middle">最後は大文字のアイ</text>

  <!-- 2: 右クリック -->
  <rect x="254" y="46" width="212" height="216" rx="10" fill="#f7f9fc" stroke="#dde4f0" stroke-width="1.5"/>
  <circle cx="282" cy="74" r="13" fill="#2f6fed"/>
  <text x="282" y="79" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="306" y="79" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#2f6fed">右クリック</text>

  <text x="360" y="106" font-family="sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle">ページの何もないところで右クリック</text>
  <rect x="288" y="120" width="144" height="118" rx="7" fill="#ffffff" stroke="#c8cfdb" stroke-width="1.5"/>
  <text x="304" y="142" font-family="sans-serif" font-size="12" fill="#9aa3b2">戻る</text>
  <text x="304" y="164" font-family="sans-serif" font-size="12" fill="#9aa3b2">再読み込み</text>
  <text x="304" y="186" font-family="sans-serif" font-size="12" fill="#9aa3b2">名前を付けて保存</text>
  <rect x="292" y="196" width="136" height="26" rx="5" fill="#eef3ff"/>
  <text x="304" y="214" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#2f6fed">検証</text>
  <text x="360" y="252" font-family="sans-serif" font-size="11" fill="#6b7482" text-anchor="middle">英語では Inspect</text>

  <!-- 3: メニュー -->
  <rect x="484" y="46" width="212" height="216" rx="10" fill="#f7f9fc" stroke="#dde4f0" stroke-width="1.5"/>
  <circle cx="512" cy="74" r="13" fill="#2f6fed"/>
  <text x="512" y="79" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="536" y="79" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#2f6fed">メニューから</text>

  <text x="590" y="108" font-family="sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle">ブラウザ右上の点3つ</text>
  <circle cx="590" cy="126" r="3" fill="#5b6472"/>
  <circle cx="590" cy="137" r="3" fill="#5b6472"/>
  <circle cx="590" cy="148" r="3" fill="#5b6472"/>
  <rect x="510" y="164" width="160" height="76" rx="7" fill="#ffffff" stroke="#c8cfdb" stroke-width="1.5"/>
  <text x="524" y="186" font-family="sans-serif" font-size="12" fill="#9aa3b2">その他のツール</text>
  <path d="M528 194 L660 194" stroke="#e7ebf3" stroke-width="1"/>
  <rect x="514" y="202" width="152" height="26" rx="5" fill="#eef3ff"/>
  <text x="526" y="220" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#2f6fed">デベロッパー ツール</text>
  <text x="590" y="252" font-family="sans-serif" font-size="11" fill="#6b7482" text-anchor="middle">Chrome も Edge も同じ場所</text>

  <text x="360" y="286" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#2b7d52" text-anchor="middle">閉じるときは、もう一度 F12。ページは何も壊れません</text>
</svg>
