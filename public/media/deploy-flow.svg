<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-label="書く、コミット、プッシュ、自動で公開、URLで見られるという流れ">
  <rect width="720" height="230" fill="#ffffff"/>
  <text x="360" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b6472" text-anchor="middle">直したものが世界に届くまで（デプロイ）</text>

  <g>
    <rect x="24" y="52" width="118" height="70" rx="10" fill="#eef3ff" stroke="#c9dbff" stroke-width="1.5"/>
    <text x="83" y="80" font-family="sans-serif" font-size="13" font-weight="700" fill="#2f6fed" text-anchor="middle">① 直す</text>
    <text x="83" y="102" font-family="sans-serif" font-size="11" fill="#5b6472" text-anchor="middle">VS Code</text>
  </g>
  <path d="M148 87 L172 87" stroke="#8892a0" stroke-width="2.5" marker-end="url(#d2)"/>
  <g>
    <rect x="178" y="52" width="118" height="70" rx="10" fill="#fff8e9" stroke="#f0d9a8" stroke-width="1.5"/>
    <text x="237" y="80" font-family="sans-serif" font-size="13" font-weight="700" fill="#8a6412" text-anchor="middle">② 記録</text>
    <text x="237" y="102" font-family="sans-serif" font-size="11" fill="#8a6412" text-anchor="middle">コミット</text>
  </g>
  <path d="M302 87 L326 87" stroke="#8892a0" stroke-width="2.5" marker-end="url(#d2)"/>
  <g>
    <rect x="332" y="52" width="118" height="70" rx="10" fill="#f1f4f9" stroke="#c7cede" stroke-width="1.5"/>
    <text x="391" y="80" font-family="sans-serif" font-size="13" font-weight="700" fill="#3d4652" text-anchor="middle">③ 送る</text>
    <text x="391" y="102" font-family="sans-serif" font-size="11" fill="#5b6472" text-anchor="middle">同期（push）</text>
  </g>
  <path d="M456 87 L480 87" stroke="#8892a0" stroke-width="2.5" marker-end="url(#d2)"/>
  <g>
    <rect x="486" y="52" width="118" height="70" rx="10" fill="#f6f2ff" stroke="#ddd0f5" stroke-width="1.5"/>
    <text x="545" y="80" font-family="sans-serif" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">④ 自動で</text>
    <text x="545" y="100" font-family="sans-serif" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">組み立て</text>
  </g>
  <path d="M610 87 L634 87" stroke="#8892a0" stroke-width="2.5" marker-end="url(#d2)"/>
  <g>
    <rect x="640" y="52" width="56" height="70" rx="10" fill="#f1faf4" stroke="#b7e3c6" stroke-width="1.5"/>
    <text x="668" y="80" font-family="sans-serif" font-size="13" font-weight="700" fill="#2b7d52" text-anchor="middle">⑤</text>
    <text x="668" y="100" font-family="sans-serif" font-size="11" fill="#2b7d52" text-anchor="middle">公開</text>
  </g>

  <rect x="486" y="136" width="210" height="34" rx="8" fill="#f6f2ff" stroke="#ddd0f5" stroke-width="1.5"/>
  <text x="591" y="157" font-family="sans-serif" font-size="11.5" fill="#7c3aed" text-anchor="middle">ここは人がやりません。数分待つだけ。</text>

  <rect x="90" y="186" width="540" height="32" rx="9" fill="#eef3ff" stroke="#c9dbff" stroke-width="1.5"/>
  <text x="360" y="207" font-family="sans-serif" font-size="12.5" fill="#2f6fed" text-anchor="middle">①〜③は、あなたがもうできること。④以降が「デプロイ」と呼ばれる部分です。</text>

  <defs><marker id="d2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8892a0"/></marker></defs>
</svg>
