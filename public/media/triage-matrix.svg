<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" role="img" aria-label="ConsoleとNetworkの組み合わせで、フロント側かバック側かを判定する表">
  <rect width="720" height="392" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">Console と Network の組み合わせで決まります</text>

  <text x="30" y="58" font-family="sans-serif" font-size="12" font-weight="700" fill="#8892a0">Network で見えるもの</text>
  <text x="470" y="58" font-family="sans-serif" font-size="12" font-weight="700" fill="#8892a0">Console</text>
  <text x="620" y="58" font-family="sans-serif" font-size="12" font-weight="700" fill="#8892a0">どっちのせいか</text>

  <rect x="24" y="68" width="672" height="46" rx="8" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
  <text x="40" y="90" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39">200 ＋ 中身も正しい</text>
  <text x="40" y="106" font-family="sans-serif" font-size="10.5" fill="#4a7a5f">Response にタスクのJSONが入っている</text>
  <text x="470" y="97" font-family="sans-serif" font-size="12" fill="#1f5c39">赤なし</text>
  <text x="620" y="97" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#2f8f4e">問題なし</text>

  <rect x="24" y="120" width="672" height="46" rx="8" fill="#eef4ff" stroke="#9fb4d8" stroke-width="1.5"/>
  <text x="40" y="142" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#26456f">200 ＋ 中身は正しい</text>
  <text x="40" y="158" font-family="sans-serif" font-size="10.5" fill="#5a6f92">届いた物は正しい。使い方のほうが間違っている</text>
  <text x="470" y="149" font-family="sans-serif" font-size="12" fill="#26456f">赤あり</text>
  <text x="620" y="149" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#2f6fed">フロント側</text>

  <rect x="24" y="172" width="672" height="46" rx="8" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
  <text x="40" y="194" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7a2f24">200 だが 中身がおかしい</text>
  <text x="40" y="210" font-family="sans-serif" font-size="10.5" fill="#a05a4c">空・HTMLが返っている・JSONが壊れている</text>
  <text x="470" y="201" font-family="sans-serif" font-size="12" fill="#7a2f24">赤あり</text>
  <text x="620" y="201" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">バック側</text>

  <rect x="24" y="224" width="672" height="46" rx="8" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
  <text x="40" y="246" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7a2f24">4xx / 5xx</text>
  <text x="40" y="262" font-family="sans-serif" font-size="10.5" fill="#a05a4c">そもそも届いていない（4xxは頼み方、5xxは向こうが落ちた）</text>
  <text x="470" y="253" font-family="sans-serif" font-size="12" fill="#7a2f24">赤あり</text>
  <text x="620" y="253" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">バック側</text>

  <rect x="24" y="276" width="672" height="46" rx="8" fill="#fdf7e8" stroke="#e2c98a" stroke-width="1.5"/>
  <text x="40" y="298" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7a5c1a">リクエストが、そもそも無い</text>
  <text x="40" y="314" font-family="sans-serif" font-size="10.5" fill="#a8862f">いちばん見つけにくい。あなたのコードが呼んでいない</text>
  <text x="470" y="305" font-family="sans-serif" font-size="12" fill="#7a5c1a">赤なし</text>
  <text x="620" y="305" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#2f6fed">フロント側</text>

  <path d="M16 124 L10 124 L10 214 L16 214" stroke="#c0392b" stroke-width="2" fill="none"/>
  <path d="M10 169 L4 169" stroke="#c0392b" stroke-width="2"/>
  <path d="M24 336 L696 336" stroke="#c7cede" stroke-width="1"/>
  <text x="24" y="360" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0392b">上の2行（赤い線）は、ぱっと見が同じ「赤 ＋ 200」です。分けるのは Response の中身だけ。</text>
  <text x="24" y="380" font-family="sans-serif" font-size="12" fill="#26456f">だから <tspan font-weight="700">200 を見たら、必ず Response まで開く</tspan>。ここを飛ばすと、フロントとバックを取り違えます。</text>
</svg>
