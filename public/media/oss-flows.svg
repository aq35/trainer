<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="Node.js・Kubernetes・Rustの実際のブランチ運用。3つともdevelopを持たない">
<rect width="720" height="330" fill="#ffffff"/>
<text x="24" y="28" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#26456f">有名なオープンソースが、実際にやっていること（手順書を読んで確認）</text>

<rect x="24" y="42" width="672" height="80" rx="10" fill="#f8fafd" stroke="#c7cede" stroke-width="1.5"/>
<text x="40" y="64" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#3d4652">Node.js</text>
<text x="112" y="64" font-family="sans-serif" font-size="11.5" fill="#5a6f92">古いバージョンを使い続ける人を、置き去りにしない</text>
<text x="40" y="88" font-family="monospace" font-size="12" font-weight="700" fill="#2f6fed">main</text>
<text x="96" y="88" font-family="sans-serif" font-size="11.5" fill="#5a6f92">…… ここに新しいものが入る</text>
<text x="40" y="108" font-family="monospace" font-size="12" font-weight="700" fill="#c0392b">v22.x</text>
<text x="96" y="108" font-family="sans-serif" font-size="11.5" fill="#5a6f92">…… <tspan font-weight="700">そのバージョンを何年も保守し続ける枝</tspan>（LTS）＋ 手前に置き場 <tspan font-family="monospace">v22.x-staging</tspan></text>

<rect x="24" y="132" width="672" height="80" rx="10" fill="#f8fafd" stroke="#c7cede" stroke-width="1.5"/>
<text x="40" y="154" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#3d4652">Kubernetes</text>
<text x="132" y="154" font-family="sans-serif" font-size="11.5" fill="#5a6f92">出す直前に、入り口を狭める</text>
<text x="40" y="178" font-family="monospace" font-size="12" font-weight="700" fill="#2f6fed">main</text>
<text x="96" y="178" font-family="sans-serif" font-size="11.5" fill="#5a6f92">…… ここに新しいものが入る</text>
<text x="40" y="198" font-family="monospace" font-size="12" font-weight="700" fill="#c0392b">release-1.30</text>
<text x="150" y="198" font-family="sans-serif" font-size="11.5" fill="#5a6f92">…… <tspan font-weight="700">コードフリーズの前に作り、あとはチェリーピックだけ</tspan></text>

<rect x="24" y="222" width="672" height="80" rx="10" fill="#f8fafd" stroke="#c7cede" stroke-width="1.5"/>
<text x="40" y="244" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#3d4652">Rust</text>
<text x="92" y="244" font-family="sans-serif" font-size="11.5" fill="#5a6f92">出す日を、先に決めてしまう</text>
<text x="40" y="270" font-family="monospace" font-size="12.5" font-weight="700" fill="#2f6fed">nightly</text>
<text x="106" y="270" font-family="sans-serif" font-size="13" fill="#8892a0">──6週間──▶</text>
<text x="216" y="270" font-family="monospace" font-size="12.5" font-weight="700" fill="#8a6d1f">beta</text>
<text x="266" y="270" font-family="sans-serif" font-size="13" fill="#8892a0">──6週間──▶</text>
<text x="376" y="270" font-family="monospace" font-size="12.5" font-weight="700" fill="#c0392b">stable</text>
<text x="40" y="292" font-family="sans-serif" font-size="11.5" fill="#5a6f92">間に合ったものだけが次の電車に乗る（<tspan font-weight="700">リリーストレイン</tspan>）。beta に乗ったら重大な修正だけ</text>

<rect x="24" y="308" width="672" height="22" rx="6" fill="#fdf0ee" stroke="#e6b5ad"/>
<text x="360" y="324" font-family="sans-serif" font-size="12" fill="#7a2f24" text-anchor="middle"><tspan font-weight="700" fill="#c0392b">3つとも、develop ブランチを持っていません。</tspan>main そのものが develop の役をしています</text>
</svg>
