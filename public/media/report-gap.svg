<svg xmlns="http://www.w3.org/2000/svg" width="720" height="284" viewBox="0 0 720 284" role="img" aria-label="報告する人が持っている気づきと、直す人に必要な事実のあいだにあるギャップ">
<rect width="720" height="284" fill="#ffffff"/>
<rect x="24" y="20" width="272" height="150" rx="10" fill="#f6f8fc" stroke="#c7cede" stroke-width="1.5"/>
<text x="160" y="45" font-family="sans-serif" font-size="13" font-weight="700" fill="#3d4652" text-anchor="middle">報告した人（営業の田中さん）</text>
<text x="44" y="72" font-family="sans-serif" font-size="12.5" fill="#5b6472">持っているもの</text>
<text x="44" y="96" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f">「なんか表示がおかしい気がする」</text>
<text x="44" y="122" font-family="sans-serif" font-size="12.5" fill="#5b6472">持っていないもの</text>
<text x="44" y="145" font-family="sans-serif" font-size="12.5" fill="#8892a0">技術の言葉。どう説明すればよいかの型</text>
<text x="360" y="88" font-family="sans-serif" font-size="12.5" fill="#8892a0" text-anchor="middle">ここが空いている</text>
<path d="M300 100 L420 100" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M420 94 L432 100 L420 106 Z" fill="#c0392b"/>
<text x="360" y="122" font-family="sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">埋めるのは、こちら側の仕事</text>
<rect x="424" y="20" width="272" height="150" rx="10" fill="#eef3ff" stroke="#9fb4d8" stroke-width="1.5"/>
<text x="560" y="45" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">直す人（あなた）に必要なもの</text>
<text x="444" y="76" font-family="sans-serif" font-size="13" fill="#26456f">① どのタスクか</text>
<text x="444" y="104" font-family="sans-serif" font-size="13" fill="#26456f">② どうおかしいのか</text>
<text x="444" y="132" font-family="sans-serif" font-size="13" fill="#26456f">③ いつからか</text>
<text x="560" y="156" font-family="sans-serif" font-size="12" fill="#5a6f92" text-anchor="middle">どれも書かれていません</text>
<rect x="24" y="188" width="672" height="72" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
<text x="44" y="214" font-family="sans-serif" font-size="13" font-weight="700" fill="#1f5c39">田中さんは、すでに十分な仕事をしています</text>
<text x="44" y="238" font-family="sans-serif" font-size="12.5" fill="#1f5c39">「何かおかしい」と気づいて、伝えてくれました。言葉を持っている側が聞き出す——それがこちらの仕事です。</text>
</svg>
