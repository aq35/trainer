<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="Claude Codeを賢くする3段階。土台がCLAUDE.mdで前提を渡すこと、次にコマンドを使わせること、最後にMCPで外の道具につなぐこと">
  <rect width="720" height="330" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">下から積みます。順番を飛ばすと、効きません</text>

  <rect x="230" y="44" width="260" height="64" rx="9" fill="#f4eefc" stroke="#c4aee6" stroke-width="1.5"/>
  <text x="360" y="68" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#4a2f77" text-anchor="middle">段階3 — MCP で、外の道具につなぐ</text>
  <text x="360" y="88" font-family="sans-serif" font-size="11" fill="#6b4f96" text-anchor="middle">AIが自分で GitHub を見に行く</text>
  <text x="360" y="103" font-family="sans-serif" font-size="10.5" fill="#6b4f96" text-anchor="middle">コピペしている場面が、つなぐ候補</text>
  <text x="504" y="82" font-family="sans-serif" font-size="11" fill="#8892a0">効果 ★☆☆・手間 大</text>

  <rect x="160" y="120" width="400" height="64" rx="9" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
  <text x="360" y="144" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39" text-anchor="middle">段階2 — コマンドを使わせる（手を持たせる）</text>
  <text x="360" y="164" font-family="sans-serif" font-size="11" fill="#4a7a5f" text-anchor="middle">npm test を走らせる／git diff を読ませる</text>
  <text x="360" y="179" font-family="sans-serif" font-size="10.5" fill="#4a7a5f" text-anchor="middle">確認モード（Manual）は切らない</text>
  <text x="574" y="158" font-family="sans-serif" font-size="11" fill="#8892a0">効果 ★★☆・0円</text>

  <rect x="60" y="196" width="600" height="76" rx="9" fill="#eef4ff" stroke="#9fb4d8" stroke-width="2"/>
  <text x="646" y="216" font-family="sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="end">効果 ★★★・0円</text>
  <text x="360" y="221" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">段階1 — CLAUDE.md に、前提と「確かめ方」を書いて渡す</text>
  <text x="360" y="242" font-family="sans-serif" font-size="11.5" fill="#5a6f92" text-anchor="middle">テストの走らせ方／やってほしくないこと／決まっている方針／私は初心者です</text>
  <text x="360" y="262" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#2f6fed" text-anchor="middle">確かめ方を知らないAIは、動かないコードを「できました」と言います</text>

  <path d="M60 290 L660 290" stroke="#c7cede" stroke-width="1"/>
  <text x="360" y="314" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">いちばん効くのがいちばん下。そして、いちばんやられていません。</text>
</svg>
