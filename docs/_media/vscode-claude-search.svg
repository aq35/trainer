<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="拡張機能の検索窓にclaudeと入力してインストールする">
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="34" fill="#e7eaf0"/>
  <text x="320" y="22" font-family="sans-serif" font-size="13" fill="#5b6472" text-anchor="middle">拡張機能</text>

  <rect x="20" y="50" width="600" height="36" rx="6" fill="#ffffff" stroke="#c7cede" stroke-width="1.5"/>
  <text x="34" y="73" font-family="sans-serif" font-size="16" fill="#2f3542">claude</text>
  <rect x="30" y="63" width="1.5" height="12" fill="#2f3542"/>

  <rect x="20" y="100" width="600" height="80" rx="8" fill="#f5f7fb" stroke="#2f6fed" stroke-width="2"/>
  <rect x="34" y="114" width="52" height="52" rx="8" fill="#2f6fed"/>
  <text x="60" y="146" font-family="sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">C</text>
  <text x="100" y="132" font-family="sans-serif" font-size="16" fill="#2f3542">Claude Code</text>
  <text x="100" y="152" font-family="sans-serif" font-size="12" fill="#8892a0">Anthropic</text>
  <rect x="500" y="128" width="100" height="30" rx="6" fill="#2f6fed"/>
  <text x="550" y="148" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Install</text>

  <text x="320" y="220" font-family="sans-serif" font-size="14" fill="#5b6472" text-anchor="middle">
    検索結果に出てきた「Claude Code」の Install を押す
  </text>
</svg>
