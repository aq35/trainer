<script>
window.NAVI = {
key:'trainer-diff-v1',

common:[
  { q:'言葉の意味が分からない',
    a:'<a href="index.html#/glossary" target="_blank" rel="noopener">用語集</a>に、研修で出てくる言葉をまとめてあります。' },
    { when:'act', q:'practice フォルダが開けない',
    a:'VS Code のメニュー「ファイル」→「最近使用した項目」から選べます。無ければ「フォルダーを開く」でデスクトップの practice を選んでください。' }
],

steps:[
{
  icon:'icon-ai.svg', phase:'1. なぜ必要か',
  title:'この先、AIが書いた変更を「読んで決める」ことになります',
  why:'次のStepからAIにコードを書いてもらいます。そのとき必ず「これでいいですか？」と聞かれます。',
  visual:'media/ai-teamwork.svg',
  visualAlt:'AIが提案を出し、人が差分を読んでOKか断るかを決めるという分担',
  expect:'AIが出してくるのは「差分」という形です。これが読めれば、AIに任せても迷子になりません。',
  note:'逆に、差分を読まずに「はい」を押し続けると、<b>自分のパソコンで何が起きているか分からなくなります。</b>この10分は、そうならないための準備です。',
  ask:'なぜ差分を読む必要があるか、なんとなく分かりましたか？',
  tb:[
    { q:'AIが勝手に壊さないか不安',
      a:'勝手には変えません。必ず「はい／いいえ」を聞かれますし、次のStepで<b>断る練習</b>もします。さらに commit してあれば元に戻せます。' },
    { q:'ピンとこない',
      a:'今は分からなくて大丈夫です。この後で実際に自分の目で見ると分かります。そのまま進んでください。' }
  ]
},
{
  icon:'icon-folder.svg', phase:'2. 実際に見てみる',
  title:'ファイルを1行だけ書き換えます',
  why:'まず自分で変更を作ります。自分でやった変更なら、差分の見え方が確かめられます。',
  todo:{
    common:['VS Code で <b>practice</b> フォルダを開きます',
            '<b>hello.txt</b> を開きます',
            '中の文章のうち、<b>1行だけ</b>書き換えます（例:「よろしく」→「はじめまして」）',
            '<span class="k">Ctrl</span>+<span class="k">S</span> / <span class="k">Cmd</span>+<span class="k">S</span> で<b>保存</b>します']
  },
  expect:'左のファイル一覧で、hello.txt の色が変わり、右に「M」という印が付きます。Mは Modified（変更された）の頭文字です。',
  note:'保存を忘れると次に進めません。<b>保存して初めて「変更した」と見なされます。</b>',
  ask:'ファイル名の横に M の印が出ましたか？',
  tb:[
    { q:'M が出ない',
      a:'保存していない可能性が高いです。<span class="k">Ctrl</span>+<span class="k">S</span> を押してください。ファイル名のタブに「●」が付いていたら、それは未保存の印です。' },
    { q:'hello.txt が無い',
      a:'「git の基本」をまだ終えていないかもしれません。<a href="git.html" target="_blank" rel="noopener">「git の基本」</a> に戻って、ファイルを作って commit するところまで済ませてください。' }
  ]
},
{
  icon:'icon-git.svg', phase:'2. 実際に見てみる',
  title:'変更したところを表示します',
  why:'ここが本題です。ボタンひとつで「どこが変わったか」だけを表示できます。',
  todo:{
    common:['左端の<b>ソース管理</b>（枝分かれの形のアイコン）を押します',
            '「変更」の下に <b>hello.txt</b> が出ています',
            'その <b>hello.txt をクリック</b>します']
  },
  expect:'画面が左右に分かれ、左に変更前、右に変更後が並んで表示されます。',
  ask:'左右に並んだ画面が出ましたか？',
  tb:[
    { q:'クリックしたらファイルがそのまま開いた',
      a:'ファイル一覧（エクスプローラー）のほうをクリックしています。<b>ソース管理</b>のパネルの中にある hello.txt を押してください。' },
    { q:'「変更」の下に何も出ていない',
      a:'保存できていないか、まだ何も変更していません。前のステップに戻ってください。' }
  ]
},
{
  icon:'icon-ai.svg', phase:'3. 読み方を覚える',
  title:'赤と緑の意味を覚えます',
  why:'覚えることは2つだけです。これが分かれば、AIの提案も読めます。',
  visual:'media/diff-read.svg',
  visualAlt:'差分の読み方。赤いマイナスは消えた行、緑のプラスは増えた行、灰色は変わっていない行',
  expect:'<b>緑（＋）は増えた行、赤（−）は消えた行。</b>灰色は変わっていない行です。これだけです。',
  note:'「1行を書き換えた」ときは、<b>赤で古い行が消え、緑で新しい行が増える</b>という2つの動きとして表示されます。書き換え＝消して足す、と考えると分かりやすいです。',
  ask:'自分の画面で、変えた行が赤と緑になっているのを確認できましたか？',
  tb:[
    { q:'色が付いていない',
      a:'左右に並んだ画面では、変わった行に色の帯が付きます。何も付いていない場合は、変更が保存されていないか、変更していない可能性があります。' },
    { q:'思ったより広い範囲に色が付いている',
      a:'行の途中だけを変えても、行まるごとが「変わった行」として表示されます。異常ではありません。' }
  ]
},
{
  icon:'icon-terminal.svg', phase:'3. 読み方を覚える',
  title:'先に予想してから、数えさせます',
  why:'AIや先輩が差分を文字で見せてくることがあります。それに<b>「読めているか」は、数で確かめられます。</b>',
  todo:{
    common:['<b>先に予想してください。</b>あなたは <b>1行だけ書き換えました</b>（答えは下の「こうなれば成功です」にあります。<b>決めてから読んでください</b>）',
            '　<b>増えた行は何行で、消えた行は何行でしょうか。</b>口に出すか、メモしてください',
            'VS Code のメニュー「表示」→「ターミナル」を開きます',
            '下の1行目を打ちます。− と ＋ の行が出ます（長いときは <b>q</b> キーで戻れます）',
            '<b>2行目を打って、答え合わせをします。</b>機械が数えて教えてくれます']
  },
  cmdMulti:{
    common:['git diff',
            'git diff --stat']
  },
  cmdlabel:'1行目で見る、2行目で数えさせる',
  expect:'最後の行に <code>1 file changed, <b>1 insertion(+), 1 deletion(-)</b></code> と出ます。<br><b>「1行変わった」ではありません。「1行増えて、1行消えた」</b>です。',
  note:'<b>ここで予想が外れた人が多いはずです。それが今日の収穫です。</b><br>git は「書き換え」を知りません。<b>消して、足す</b>——この2つしか無いのです。<br>だから差分は、いつでも赤と緑の2色だけで表せます。<br><b>q キーで戻る</b>のは、この先も何度も使います。画面が固まったように見えても、q を押せば戻れます。',
  ask:'予想と、出てきた数は合っていましたか？（外れていても先に進めます）',
  tb:[
    { q:'画面から抜けられなくなった',
      a:'<b>q</b> キー（アルファベットのキュー）を押してください。それでも戻らないときは <span class="k">Ctrl</span>+<span class="k">C</span> を押します。' },
    { q:'何も表示されずに終わった',
      a:'変更が無い状態です。すでに commit してしまった可能性があります。ファイルをもう一度書き換えて保存してから試してください。' },
    { q:'予想と数が合わなかった',
      a:'<b>それが正常です。ほとんどの人が外します。</b>「1行を書き換えた」は、人間の言い方です。git から見ると<b>「古い1行を消して、新しい1行を足した」</b>——だから ＋1 と −1 の2つになります。<b>この1回でもう忘れません。</b>' },
    { q:'insertion / deletion の数がもっと多い',
      a:'<b>2行以上さわっているだけです。異常ではありません。</b>数が合っているか確かめたいなら、<code>git diff</code> の画面で <b>＋の行と−の行を自分で数えて</b>ください。<code>--stat</code> の数と一致するはずです。' },
    { q:'日本語が読めない記号になっている',
      a:'表示の都合で文字化けすることがあります。左右に並ぶ画面のほうが確実なので、そちらで確認すれば問題ありません。' }
  ]
},
{
  icon:'icon-git.svg', phase:'4. 試して、戻す',
  title:'いらない変更を、まとめて捨てます',
  why:'AIの提案が気に入らないとき、この操作で元に戻せます。安心してAIに任せるための保険です。',
  todo:{
    common:['ファイルをもっと大きく書き換えて、保存します（何行消してもOK）',
            '差分を見て、赤と緑がたくさん出ることを確認します',
            '下のコマンドで、<b>全部まとめて</b>元に戻します']
  },
  cmd:'git restore .',
  cmdlabel:'最後の「.」（ドット）まで打ちます',
  expect:'書き換えた内容が消え、最後に commit した状態に戻ります。ソース管理の「変更」も空になります。',
  note:'<b>「.」は「全部」という意味</b>です。「git の基本」で使った <code>git restore ファイル名</code> は1つだけ、こちらは全部が対象になります。',
  ask:'ファイルが元の状態に戻りましたか？',
  tb:[
    { q:'戻したくないものまで消えてしまった',
      a:'commit していない変更は戻せません。だからこそ<b>区切りのいいところで commit</b> しておくことが大事です。今回は練習なので、そのまま進んで大丈夫です。' },
    { q:'何も変わらない',
      a:'保存していない可能性があります。保存してから、もう一度試してください。' }
  ]
},
{
  kind:'fin',
  title:'差分が読めるようになりました',
  lead:'これでAIの提案を「読んで判断する」準備ができました。<br>次はいよいよ、AIに書いてもらいます。',
  gained:'変更したところだけを表示できる／赤と緑の意味が分かる／いらない変更を捨てられる',
  note:'覚えるのは<b>「緑は増えた、赤は消えた」</b>だけで十分です。忘れたら<a href="index.html#/glossary">用語集</a>に戻ってください。',
  nextHref:'ai.html',
  nextLabel:'次: AIと一緒に直す'
}
]};
</script>
