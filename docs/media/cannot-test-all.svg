<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="全部の組み合わせは試せないので、必ずやらないことを決めている。分けるのは、やらなかったことを言えるようにするため">
<rect width="720" height="300" fill="#ffffff"/>
<text x="24" y="28" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#26456f">不具合を理論上100%防ぐ方法は、1つだけあります。<tspan fill="#c0392b">全部の組み合わせを試すこと</tspan>です</text>

<rect x="24" y="42" width="310" height="112" rx="10" fill="#f8fafd" stroke="#c7cede" stroke-width="1.5"/>
<text x="40" y="64" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#3d4652">入力が10個ある、ふつうの画面</text>
<text x="40" y="86" font-family="sans-serif" font-size="12" fill="#5a6f92">1つにつき「空・正常・異常」の3通りだけ試すと</text>
<text x="40" y="112" font-family="monospace" font-size="15" font-weight="700" fill="#26456f">3 × 3 × … × 3　＝　59,049 通り</text>
<text x="40" y="136" font-family="sans-serif" font-size="12" fill="#5a6f92">1件30秒でも <tspan font-weight="700" fill="#c0392b">492時間</tspan>。毎日8時間やって<tspan font-weight="700" fill="#c0392b">3か月</tspan></text>

<path d="M348 98 L392 98" stroke="#9fb4d8" stroke-width="2"/>
<path d="M386 92 L394 98 L386 104" fill="none" stroke="#9fb4d8" stroke-width="2"/>

<rect x="404" y="42" width="292" height="112" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
<text x="420" y="64" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7a2f24">だから、どんな現場も必ず</text>
<text x="420" y="92" font-family="sans-serif" font-size="15" font-weight="700" fill="#c0392b">「やらないこと」を決めています</text>
<text x="420" y="118" font-family="sans-serif" font-size="12" fill="#9c5a4e">テストは、やることを決める作業ではなく</text>
<text x="420" y="138" font-family="sans-serif" font-size="12" font-weight="700" fill="#7a2f24">やらないことを決める作業です</text>

<rect x="24" y="170" width="672" height="52" rx="10" fill="#eef3ff" stroke="#9fb4d8" stroke-width="1.5"/>
<text x="40" y="192" font-family="sans-serif" font-size="12.5" fill="#26456f">1つの大きなテストにすると、<tspan font-weight="700">何をやらなかったか</tspan>が言えなくなります。</text>
<text x="40" y="212" font-family="sans-serif" font-size="12.5" fill="#26456f">だから切り口ごとに分けます —— <tspan font-weight="700">単体・結合・機能・シナリオ</tspan>。<tspan font-weight="700" fill="#c0392b">これが4段に分かれている理由です</tspan></text>

<rect x="24" y="236" width="672" height="46" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
<text x="40" y="257" font-family="sans-serif" font-size="12.5" fill="#1f5c39">そして<tspan font-weight="700">「やらない」の線は、動かせます。</tspan>自動化とAIで安くできた分だけ、やる側に移せます。</text>
<text x="40" y="275" font-family="sans-serif" font-size="12" fill="#3f7a5c">項目表を作ること自体が目的になったら、本末転倒です。<tspan font-weight="700">項目は納品物ではなく、範囲を言うための道具</tspan>です。</text>
</svg>
