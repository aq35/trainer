<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="不具合は組み合わせで出るため全部は試せない。だからやらないことを決め、言えるように切り口ごとに分ける">
<rect width="720" height="340" fill="#ffffff"/>
<text x="24" y="28" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#26456f">不具合を理論上100%防ぐ方法は、1つだけ。<tspan fill="#c0392b">全部の組み合わせを試すこと</tspan>です</text>
<text x="24" y="50" font-family="sans-serif" font-size="12.5" fill="#3d4652">入力欄が10個ある申込画面。1欄につき<tspan font-weight="700">「空 / ふつう / 変な値」の3通り</tspan>を試すとします</text>

<rect x="24" y="62" width="300" height="94" rx="10" fill="#f8fafd" stroke="#c7cede" stroke-width="1.5"/>
<text x="40" y="84" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#3d4652">欄ごとに、別々に試すなら</text>
<text x="40" y="112" font-family="monospace" font-size="15" font-weight="700" fill="#26456f">10 欄 × 3 通り ＝ 30 回</text>
<text x="40" y="138" font-family="sans-serif" font-size="12" fill="#5a6f92">これなら15分で終わります</text>

<path d="M334 109 L386 109" stroke="#c0392b" stroke-width="2"/>
<path d="M380 103 L388 109 L380 115" fill="none" stroke="#c0392b" stroke-width="2"/>

<rect x="396" y="62" width="300" height="94" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
<text x="412" y="84" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7a2f24">でも不具合は「組み合わせ」で出ます</text>
<text x="412" y="112" font-family="monospace" font-size="15" font-weight="700" fill="#c0392b">3 を10回かけて ＝ 59,049 通り</text>
<text x="412" y="138" font-family="sans-serif" font-size="12" fill="#9c5a4e">1件30秒でも492時間。毎日8時間で<tspan font-weight="700" fill="#c0392b">3か月</tspan></text>

<text x="24" y="176" font-family="sans-serif" font-size="12" fill="#5a6f92">「住所が空 <tspan font-weight="700" fill="#c0392b">かつ</tspan> 電話が変な値のときだけ落ちる」——こう壊れるので、欄ごとに30回試しても見つかりません</text>

<rect x="24" y="190" width="672" height="52" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
<text x="40" y="212" font-family="sans-serif" font-size="13" font-weight="700" fill="#c0392b">だから、どんな現場も必ず「やらないこと」を決めています</text>
<text x="40" y="232" font-family="sans-serif" font-size="12.5" fill="#7a2f24">テストは、やることを決める作業ではなく、<tspan font-weight="700">やらないことを決める作業</tspan>です</text>

<rect x="24" y="252" width="672" height="34" rx="9" fill="#eef3ff" stroke="#9fb4d8" stroke-width="1.5"/>
<text x="40" y="274" font-family="sans-serif" font-size="12.5" fill="#26456f">1つの大きなテストにすると<tspan font-weight="700">何をやらなかったかが言えない</tspan>ので、<tspan font-weight="700" fill="#c0392b">切り口ごとに分けます</tspan></text>

<rect x="24" y="296" width="672" height="34" rx="9" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
<text x="40" y="318" font-family="sans-serif" font-size="12.5" fill="#1f5c39">そして<tspan font-weight="700">「やらない」の線は動かせます。</tspan>自動化とAIで安くできた分だけ、やる側へ</text>
</svg>
