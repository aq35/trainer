<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="手元のパソコンとGitHubの関係">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b6472" text-anchor="middle">GitHub は「インターネット上の、もう1つの保管場所」です</text>

  <!-- local -->
  <rect x="40" y="52" width="250" height="170" rx="10" fill="#f7f8fa" stroke="#c7cede" stroke-width="1.5"/>
  <text x="165" y="78" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#3d4652" text-anchor="middle">自分のパソコン</text>
  <rect x="90" y="94" width="150" height="92" rx="8" fill="#ffffff" stroke="#a8b2c1" stroke-width="1.5"/>
  <rect x="104" y="110" width="122" height="9" rx="3" fill="#dbe2ec"/>
  <rect x="104" y="126" width="90" height="9" rx="3" fill="#dbe2ec"/>
  <line x1="104" y1="150" x2="226" y2="150" stroke="#3aa76d" stroke-width="2"/>
  <circle cx="114" cy="150" r="6" fill="#ffffff" stroke="#3aa76d" stroke-width="2"/>
  <circle cx="165" cy="150" r="6" fill="#ffffff" stroke="#3aa76d" stroke-width="2"/>
  <circle cx="216" cy="150" r="7" fill="#3aa76d"/>
  <text x="165" y="176" font-family="sans-serif" font-size="11" fill="#5b6472" text-anchor="middle">commit した履歴</text>
  <text x="165" y="208" font-family="sans-serif" font-size="11.5" fill="#8892a0" text-anchor="middle">パソコンが壊れたら、全部消えます</text>

  <!-- arrow -->
  <path d="M306 122 L414 122" stroke="#2f6fed" stroke-width="3" marker-end="url(#up)"/>
  <text x="360" y="112" font-family="sans-serif" font-size="13" font-weight="700" fill="#2f6fed" text-anchor="middle">アップロード</text>
  <text x="360" y="146" font-family="sans-serif" font-size="11.5" fill="#8892a0" text-anchor="middle">（push / 公開 と呼びます）</text>

  <!-- github -->
  <rect x="430" y="52" width="250" height="170" rx="10" fill="#f1f4f9" stroke="#c7cede" stroke-width="1.5"/>
  <text x="555" y="78" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#3d4652" text-anchor="middle">GitHub（インターネット上）</text>
  <circle cx="555" cy="126" r="26" fill="#24292f"/>
  <path d="M555 110c-8.8 0-16 7.2-16 16 0 7.1 4.6 13.1 10.9 15.2.8.1 1.1-.3 1.1-.8v-2.8c-4.5 1-5.4-2.1-5.4-2.1-.7-1.9-1.8-2.4-1.8-2.4-1.5-1 .1-1 .1-1 1.6.1 2.5 1.7 2.5 1.7 1.4 2.5 3.8 1.8 4.7 1.4.1-1.1.6-1.8 1-2.2-3.6-.4-7.4-1.8-7.4-8 0-1.8.6-3.2 1.7-4.4-.2-.4-.7-2.1.2-4.3 0 0 1.4-.4 4.4 1.7 1.3-.4 2.6-.5 4-.5s2.7.2 4 .5c3-2.1 4.4-1.7 4.4-1.7.9 2.2.3 3.9.2 4.3 1 1.1 1.7 2.6 1.7 4.4 0 6.2-3.8 7.6-7.4 8 .6.5 1.1 1.5 1.1 3v4.4c0 .4.3.9 1.1.8 6.3-2.1 10.9-8.1 10.9-15.2 0-8.8-7.2-16-16-16z" fill="#ffffff"/>
  <text x="555" y="176" font-family="sans-serif" font-size="11" fill="#5b6472" text-anchor="middle">同じ履歴のコピーが置かれる</text>
  <text x="555" y="208" font-family="sans-serif" font-size="11.5" fill="#2b7d52" text-anchor="middle">パソコンが壊れても残ります</text>

  <rect x="120" y="248" width="480" height="40" rx="9" fill="#eef3ff" stroke="#c9dbff" stroke-width="1.5"/>
  <text x="360" y="273" font-family="sans-serif" font-size="12.5" fill="#2f6fed" text-anchor="middle">仲間と同じものを見られるようになるのも、GitHub に上げるからです</text>

  <defs>
    <marker id="up" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2f6fed"/>
    </marker>
  </defs>
</svg>
