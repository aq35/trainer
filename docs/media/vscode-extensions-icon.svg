<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="VS Codeの左側にある拡張機能アイコンの位置">
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="34" fill="#e7eaf0"/>
  <circle cx="18" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="17" r="6" fill="#febc2e"/>
  <circle cx="58" cy="17" r="6" fill="#28c840"/>
  <text x="320" y="22" font-family="sans-serif" font-size="13" fill="#5b6472" text-anchor="middle">Visual Studio Code</text>

  <rect x="0" y="34" width="48" height="326" fill="#2f3542"/>
  <g fill="#9aa3b2">
    <rect x="14" y="52" width="20" height="20" rx="3"/>
    <rect x="14" y="86" width="20" height="20" rx="3"/>
  </g>
  <g>
    <rect x="10" y="118" width="28" height="28" rx="4" fill="#2f6fed"/>
    <rect x="16" y="124" width="6" height="6" fill="#ffffff"/>
    <rect x="24" y="124" width="6" height="6" fill="#ffffff"/>
    <rect x="16" y="132" width="6" height="6" fill="#ffffff"/>
    <rect x="24" y="132" width="6" height="6" fill="#ffffff"/>
  </g>
  <circle cx="24" cy="132" r="26" fill="none" stroke="#ff5f57" stroke-width="3"/>

  <rect x="48" y="34" width="592" height="326" fill="#f7f8fa"/>
  <text x="330" y="150" font-family="sans-serif" font-size="20" fill="#5b6472" text-anchor="middle">
    左のバーにある四角いアイコン（拡張機能）をクリック
  </text>
  <line x1="70" y1="132" x2="180" y2="150" stroke="#ff5f57" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ff5f57"/>
    </marker>
  </defs>
</svg>
