<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="AIと人の分担。AIが書き、人が確認して決める">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b6472" text-anchor="middle">AIと一緒に作るときの分担</text>

  <rect x="30" y="52" width="200" height="150" rx="10" fill="#fdf3ef" stroke="#e8b9a3" stroke-width="1.5"/>
  <text x="130" y="78" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#a5522f" text-anchor="middle">AI がやること</text>
  <g font-family="sans-serif" font-size="12.5" fill="#5b6472">
    <text x="52" y="106">・書き方を調べる</text><text x="52" y="130">・コードを書く</text>
    <text x="52" y="154">・変更案を出す</text><text x="52" y="178">・エラーを解説する</text>
  </g>

  <path d="M242 127 L288 127" stroke="#2f6fed" stroke-width="3" marker-end="url(#a1)"/>
  <text x="265" y="116" font-family="sans-serif" font-size="11.5" fill="#2f6fed" text-anchor="middle">提案</text>

  <rect x="300" y="52" width="130" height="150" rx="10" fill="#eef3ff" stroke="#c9dbff" stroke-width="1.5"/>
  <text x="365" y="78" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#2f6fed" text-anchor="middle">差分</text>
  <g font-family="monospace" font-size="11.5">
    <text x="318" y="106" fill="#8892a0">  そのまま</text>
    <text x="318" y="128" fill="#c0392b">- 消える行</text>
    <text x="318" y="150" fill="#2b7d52">+ 増える行</text>
  </g>
  <text x="365" y="180" font-family="sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle">ここを読む</text>

  <path d="M442 127 L488 127" stroke="#2f6fed" stroke-width="3" marker-end="url(#a1)"/>

  <rect x="500" y="52" width="190" height="150" rx="10" fill="#f1faf4" stroke="#b7e3c6" stroke-width="1.5"/>
  <text x="595" y="78" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#2b7d52" text-anchor="middle">あなたがやること</text>
  <g font-family="sans-serif" font-size="12.5" fill="#5b6472">
    <text x="520" y="106">・何をしたいか伝える</text><text x="520" y="130">・差分を読む</text>
    <text x="520" y="154">・OKか断るか決める</text><text x="520" y="178">・commit で記録する</text>
  </g>

  <rect x="90" y="234" width="540" height="46" rx="9" fill="#fff8e9" stroke="#f0d9a8" stroke-width="1.5"/>
  <text x="360" y="253" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#8a6412" text-anchor="middle">決めるのは、いつも人のほうです。</text>
  <text x="360" y="271" font-family="sans-serif" font-size="12" fill="#8a6412" text-anchor="middle">読まずにOKを押し続けると、何が起きているか分からなくなります。</text>

  <defs><marker id="a1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2f6fed"/></marker></defs>
</svg>
