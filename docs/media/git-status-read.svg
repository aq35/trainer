<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="git status の出力の読み方">
  <rect width="720" height="300" fill="#ffffff"/>

  <text x="360" y="24" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#5b6472" text-anchor="middle">英語がびっしり出ますが、見るのは2か所だけです</text>

  <rect x="30" y="40" width="450" height="220" rx="8" fill="#22262f"/>
  <g font-family="monospace" font-size="12.5">
    <text x="48" y="66" fill="#8fe08f">&gt; git status</text>
    <text x="48" y="92" fill="#9aa3b2">On branch main</text>

    <text x="48" y="126" fill="#e6eaf2">Changes to be committed:</text>
    <text x="66" y="148" fill="#8fe08f">new file:   hello.txt</text>

    <text x="48" y="182" fill="#e6eaf2">Changes not staged for commit:</text>
    <text x="66" y="204" fill="#ff8f8f">modified:   memo.txt</text>

    <text x="48" y="238" fill="#9aa3b2">nothing added to commit</text>
  </g>

  <!-- green callout -->
  <path d="M492 130 L520 130" stroke="#3aa76d" stroke-width="2"/>
  <rect x="520" y="102" width="180" height="60" rx="8" fill="#f1faf4" stroke="#b7e3c6" stroke-width="1.5"/>
  <text x="610" y="124" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#2b7d52" text-anchor="middle">ステージに載っている</text>
  <text x="610" y="145" font-family="sans-serif" font-size="11.5" fill="#3d4652" text-anchor="middle">commit すれば記録される</text>

  <!-- red callout -->
  <path d="M492 190 L520 190" stroke="#c0392b" stroke-width="2"/>
  <rect x="520" y="162" width="180" height="60" rx="8" fill="#fdf1f0" stroke="#f0c2bd" stroke-width="1.5"/>
  <text x="610" y="184" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="middle">まだ載っていない</text>
  <text x="610" y="205" font-family="sans-serif" font-size="11.5" fill="#3d4652" text-anchor="middle">add しないと記録されない</text>

  <text x="360" y="286" font-family="sans-serif" font-size="12.5" fill="#3d4652" text-anchor="middle">緑は「準備できた」、赤は「まだ」。迷ったら status を打つ、が基本です。</text>
</svg>
