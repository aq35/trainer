<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="AIは次に来そうな言葉を予測して文章を作っているという図">
  <rect width="720" height="290" fill="#ffffff"/>
  <text x="360" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b6472" text-anchor="middle">AIは「調べて」いるのではなく、「次に来そうな言葉」を選んでいます</text>

  <rect x="40" y="52" width="250" height="52" rx="9" fill="#f4f6fa" stroke="#c7cede" stroke-width="1.5"/>
  <text x="165" y="84" font-family="sans-serif" font-size="15" fill="#3d4652" text-anchor="middle">「今日は とても いい …」</text>
  <path d="M300 78 L346 78" stroke="#8892a0" stroke-width="2.5" marker-end="url(#p2)"/>

  <g>
    <rect x="360" y="46" width="230" height="30" rx="7" fill="#eefaf1" stroke="#b7e3c6" stroke-width="1.5"/>
    <text x="378" y="66" font-family="sans-serif" font-size="13" fill="#2b7d52">天気</text>
    <rect x="470" y="53" width="100" height="14" rx="7" fill="#d7f0e0"/>
    <rect x="470" y="53" width="82" height="14" rx="7" fill="#3aa76d"/>
    <text x="600" y="66" font-family="sans-serif" font-size="11.5" fill="#2b7d52">よくある</text>
  </g>
  <g>
    <rect x="360" y="84" width="230" height="30" rx="7" fill="#f7f8fa" stroke="#c7cede"/>
    <text x="378" y="104" font-family="sans-serif" font-size="13" fill="#5b6472">一日</text>
    <rect x="470" y="91" width="100" height="14" rx="7" fill="#e7ebf3"/>
    <rect x="470" y="91" width="40" height="14" rx="7" fill="#8892a0"/>
  </g>
  <g>
    <rect x="360" y="122" width="230" height="30" rx="7" fill="#f7f8fa" stroke="#c7cede"/>
    <text x="378" y="142" font-family="sans-serif" font-size="13" fill="#5b6472">気分</text>
    <rect x="470" y="129" width="100" height="14" rx="7" fill="#e7ebf3"/>
    <rect x="470" y="129" width="18" height="14" rx="7" fill="#8892a0"/>
  </g>

  <text x="475" y="176" font-family="sans-serif" font-size="12" fill="#8892a0" text-anchor="middle">この中から、それらしいものを選ぶ</text>

  <rect x="60" y="202" width="600" height="66" rx="10" fill="#fff8e9" stroke="#f0d9a8" stroke-width="1.5"/>
  <text x="360" y="226" font-family="sans-serif" font-size="13" font-weight="700" fill="#8a6412" text-anchor="middle">だから、AIは「知らない」ときも黙りません。</text>
  <text x="360" y="248" font-family="sans-serif" font-size="12.5" fill="#8a6412" text-anchor="middle">それらしい言葉を選び続けた結果、<tspan font-weight="700">自信たっぷりに間違える</tspan>ことがあります。</text>

  <defs><marker id="p2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8892a0"/></marker></defs>
</svg>
