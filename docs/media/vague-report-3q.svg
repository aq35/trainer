<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="あいまいな不具合報告に対して聞き返す3つの質問。立場が逆でも同じ情報が要る">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">「なんかおかしいです」に、この3つを返します</text>

  <rect x="24" y="42" width="672" height="34" rx="8" fill="#f7f9fd" stroke="#c7cede"/>
  <text x="44" y="64" font-family="sans-serif" font-size="11.5" fill="#8892a0">届いた報告　→　<tspan font-size="12" font-weight="700" fill="#7a2f24">「なんか、タスクの表示がおかしい気がします」</tspan></text>

  <rect x="24" y="88" width="672" height="46" rx="8" fill="#eef4ff" stroke="#9fb4d8" stroke-width="1.5"/>
  <text x="44" y="110" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#26456f">① 何をしたら、そうなりましたか？</text>
  <text x="380" y="110" font-family="sans-serif" font-size="11" fill="#5a6f92">＝ 操作の順番</text>
  <text x="44" y="127" font-family="sans-serif" font-size="10.5" fill="#5a6f92">これが無いと、<tspan font-weight="700">再現できません</tspan>。再現できない不具合は、直したかも確認できません</text>

  <rect x="24" y="142" width="672" height="46" rx="8" fill="#eef4ff" stroke="#9fb4d8" stroke-width="1.5"/>
  <text x="44" y="164" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#26456f">② どうなると思っていて、実際はどうなりましたか？</text>
  <text x="440" y="164" font-family="sans-serif" font-size="11" fill="#5a6f92">＝ 期待と現実</text>
  <text x="44" y="181" font-family="sans-serif" font-size="10.5" fill="#5a6f92">相手にとっての「おかしい」が、<tspan font-weight="700">仕様どおりのこともあります</tspan></text>

  <rect x="24" y="196" width="672" height="46" rx="8" fill="#eef4ff" stroke="#9fb4d8" stroke-width="1.5"/>
  <text x="44" y="218" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#26456f">③ いつからですか？ 毎回ですか？</text>
  <text x="380" y="218" font-family="sans-serif" font-size="11" fill="#5a6f92">＝ 範囲の切り分け</text>
  <text x="44" y="235" font-family="sans-serif" font-size="10.5" fill="#5a6f92">「昨日から」なら、<tspan font-weight="700">昨日の変更が犯人</tspan>。ここだけで原因が絞れることがあります</text>

  <rect x="24" y="252" width="672" height="34" rx="8" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
  <text x="44" y="274" font-family="sans-serif" font-size="11.5" fill="#1f5c39">＋ できれば <tspan font-weight="700">画面のスクリーンショットを1枚</tspan>　——　文章10行より速いです</text>

  <path d="M24 300 L696 300" stroke="#c7cede" stroke-width="1"/>
  <text x="24" y="320" font-family="sans-serif" font-size="12" fill="#26456f">言い方は「情報が足りません」ではなく　<tspan font-weight="700" fill="#2f8f4e">「見てみます。特定したいので3つだけ教えてください」</tspan></text>
  <text x="24" y="336" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#c0392b">この3つは、あなたが相談する側になったときも、そのまま使えます。立場が逆になるだけです。</text>
</svg>
