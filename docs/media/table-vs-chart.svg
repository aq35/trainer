<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="同じ数字を表とグラフで見た比較。グラフだと急に立ち上がる形が一目で分かる">
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="150" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#8892a0" text-anchor="middle">表で見ると</text>
  <text x="480" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#2f6fed" text-anchor="middle">グラフで見ると</text>

  <g font-family="sans-serif" font-size="12.5" fill="#3d4652">
    <rect x="48" y="42" width="204" height="26" fill="#f4f6fa"/>
    <text x="62" y="60" font-weight="700">件数</text><text x="238" y="60" font-weight="700" text-anchor="end">時間</text>
    <text x="62" y="88">500</text><text x="238" y="88" text-anchor="end">1.2 ms</text>
    <text x="62" y="114">1,000</text><text x="238" y="114" text-anchor="end">5.2 ms</text>
    <text x="62" y="140">2,000</text><text x="238" y="140" text-anchor="end">21.7 ms</text>
    <text x="62" y="166">4,000</text><text x="238" y="166" text-anchor="end">79.7 ms</text>
    <text x="62" y="192">8,000</text><text x="238" y="192" text-anchor="end">335.7 ms</text>
  </g>
  <g stroke="#e1e6ee" stroke-width="1">
    <path d="M48 68 L252 68"/><path d="M48 94 L252 94"/><path d="M48 120 L252 120"/>
    <path d="M48 146 L252 146"/><path d="M48 172 L252 172"/><path d="M48 198 L252 198"/>
  </g>
  <text x="150" y="238" font-family="sans-serif" font-size="12" fill="#8892a0" text-anchor="middle">数字は正確。でも——</text>
  <text x="150" y="262" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="middle">「2倍で4倍」に気づけますか？</text>
  <text x="150" y="286" font-family="sans-serif" font-size="11.5" fill="#8892a0" text-anchor="middle">割り算をすれば分かる。</text>
  <text x="150" y="304" font-family="sans-serif" font-size="11.5" fill="#8892a0" text-anchor="middle">でも、してくれる人はいない</text>

  <path d="M330 210 L330 42" stroke="#c7cede" stroke-width="1.5"/>
  <path d="M330 210 L666 210" stroke="#c7cede" stroke-width="1.5"/>

  <g fill="#2f6fed">
    <rect x="350" y="209" width="42" height="1"/>
    <rect x="414" y="208" width="42" height="2"/>
    <rect x="478" y="199" width="42" height="11"/>
    <rect x="542" y="170" width="42" height="40"/>
    <rect x="606" y="42" width="42" height="168"/>
  </g>
  <g font-family="sans-serif" font-size="10.5" fill="#8892a0" text-anchor="middle">
    <text x="371" y="226">500</text>
    <text x="435" y="226">1,000</text>
    <text x="499" y="226">2,000</text>
    <text x="563" y="226">4,000</text>
    <text x="627" y="226">8,000</text>
  </g>
  <text x="627" y="36" font-family="sans-serif" font-size="10.5" fill="#2f6fed" text-anchor="middle">335.7ms</text>
  <text x="322" y="46" font-family="sans-serif" font-size="10.5" fill="#8892a0" text-anchor="end">ms</text>
  <text x="322" y="212" font-family="sans-serif" font-size="10.5" fill="#8892a0" text-anchor="end">0</text>

  <text x="480" y="262" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#2f8f4e" text-anchor="middle">説明しなくても「まずい」が伝わる</text>
  <text x="480" y="288" font-family="sans-serif" font-size="11.5" fill="#8892a0" text-anchor="middle">可視化の仕事は、きれいにすることではなく</text>
  <text x="480" y="306" font-family="sans-serif" font-size="11.5" fill="#8892a0" text-anchor="middle">気づけるようにすること</text>
</svg>
