<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="全文検索は同じ文字を全部拾うが、参照の検索は同じものを指している場所だけを拾うという違いの図">
  <rect width="720" height="360" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">同じ「tasks」という5文字でも、意味は全部ちがいます</text>

  <rect x="24" y="42" width="672" height="150" rx="10" fill="#f7f9fd" stroke="#c7cede" stroke-width="1.5"/>

  <text x="44" y="66" font-family="monospace" font-size="11" fill="#5b6472">public/logic.js</text>
  <rect x="44" y="74" width="290" height="24" rx="4" fill="#ffffff" stroke="#c7cede"/>
  <text x="54" y="91" font-family="monospace" font-size="10.5" fill="#26456f">export function countRemaining(tasks) {</text>
  <text x="346" y="91" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#2f8f4e">← 本物（定義の引数）</text>

  <rect x="44" y="104" width="290" height="24" rx="4" fill="#ffffff" stroke="#c7cede"/>
  <text x="54" y="121" font-family="monospace" font-size="10.5" fill="#26456f">  return tasks.filter(t =&gt; !t.done).length</text>
  <text x="346" y="121" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#2f8f4e">← 本物（同じものを指す）</text>

  <text x="44" y="150" font-family="monospace" font-size="11" fill="#5b6472">public/app.js ほか</text>
  <rect x="44" y="158" width="290" height="24" rx="4" fill="#ffffff" stroke="#c7cede"/>
  <text x="54" y="175" font-family="monospace" font-size="10.5" fill="#8892a0">// tasks.json を読み込む　data/tasks.json</text>
  <text x="346" y="175" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#c0392b">← 別物（コメント・ファイル名）</text>

  <rect x="24" y="208" width="330" height="90" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
  <text x="44" y="232" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7a2f24">全文検索（Ctrl+Shift+F）</text>
  <text x="44" y="252" font-family="sans-serif" font-size="11" fill="#a05a4c">見ているもの: <tspan font-weight="700">文字が一致するか</tspan></text>
  <rect x="44" y="262" width="270" height="20" rx="4" fill="#e6b5ad"/>
  <text x="179" y="277" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">50件以上ヒット</text>

  <rect x="366" y="208" width="330" height="90" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
  <text x="386" y="232" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39">すべての参照を検索（Shift+F12）</text>
  <text x="386" y="252" font-family="sans-serif" font-size="11" fill="#4a7a5f">見ているもの: <tspan font-weight="700">同じものを指しているか</tspan></text>
  <rect x="386" y="262" width="30" height="20" rx="4" fill="#a9d5bb"/>
  <text x="424" y="277" font-family="sans-serif" font-size="11" font-weight="700" fill="#1f5c39">数件だけ</text>

  <path d="M24 316 L696 316" stroke="#c7cede" stroke-width="1"/>
  <text x="24" y="340" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0392b">読まずに済んだ45件ぶんの時間が、まるごと消えます。</text>
  <text x="24" y="356" font-family="sans-serif" font-size="11.5" fill="#26456f">ただし全文検索も使います —— コメント・README・設定ファイルなど、<tspan font-weight="700">コードでない場所</tspan>はこちらが勝ちます。</text>
</svg>
