<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="大きなコードは全部読まず、外側から4段階でざっくりした地図を作るという図">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">外側から。中身は1行も読みません</text>

  <rect x="24" y="42" width="160" height="150" rx="10" fill="#eef4ff" stroke="#9fb4d8" stroke-width="1.5"/>
  <text x="104" y="66" font-family="sans-serif" font-size="12" font-weight="700" fill="#26456f" text-anchor="middle">① README</text>
  <text x="104" y="88" font-family="sans-serif" font-size="11" fill="#5a6f92" text-anchor="middle">最初の10行だけ</text>
  <rect x="44" y="100" width="120" height="4" rx="2" fill="#9fb4d8"/>
  <rect x="44" y="110" width="120" height="4" rx="2" fill="#9fb4d8"/>
  <rect x="44" y="120" width="90" height="4" rx="2" fill="#9fb4d8"/>
  <rect x="44" y="134" width="120" height="4" rx="2" fill="#e8ecf3"/>
  <rect x="44" y="144" width="120" height="4" rx="2" fill="#e8ecf3"/>
  <rect x="44" y="154" width="120" height="4" rx="2" fill="#e8ecf3"/>
  <text x="104" y="180" font-family="sans-serif" font-size="10.5" fill="#8892a0" text-anchor="middle">残りは読まない</text>

  <path d="M190 117 L208 117" stroke="#9fb4d8" stroke-width="2"/><path d="M202 112 L211 117 L202 122 Z" fill="#9fb4d8"/>

  <rect x="214" y="42" width="160" height="150" rx="10" fill="#eef4ff" stroke="#9fb4d8" stroke-width="1.5"/>
  <text x="294" y="66" font-family="sans-serif" font-size="12" font-weight="700" fill="#26456f" text-anchor="middle">② フォルダ名</text>
  <text x="294" y="88" font-family="sans-serif" font-size="11" fill="#5a6f92" text-anchor="middle">名前だけ眺める</text>
  <text x="238" y="112" font-family="monospace" font-size="10.5" fill="#26456f">docs/</text>
  <text x="238" y="132" font-family="monospace" font-size="10.5" fill="#26456f">media/</text>
  <text x="238" y="152" font-family="monospace" font-size="10.5" fill="#26456f">test/</text>
  <text x="294" y="180" font-family="sans-serif" font-size="10.5" fill="#8892a0" text-anchor="middle">開かない</text>

  <path d="M380 117 L398 117" stroke="#9fb4d8" stroke-width="2"/><path d="M392 112 L401 117 L392 122 Z" fill="#9fb4d8"/>

  <rect x="404" y="42" width="160" height="150" rx="10" fill="#eef4ff" stroke="#9fb4d8" stroke-width="1.5"/>
  <text x="484" y="66" font-family="sans-serif" font-size="12" font-weight="700" fill="#26456f" text-anchor="middle">③ 拡張子</text>
  <text x="484" y="88" font-family="sans-serif" font-size="11" fill="#5a6f92" text-anchor="middle">役割の当たりを付ける</text>
  <text x="424" y="112" font-family="sans-serif" font-size="10.5" fill="#26456f"><tspan font-family="monospace">.md</tspan> … 文章</text>
  <text x="424" y="130" font-family="sans-serif" font-size="10.5" fill="#26456f"><tspan font-family="monospace">.html</tspan> … 画面</text>
  <text x="424" y="148" font-family="sans-serif" font-size="10.5" fill="#26456f"><tspan font-family="monospace">.js</tspan> … 動き</text>
  <text x="424" y="166" font-family="sans-serif" font-size="10.5" fill="#26456f"><tspan font-family="monospace">.css</tspan> … 見た目</text>

  <path d="M570 117 L588 117" stroke="#9fb4d8" stroke-width="2"/><path d="M582 112 L591 117 L582 122 Z" fill="#9fb4d8"/>

  <rect x="594" y="42" width="102" height="150" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
  <text x="645" y="66" font-family="sans-serif" font-size="12" font-weight="700" fill="#1f5c39" text-anchor="middle">④ 大きさ</text>
  <text x="645" y="88" font-family="sans-serif" font-size="11" fill="#4a7a5f" text-anchor="middle">最大のファイル</text>
  <rect x="614" y="100" width="62" height="10" rx="3" fill="#a9d5bb"/>
  <rect x="614" y="116" width="34" height="10" rx="3" fill="#d6e6dc"/>
  <rect x="614" y="132" width="22" height="10" rx="3" fill="#d6e6dc"/>
  <text x="645" y="166" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#1f5c39" text-anchor="middle">たいてい中心</text>

  <path d="M24 212 L696 212" stroke="#c7cede" stroke-width="1"/>

  <rect x="24" y="226" width="672" height="44" rx="9" fill="#fdf7e8" stroke="#e2c98a" stroke-width="1.5"/>
  <text x="360" y="254" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7a5c1a" text-anchor="middle">できあがるのは「なんとなくの地図」。正確でなくて構いません</text>

  <text x="24" y="296" font-family="sans-serif" font-size="12" fill="#26456f">大事なのは、<tspan font-weight="700">「まったくの真っ白」から「なんとなく」に変えること</tspan>。次の検索の効きが、まったく変わります。</text>
  <text x="24" y="322" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0392b">いきなりコードを開くと、必ず迷子になります。案件の初日は、この順番をそのまま使ってください。</text>
</svg>
