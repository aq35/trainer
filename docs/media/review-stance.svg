<svg xmlns="http://www.w3.org/2000/svg" width="720" height="256" viewBox="0 0 720 256" role="img" aria-label="レビューは向かい合って粗探しするものではなく、同じ側に並んで本線を守る作業">
<rect width="720" height="256" fill="#ffffff"/>
<rect x="24" y="20" width="330" height="212" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
<text x="189" y="45" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#c0392b" text-anchor="middle">よくある誤解：向かい合う</text>
<circle cx="105" cy="100" r="21" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<text x="105" y="105" font-family="sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">書く人</text>
<circle cx="273" cy="100" r="21" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<text x="273" y="105" font-family="sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">読む人</text>
<path d="M132 100 L240 100" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/>
<text x="189" y="90" font-family="sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">粗探し</text>
<text x="189" y="152" font-family="sans-serif" font-size="12.5" fill="#7a2f24" text-anchor="middle">指摘＝ダメ出し、と感じる</text>
<text x="189" y="176" font-family="sans-serif" font-size="12.5" fill="#7a2f24" text-anchor="middle">だから言いにくい／言われるとつらい</text>
<text x="189" y="206" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="middle">→ 誰も何も言わなくなります</text>
<rect x="366" y="20" width="330" height="212" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
<text x="531" y="45" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#1f5c39" text-anchor="middle">実際：同じ側に並ぶ</text>
<circle cx="437" cy="100" r="21" fill="#ffffff" stroke="#2f8f4e" stroke-width="2"/>
<text x="437" y="105" font-family="sans-serif" font-size="12" fill="#1f5c39" text-anchor="middle">書く人</text>
<circle cx="489" cy="100" r="21" fill="#ffffff" stroke="#2f8f4e" stroke-width="2"/>
<text x="489" y="105" font-family="sans-serif" font-size="12" fill="#1f5c39" text-anchor="middle">読む人</text>
<path d="M516 100 L596 100" stroke="#2f8f4e" stroke-width="2"/><path d="M596 94 L608 100 L596 106 Z" fill="#2f8f4e"/>
<rect x="614" y="80" width="66" height="40" rx="8" fill="#ffffff" stroke="#2f8f4e" stroke-width="2"/>
<text x="647" y="105" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39" text-anchor="middle">本線</text>
<text x="531" y="152" font-family="sans-serif" font-size="12.5" fill="#1f5c39" text-anchor="middle">2人で「本線に入れて大丈夫か」を確かめる</text>
<text x="531" y="176" font-family="sans-serif" font-size="12.5" fill="#1f5c39" text-anchor="middle">見ているのは相手ではなく、コード</text>
<text x="531" y="206" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39" text-anchor="middle">→ 指摘は、味方からの情報です</text>
</svg>
