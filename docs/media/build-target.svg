<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="これから作るページ。ボタンを押すと文字が変わる">
  <rect width="720" height="280" fill="#ffffff"/>
  <text x="360" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b6472" text-anchor="middle">これから作るもの（ブラウザで動く、小さなページ）</text>

  <rect x="60" y="46" width="270" height="180" rx="10" fill="#ffffff" stroke="#c7cede" stroke-width="1.5"/>
  <rect x="60" y="46" width="270" height="28" rx="10" fill="#eef1f6"/><rect x="60" y="64" width="270" height="10" fill="#eef1f6"/>
  <circle cx="76" cy="60" r="4" fill="#ff5f57"/><circle cx="90" cy="60" r="4" fill="#febc2e"/><circle cx="104" cy="60" r="4" fill="#28c840"/>
  <text x="195" y="112" font-family="sans-serif" font-size="17" font-weight="700" fill="#2f3542" text-anchor="middle">はじめてのページ</text>
  <text x="195" y="140" font-family="sans-serif" font-size="13" fill="#5b6472" text-anchor="middle">ここに文字が出ます</text>
  <rect x="145" y="160" width="100" height="34" rx="8" fill="#2f6fed"/>
  <text x="195" y="182" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">押してね</text>

  <path d="M348 136 L392 136" stroke="#3aa76d" stroke-width="3" marker-end="url(#b1)"/>
  <text x="370" y="126" font-family="sans-serif" font-size="11.5" fill="#3aa76d" text-anchor="middle">クリック</text>

  <rect x="404" y="46" width="270" height="180" rx="10" fill="#ffffff" stroke="#b7e3c6" stroke-width="2"/>
  <rect x="404" y="46" width="270" height="28" rx="10" fill="#eef1f6"/><rect x="404" y="64" width="270" height="10" fill="#eef1f6"/>
  <circle cx="420" cy="60" r="4" fill="#ff5f57"/><circle cx="434" cy="60" r="4" fill="#febc2e"/><circle cx="448" cy="60" r="4" fill="#28c840"/>
  <text x="539" y="112" font-family="sans-serif" font-size="17" font-weight="700" fill="#2f3542" text-anchor="middle">はじめてのページ</text>
  <text x="539" y="140" font-family="sans-serif" font-size="13" font-weight="700" fill="#2b7d52" text-anchor="middle">こんにちは！</text>
  <rect x="489" y="160" width="100" height="34" rx="8" fill="#2f6fed"/>
  <text x="539" y="182" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">押してね</text>

  <text x="360" y="256" font-family="sans-serif" font-size="12.5" fill="#3d4652" text-anchor="middle">ボタンを押すと文字が変わる。たったこれだけですが、立派なプログラムです。</text>
  <defs><marker id="b1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3aa76d"/></marker></defs>
</svg>
