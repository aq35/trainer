<svg xmlns="http://www.w3.org/2000/svg" width="720" height="298" viewBox="0 0 720 298" role="img" aria-label="AIに貼る場合とMCPでつなぐ場合の、影響が届く範囲の違いと5つのルール">
<rect width="720" height="298" fill="#ffffff"/>
<rect x="24" y="20" width="330" height="118" rx="10" fill="#f6f8fc" stroke="#c7cede" stroke-width="1.5"/>
<text x="189" y="45" font-family="sans-serif" font-size="13" font-weight="700" fill="#3d4652" text-anchor="middle">これまで：AIに「貼る」</text>
<rect x="120" y="62" width="138" height="40" rx="8" fill="#ffffff" stroke="#8892a0" stroke-width="1.5"/>
<text x="189" y="87" font-family="sans-serif" font-size="12.5" fill="#3d4652" text-anchor="middle">あなたが選んだ分だけ</text>
<text x="189" y="124" font-family="sans-serif" font-size="12" fill="#8892a0" text-anchor="middle">届く範囲は、あなたが決めています</text>
<rect x="366" y="20" width="330" height="118" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
<text x="531" y="45" font-family="sans-serif" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">これから：MCP で「つなぐ」</text>
<rect x="462" y="62" width="138" height="40" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="531" y="87" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="middle">鍵が許した範囲すべて</text>
<text x="531" y="124" font-family="sans-serif" font-size="12" fill="#9c5a4e" text-anchor="middle">AIが自分で見に行き、自分で操作します</text>
<text x="24" y="168" font-family="sans-serif" font-size="13" fill="#3d4652">つなぐ＝<tspan font-weight="700" fill="#c0392b">会社のデータに、AIの手が届くようにすること</tspan>です。</text>
<rect x="24" y="184" width="672" height="94" rx="10" fill="#eef3ff" stroke="#9fb4d8" stroke-width="1.5"/>
<text x="44" y="208" font-family="sans-serif" font-size="12.5" fill="#26456f">① 鍵は必要な分だけ・期限つきで。迷ったら Read-only から</text>
<text x="44" y="230" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">② 鍵をリポジトリに入れない　—— ここが、いちばん事故になります</text>
<text x="44" y="250" font-family="sans-serif" font-size="12.5" fill="#26456f">③ 案件では、必ず先に許可を取る　　④ 確認モードを切らない</text>
<text x="44" y="270" font-family="sans-serif" font-size="12.5" fill="#26456f">⑤ 使わなくなったら、外す・鍵を無効にする</text>
</svg>
