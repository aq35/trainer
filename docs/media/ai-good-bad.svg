<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="AIが得意なことと苦手なことの比較">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b6472" text-anchor="middle">頼み方を選べば、間違いはぐっと減ります</text>

  <rect x="30" y="44" width="320" height="196" rx="10" fill="#f1faf4" stroke="#b7e3c6" stroke-width="1.5"/>
  <text x="190" y="70" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#2b7d52" text-anchor="middle">得意（すぐ確かめられる）</text>
  <g font-family="sans-serif" font-size="12.5" fill="#3d4652">
    <text x="54" y="100">・エラーの意味を説明する</text>
    <text x="54" y="126">・目の前のコードを読んで直す</text>
    <text x="54" y="152">・小さくて範囲がはっきりした変更</text>
    <text x="54" y="178">・書き方の候補を出す</text>
    <text x="54" y="204">・面倒な繰り返し作業</text>
  </g>
  <text x="190" y="228" font-family="sans-serif" font-size="11.5" fill="#2b7d52" text-anchor="middle">動かせば、合っているか分かる</text>

  <rect x="370" y="44" width="320" height="196" rx="10" fill="#fdf1f0" stroke="#f0c2bd" stroke-width="1.5"/>
  <text x="530" y="70" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#c0392b" text-anchor="middle">苦手（確かめにくい）</text>
  <g font-family="sans-serif" font-size="12.5" fill="#3d4652">
    <text x="394" y="100">・最新の情報や、変わりやすい事実</text>
    <text x="394" y="126">・社内のルールや、決まりごと</text>
    <text x="394" y="152">・「いい感じにして」など曖昧な依頼</text>
    <text x="394" y="178">・一度に大量のファイルを書き換える</text>
    <text x="394" y="204">・正解が1つに決まらない判断</text>
  </g>
  <text x="530" y="228" font-family="sans-serif" font-size="11.5" fill="#c0392b" text-anchor="middle">それらしく答えるが、当たっているとは限らない</text>

  <rect x="90" y="256" width="540" height="34" rx="9" fill="#eef3ff" stroke="#c9dbff" stroke-width="1.5"/>
  <text x="360" y="278" font-family="sans-serif" font-size="12.5" fill="#2f6fed" text-anchor="middle">迷ったら「自分が確かめられる形」に切り分けて頼むのがコツです。</text>
</svg>
