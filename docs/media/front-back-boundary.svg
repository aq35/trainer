<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="ブラウザとサーバーの間にAPIがあり、Consoleはブラウザ側、Networkは境目を見る道具だという図">
  <rect width="720" height="330" fill="#ffffff"/>

  <text x="160" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#2f6fed" text-anchor="middle">フロントエンド（あなたのブラウザ）</text>
  <text x="576" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#7a5cc4" text-anchor="middle">バックエンド（向こう側）</text>

  <rect x="24" y="40" width="272" height="150" rx="10" fill="#eef4ff" stroke="#9fb4d8" stroke-width="1.5"/>
  <text x="42" y="66" font-family="sans-serif" font-size="12" fill="#26456f">画面を組み立てる / データを読む</text>
  <rect x="42" y="78" width="236" height="30" rx="6" fill="#ffffff" stroke="#c7cede"/>
  <text x="54" y="98" font-family="monospace" font-size="11.5" fill="#3d4652">const data = await res.json()</text>
  <rect x="42" y="116" width="236" height="30" rx="6" fill="#ffffff" stroke="#c7cede"/>
  <text x="54" y="136" font-family="monospace" font-size="11.5" fill="#3d4652">data.map(t =&gt; t.title)</text>
  <text x="42" y="172" font-family="sans-serif" font-size="11.5" fill="#8892a0">ここで落ちると → TypeError</text>

  <rect x="456" y="40" width="240" height="150" rx="10" fill="#f4eefc" stroke="#c4aee6" stroke-width="1.5"/>
  <text x="474" y="66" font-family="sans-serif" font-size="12" fill="#4a2f77">データを探して、返す</text>
  <rect x="474" y="78" width="204" height="68" rx="6" fill="#ffffff" stroke="#c4aee6"/>
  <text x="486" y="100" font-family="sans-serif" font-size="11.5" fill="#4a2f77">あった → 200 ＋ 中身</text>
  <text x="486" y="122" font-family="sans-serif" font-size="11.5" fill="#4a2f77">無かった → 404</text>
  <text x="486" y="140" font-family="sans-serif" font-size="11.5" fill="#4a2f77">落ちた → 500</text>
  <text x="474" y="172" font-family="sans-serif" font-size="11.5" fill="#8892a0">ここが変だと → 4xx / 5xx</text>

  <path d="M316 40 L316 190" stroke="#e07a3a" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M436 40 L436 190" stroke="#e07a3a" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="322" y="86" width="108" height="26" rx="6" fill="#e07a3a"/>
  <text x="376" y="104" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">API（境目）</text>
  <path d="M322 128 L430 128" stroke="#8892a0" stroke-width="1.5"/>
  <path d="M422 122 L432 128 L422 134 Z" fill="#8892a0"/>
  <text x="376" y="124" font-family="sans-serif" font-size="10.5" fill="#8892a0" text-anchor="middle">頼む</text>
  <path d="M430 150 L322 150" stroke="#8892a0" stroke-width="1.5"/>
  <path d="M330 144 L320 150 L330 156 Z" fill="#8892a0"/>
  <text x="376" y="168" font-family="sans-serif" font-size="10.5" fill="#8892a0" text-anchor="middle">返す</text>

  <path d="M24 214 L696 214" stroke="#c7cede" stroke-width="1"/>
  <text x="24" y="240" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#3d4652">見る道具は2つ。見ている場所が違います</text>

  <rect x="24" y="252" width="320" height="30" rx="6" fill="#eef4ff"/>
  <text x="38" y="272" font-family="sans-serif" font-size="12" fill="#26456f"><tspan font-weight="700">Console</tspan> … ブラウザの中で起きたこと</text>
  <rect x="376" y="252" width="320" height="30" rx="6" fill="#fdf2ea"/>
  <text x="390" y="272" font-family="sans-serif" font-size="12" fill="#7a4520"><tspan font-weight="700">Network</tspan> … 境目を通った通信</text>

  <text x="360" y="308" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">片方だけ見て判断しない。迷ったら Network を先に</text>
</svg>
