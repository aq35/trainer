<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="ファイルを壊しても直前のセーブポイントに戻せることを示した図">
  <rect width="720" height="280" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b6472" text-anchor="middle">思いきり壊しても、1コマンドで戻ります</text>

  <!-- before -->
  <rect x="40" y="52" width="180" height="130" rx="8" fill="#f1faf4" stroke="#b7e3c6" stroke-width="1.5"/>
  <text x="130" y="76" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#2b7d52" text-anchor="middle">commit した状態</text>
  <g font-family="monospace" font-size="11.5" fill="#3d4652">
    <text x="60" y="104">こんにちは</text>
    <text x="60" y="126">よろしく</text>
  </g>
  <circle cx="130" cy="160" r="9" fill="#3aa76d"/>
  <text x="130" y="200" font-family="sans-serif" font-size="11" fill="#5b6472" text-anchor="middle">セーブ済み</text>

  <!-- arrow break -->
  <path d="M232 117 L288 117" stroke="#c0392b" stroke-width="2.5" marker-end="url(#br)"/>
  <text x="260" y="106" font-family="sans-serif" font-size="11.5" fill="#c0392b" text-anchor="middle">全部消す</text>

  <!-- broken -->
  <rect x="296" y="52" width="180" height="130" rx="8" fill="#fdf1f0" stroke="#f0c2bd" stroke-width="1.5"/>
  <text x="386" y="76" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="middle">壊した状態</text>
  <text x="386" y="120" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">（空っぽ）</text>
  <text x="386" y="152" font-family="sans-serif" font-size="11.5" fill="#8892a0" text-anchor="middle">やってしまった…</text>

  <!-- arrow restore -->
  <path d="M488 117 L544 117" stroke="#2f6fed" stroke-width="2.5" marker-end="url(#rs)"/>
  <text x="516" y="106" font-family="monospace" font-size="11.5" font-weight="700" fill="#2f6fed" text-anchor="middle">restore</text>

  <!-- restored -->
  <rect x="552" y="52" width="140" height="130" rx="8" fill="#f1faf4" stroke="#b7e3c6" stroke-width="1.5"/>
  <text x="622" y="76" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#2b7d52" text-anchor="middle">元どおり</text>
  <g font-family="monospace" font-size="11.5" fill="#3d4652">
    <text x="572" y="104">こんにちは</text>
    <text x="572" y="126">よろしく</text>
  </g>
  <text x="622" y="160" font-family="sans-serif" font-size="11.5" fill="#2b7d52" text-anchor="middle">何事もなかったように</text>

  <rect x="120" y="222" width="480" height="42" rx="8" fill="#eef3ff" stroke="#c9dbff" stroke-width="1.5"/>
  <text x="360" y="248" font-family="sans-serif" font-size="12.5" fill="#2f6fed" text-anchor="middle">commit しておけば怖くない。だから「こまめに commit」と言われます。</text>

  <defs>
    <marker id="br" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="rs" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2f6fed"/>
    </marker>
  </defs>
</svg>
