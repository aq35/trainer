  <rect width="720" height="250" fill="#ffffff"/>
  <text x="360" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b6472" text-anchor="middle">よくある勘違い: git と GitHub は「別物」です</text>

