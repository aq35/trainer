<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="詰まってから15分で手を止めて相談に切り替える15分ルールの時間軸">
  <rect width="720" height="330" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">「詰まった」の判定を、気分ではなく時計に任せます</text>

  <text x="24" y="58" font-family="sans-serif" font-size="12" font-weight="700" fill="#2f8f4e">やってほしい形</text>

  <rect x="24" y="68" width="440" height="34" rx="6" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
  <text x="244" y="90" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1f5c39" text-anchor="middle">自分でやってみる（15分）</text>
  <rect x="470" y="68" width="226" height="34" rx="6" fill="#eef4ff" stroke="#9fb4d8" stroke-width="1.5"/>
  <text x="583" y="90" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#26456f" text-anchor="middle">手を止めて、相談文を書く</text>

  <path d="M24 108 L24 118 M464 108 L464 118 M696 108 L696 118" stroke="#8892a0"/>
  <text x="24" y="132" font-family="sans-serif" font-size="10.5" fill="#8892a0">詰まったと感じた瞬間</text>
  <text x="464" y="132" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#c0392b" text-anchor="middle">15分</text>
  <text x="696" y="132" font-family="sans-serif" font-size="10.5" fill="#8892a0" text-anchor="end">相談へ</text>

  <text x="44" y="160" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1f5c39">この15分でやるのは、3つだけ</text>
  <text x="44" y="180" font-family="sans-serif" font-size="11.5" fill="#26456f">① エラーの文字を、そのまま検索する　② AIに聞く（エラー全文を貼る）　③ 直前に変えた場所を戻す</text>

  <path d="M24 200 L696 200" stroke="#c7cede" stroke-width="1"/>

  <text x="24" y="226" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0392b">起きがちな形</text>

  <rect x="24" y="236" width="672" height="34" rx="6" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="10.5" fill="#7a2f24" text-anchor="middle">
    <text x="80" y="257">あと5分</text>
    <text x="190" y="257">あと5分</text>
    <text x="300" y="257">あと5分</text>
    <text x="410" y="257">あと5分</text>
    <text x="520" y="257">あと5分</text>
    <text x="630" y="257">あと5分</text>
  </g>
  <path d="M135 236 L135 270 M245 236 L245 270 M355 236 L355 270 M465 236 L465 270 M575 236 L575 270" stroke="#e6b5ad" stroke-dasharray="3 3"/>
  <text x="24" y="288" font-family="sans-serif" font-size="10.5" fill="#8892a0">詰まったと感じた瞬間</text>
  <text x="696" y="288" font-family="sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="end">気づくと2時間。しかも、進んでいない</text>

  <text x="24" y="318" font-family="sans-serif" font-size="12" fill="#26456f"><tspan font-weight="700">15分でなくても構いません。30分でもいい。</tspan>大事なのは<tspan font-weight="700">先に決めておくこと</tspan>です。決めていないと、必ず延びます。</text>
</svg>
