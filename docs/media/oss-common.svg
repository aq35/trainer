<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="3つのプロジェクトが別々に気にしていることと、共通していること">
<rect width="720" height="320" fill="#ffffff"/>
<text x="24" y="26" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#26456f">気にしていることは、3つとも<tspan fill="#c0392b">バラバラ</tspan>です</text>

<rect x="24" y="38" width="216" height="92" rx="10" fill="#eef3ff" stroke="#9fb4d8" stroke-width="1.5"/>
<text x="132" y="60" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#26456f" text-anchor="middle">Node.js</text>
<text x="132" y="84" font-family="sans-serif" font-size="12" font-weight="700" fill="#2f6fed" text-anchor="middle">置き去りにしない</text>
<text x="36" y="106" font-family="sans-serif" font-size="11.5" fill="#5a6f92">古い版を使い続ける人がいる。</text>
<text x="36" y="122" font-family="sans-serif" font-size="11.5" fill="#5a6f92">だから版ごとに枝を残し続ける</text>

<rect x="252" y="38" width="216" height="92" rx="10" fill="#fff9ec" stroke="#e5c98a" stroke-width="1.5"/>
<text x="360" y="60" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#8a6d1f" text-anchor="middle">Kubernetes</text>
<text x="360" y="84" font-family="sans-serif" font-size="12" font-weight="700" fill="#8a6d1f" text-anchor="middle">入り口を狭める</text>
<text x="264" y="106" font-family="sans-serif" font-size="11.5" fill="#8a6d1f">出す直前は、入れていいものを</text>
<text x="264" y="122" font-family="sans-serif" font-size="11.5" fill="#8a6d1f">1個ずつ選ぶ（チェリーピック）</text>

<rect x="480" y="38" width="216" height="92" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
<text x="588" y="60" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39" text-anchor="middle">Rust</text>
<text x="588" y="84" font-family="sans-serif" font-size="12" font-weight="700" fill="#1f5c39" text-anchor="middle">日付を先に決める</text>
<text x="492" y="106" font-family="sans-serif" font-size="11.5" fill="#3f7a5c">6週間ごとに必ず出す。間に合わ</text>
<text x="492" y="122" font-family="sans-serif" font-size="11.5" fill="#3f7a5c">なければ、次の電車に回すだけ</text>

<text x="24" y="158" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#26456f">それでも、<tspan fill="#c0392b">3つに共通していること</tspan>があります</text>

<rect x="24" y="170" width="672" height="36" rx="9" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
<text x="40" y="193" font-family="sans-serif" font-size="12.5" fill="#1f5c39">① <tspan font-weight="700">main は、いつでも出せる状態</tspan>。作りかけを置く場所ではない</text>

<rect x="24" y="212" width="672" height="36" rx="9" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
<text x="40" y="235" font-family="sans-serif" font-size="12.5" fill="#1f5c39">② <tspan font-weight="700">作りかけは、プルリクエストの中にしか無い</tspan>。だから develop が要らない</text>

<rect x="24" y="254" width="672" height="36" rx="9" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
<text x="40" y="277" font-family="sans-serif" font-size="12.5" fill="#1f5c39">③ <tspan font-weight="700">出したものには、必ず名前が付く</tspan>（タグ・バージョン番号）。だから戻せる</text>

<rect x="24" y="296" width="672" height="22" rx="6" fill="#fdf0ee" stroke="#e6b5ad"/>
<text x="360" y="312" font-family="sans-serif" font-size="12" fill="#7a2f24" text-anchor="middle">枝の数は違っても、<tspan font-weight="700" fill="#c0392b">「出せるものと作りかけを混ぜない」は同じ</tspan>です</text>
</svg>
