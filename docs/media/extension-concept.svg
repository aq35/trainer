<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="拡張機能は本体に差し込んで機能を足すもの">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b6472" text-anchor="middle">拡張機能＝あとから差し込む「先端パーツ」</text>

  <rect x="230" y="90" width="180" height="120" rx="14" fill="#2f6fed"/>
  <text x="320" y="140" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">VS Code</text>
  <text x="320" y="164" font-family="sans-serif" font-size="11.5" fill="#c9dbff" text-anchor="middle">本体（素の状態）</text>
  <rect x="404" y="118" width="18" height="20" rx="3" fill="#5a8bf2"/>
  <rect x="404" y="150" width="18" height="20" rx="3" fill="#5a8bf2"/>

  <g>
    <rect x="452" y="108" width="180" height="40" rx="9" fill="#fdf3ef" stroke="#e8b9a3" stroke-width="1.5"/>
    <rect x="440" y="120" width="16" height="16" rx="3" fill="#c96442"/>
    <text x="548" y="133" font-family="sans-serif" font-size="13" font-weight="700" fill="#a5522f" text-anchor="middle">Claude Code</text>
  </g>
  <g opacity=".55">
    <rect x="452" y="158" width="180" height="34" rx="9" fill="#f1f4f9" stroke="#c7cede" stroke-width="1.5"/>
    <rect x="440" y="166" width="16" height="16" rx="3" fill="#9aa3b2"/>
    <text x="548" y="180" font-family="sans-serif" font-size="12" fill="#5b6472" text-anchor="middle">日本語化・見た目 など（任意）</text>
  </g>

  <text x="150" y="128" font-family="sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle">最初は必要最低限。</text>
  <text x="150" y="148" font-family="sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle">欲しい機能だけ</text>
  <text x="150" y="168" font-family="sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle">あとから足していきます。</text>
  <path d="M436 128 L446 128" stroke="#8892a0" stroke-width="2"/>

  <rect x="120" y="240" width="480" height="40" rx="9" fill="#eef3ff" stroke="#c9dbff" stroke-width="1.5"/>
  <text x="360" y="258" font-family="sans-serif" font-size="12.5" fill="#2f6fed" text-anchor="middle">スマホ本体にアプリを入れるのと、まったく同じ考え方です。</text>
  <text x="360" y="274" font-family="sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle">研修で入れるのは Claude Code の1つだけ。入れすぎると重くなります。</text>
</svg>
