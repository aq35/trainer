<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="Linuxの誕生からgit、GitHub登場までの年表">
  <rect width="720" height="260" fill="#ffffff"/>
  <text x="360" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b6472" text-anchor="middle">git が生まれるまで</text>
  <line x1="60" y1="120" x2="660" y2="120" stroke="#c7cede" stroke-width="3"/>

  <g>
    <circle cx="110" cy="120" r="10" fill="#ffffff" stroke="#8892a0" stroke-width="3"/>
    <text x="110" y="98" font-family="sans-serif" font-size="13" font-weight="700" fill="#3d4652" text-anchor="middle">1991</text>
    <text x="110" y="152" font-family="sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle">Linux が誕生</text>
    <text x="110" y="170" font-family="sans-serif" font-size="11" fill="#8892a0" text-anchor="middle">世界中の人が</text>
    <text x="110" y="186" font-family="sans-serif" font-size="11" fill="#8892a0" text-anchor="middle">少しずつ直す方式に</text>
  </g>
  <g>
    <circle cx="300" cy="120" r="10" fill="#ffffff" stroke="#c0392b" stroke-width="3"/>
    <text x="300" y="98" font-family="sans-serif" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">2005年 春</text>
    <text x="300" y="152" font-family="sans-serif" font-size="11.5" fill="#c0392b" text-anchor="middle">使っていた道具が</text>
    <text x="300" y="170" font-family="sans-serif" font-size="11.5" fill="#c0392b" text-anchor="middle">突然使えなくなる</text>
    <text x="300" y="188" font-family="sans-serif" font-size="11" fill="#8892a0" text-anchor="middle">開発が止まる大ピンチ</text>
  </g>
  <g>
    <circle cx="470" cy="120" r="12" fill="#e8763a"/>
    <text x="470" y="98" font-family="sans-serif" font-size="13" font-weight="700" fill="#a5522f" text-anchor="middle">2005年 4月</text>
    <text x="470" y="152" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#a5522f" text-anchor="middle">git 誕生</text>
    <text x="470" y="170" font-family="sans-serif" font-size="11" fill="#8892a0" text-anchor="middle">「無いなら作る」で</text>
    <text x="470" y="186" font-family="sans-serif" font-size="11" fill="#8892a0" text-anchor="middle">数週間で作られた</text>
  </g>
  <g>
    <circle cx="640" cy="120" r="10" fill="#24292f"/>
    <text x="640" y="98" font-family="sans-serif" font-size="13" font-weight="700" fill="#3d4652" text-anchor="middle">2008</text>
    <text x="640" y="152" font-family="sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle">GitHub が登場</text>
    <text x="640" y="170" font-family="sans-serif" font-size="11" fill="#8892a0" text-anchor="middle">別の人たちが</text>
    <text x="640" y="186" font-family="sans-serif" font-size="11" fill="#8892a0" text-anchor="middle">作った別サービス</text>
  </g>

  <rect x="120" y="216" width="480" height="30" rx="9" fill="#fff8e9" stroke="#f0d9a8" stroke-width="1.5"/>
  <text x="360" y="236" font-family="sans-serif" font-size="12.5" fill="#8a6412" text-anchor="middle">あなたが今使っている道具は、20年前の「困った」から生まれました。</text>
</svg>
