<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="手元とGitHubの間で、clone・push・pull・fetchの4つのコマンドがどちら向きに動くかを示した図">
  <rect width="720" height="360" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">覚えるのは「どっち向きか」だけです</text>

  <rect x="24" y="46" width="230" height="120" rx="10" fill="#eef4ff" stroke="#9fb4d8" stroke-width="1.5"/>
  <text x="139" y="72" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#26456f" text-anchor="middle">手元（あなたのパソコン）</text>
  <text x="139" y="96" font-family="sans-serif" font-size="11" fill="#5a6f92" text-anchor="middle">ファイル・コミットの履歴</text>
  <text x="139" y="120" font-family="sans-serif" font-size="11" fill="#5a6f92" text-anchor="middle">ここで作業します</text>
  <text x="139" y="146" font-family="sans-serif" font-size="10.5" fill="#8892a0" text-anchor="middle">ネットが切れても触れます</text>

  <rect x="466" y="46" width="230" height="120" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
  <text x="581" y="72" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39" text-anchor="middle">GitHub（向こう側）</text>
  <text x="581" y="96" font-family="monospace" font-size="11.5" font-weight="700" fill="#1f5c39" text-anchor="middle">origin</text>
  <text x="581" y="116" font-family="sans-serif" font-size="10.5" fill="#4a7a5f" text-anchor="middle">＝この置き場所に付けた「あだ名」</text>
  <text x="581" y="146" font-family="sans-serif" font-size="10.5" fill="#8892a0" text-anchor="middle">他の人も、ここを見ています</text>

  <path d="M254 78 L466 78" stroke="#2f8f4e" stroke-width="2"/>
  <path d="M262 73 L253 78 L262 83 Z" fill="#2f8f4e"/>
  <text x="360" y="72" font-family="monospace" font-size="11.5" font-weight="700" fill="#1f5c39" text-anchor="middle">git clone</text>
  <text x="360" y="92" font-family="sans-serif" font-size="10" fill="#4a7a5f" text-anchor="middle">まるごと持ってくる（最初の1回だけ）</text>

  <path d="M254 118 L466 118" stroke="#2f8f4e" stroke-width="2"/>
  <path d="M262 113 L253 118 L262 123 Z" fill="#2f8f4e"/>
  <text x="360" y="112" font-family="monospace" font-size="11.5" font-weight="700" fill="#1f5c39" text-anchor="middle">git pull</text>
  <text x="360" y="132" font-family="sans-serif" font-size="10" fill="#4a7a5f" text-anchor="middle">他の人の変更を取り込む（毎朝これ）</text>

  <path d="M254 156 L466 156" stroke="#2f6fed" stroke-width="2"/>
  <path d="M458 151 L467 156 L458 161 Z" fill="#2f6fed"/>
  <text x="360" y="150" font-family="monospace" font-size="11.5" font-weight="700" fill="#2f6fed" text-anchor="middle">git push</text>

  <path d="M24 190 L696 190" stroke="#c7cede" stroke-width="1"/>

  <text x="24" y="216" font-family="sans-serif" font-size="12" font-weight="700" fill="#26456f">4つの言葉の、正確な意味</text>

  <rect x="24" y="226" width="672" height="26" rx="5" fill="#f7f9fd" stroke="#c7cede"/>
  <text x="40" y="244" font-family="monospace" font-size="11" font-weight="700" fill="#1f5c39">git clone</text>
  <text x="170" y="244" font-family="sans-serif" font-size="11" fill="#26456f">向こう →  手元</text>
  <text x="330" y="244" font-family="sans-serif" font-size="11" fill="#5a6f92">まるごと持ってくる。フォルダごと新しくできます</text>

  <rect x="24" y="256" width="672" height="26" rx="5" fill="#f7f9fd" stroke="#c7cede"/>
  <text x="40" y="274" font-family="monospace" font-size="11" font-weight="700" fill="#1f5c39">git fetch</text>
  <text x="170" y="274" font-family="sans-serif" font-size="11" fill="#26456f">向こう →  手元</text>
  <text x="330" y="274" font-family="sans-serif" font-size="11" fill="#5a6f92">取ってくるだけ。<tspan font-weight="700">作業中のファイルは変わりません</tspan></text>

  <rect x="24" y="286" width="672" height="26" rx="5" fill="#eef7f1" stroke="#a9d5bb"/>
  <text x="40" y="304" font-family="monospace" font-size="11" font-weight="700" fill="#1f5c39">git pull</text>
  <text x="170" y="304" font-family="sans-serif" font-size="11" fill="#26456f">向こう →  手元</text>
  <text x="330" y="304" font-family="sans-serif" font-size="11" fill="#5a6f92"><tspan font-weight="700">fetch ＋ 合流</tspan>。取ってきて、いまの作業に混ぜます</text>

  <rect x="24" y="316" width="672" height="26" rx="5" fill="#eef4ff" stroke="#9fb4d8"/>
  <text x="40" y="334" font-family="monospace" font-size="11" font-weight="700" fill="#2f6fed">git push</text>
  <text x="170" y="334" font-family="sans-serif" font-size="11" fill="#26456f">手元 →  向こう</text>
  <text x="330" y="334" font-family="sans-serif" font-size="11" fill="#5a6f92">記録した分を送る。<tspan font-weight="700">commit していない分は送られません</tspan></text>

  <text x="24" y="356" font-family="sans-serif" font-size="11" font-weight="700" fill="#c0392b">迷ったら —— 取りに行くのが pull、送るのが push。</text>
</svg>
