<svg xmlns="http://www.w3.org/2000/svg" width="720" height="292" viewBox="0 0 720 292" role="img" aria-label="AIに貼ってはいけないものと、貼ってよいもの。迷ったら貼る前に聞く">
<rect width="720" height="292" fill="#ffffff"/>
<rect x="24" y="20" width="330" height="182" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
<text x="189" y="45" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#c0392b" text-anchor="middle">貼ってはいけない</text>
<text x="44" y="76" font-family="sans-serif" font-size="13" fill="#7a2f24">✕　鍵・パスワード・トークン</text>
<text x="62" y="96" font-family="sans-serif" font-size="12" fill="#9c5a4e">設定ファイルの中身を、そのまま貼らない</text>
<text x="44" y="123" font-family="sans-serif" font-size="13" fill="#7a2f24">✕　お客様の個人情報</text>
<text x="62" y="143" font-family="sans-serif" font-size="12" fill="#9c5a4e">氏名・住所・電話・メール・購入履歴</text>
<text x="44" y="170" font-family="sans-serif" font-size="13" fill="#7a2f24">✕　案件のソースコード</text>
<text x="62" y="190" font-family="sans-serif" font-size="12" fill="#9c5a4e">ただし「貼ってよい」と決まっている案件もある</text>
<rect x="366" y="20" width="330" height="182" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
<text x="531" y="45" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#1f5c39" text-anchor="middle">貼ってよい</text>
<text x="386" y="76" font-family="sans-serif" font-size="13" fill="#1f5c39">◯　自分が書いた練習用のコード</text>
<text x="386" y="106" font-family="sans-serif" font-size="13" fill="#1f5c39">◯　公開されている情報</text>
<text x="386" y="136" font-family="sans-serif" font-size="13" fill="#1f5c39">◯　エラーメッセージ</text>
<text x="404" y="156" font-family="sans-serif" font-size="12" fill="#3f7a5c">そのまま全文で構いません</text>
<text x="386" y="186" font-family="sans-serif" font-size="12" fill="#3f7a5c">この研修で作るものは、全部あなたのものです</text>
<rect x="24" y="218" width="672" height="52" rx="10" fill="#eef3ff" stroke="#9fb4d8" stroke-width="1.5"/>
<text x="360" y="242" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#26456f" text-anchor="middle">迷ったら、貼る前に聞く。これが唯一の正解です</text>
<text x="360" y="261" font-family="sans-serif" font-size="12" fill="#5a6f92" text-anchor="middle">ルールはチームごとに違います。「他所ではOKだった」は理由になりません</text>
</svg>
