<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="HTTPステータスコードは最初の1桁で意味が決まるという図">
  <rect width="720" height="330" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">全部覚えなくていい。最初の1桁だけで、どっちのせいか決まります</text>

  <rect x="24" y="44" width="672" height="46" rx="8" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
  <text x="52" y="74" font-family="monospace" font-size="19" font-weight="700" fill="#1f5c39">2xx</text>
  <text x="130" y="70" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39">うまくいった</text>
  <text x="330" y="70" font-family="sans-serif" font-size="11" fill="#4a7a5f">200 ＝ OK。ただし<tspan font-weight="700">中身まで正しいとは限りません</tspan></text>

  <rect x="24" y="98" width="672" height="46" rx="8" fill="#f7f9fd" stroke="#c7cede" stroke-width="1.5"/>
  <text x="52" y="128" font-family="monospace" font-size="19" font-weight="700" fill="#5b6472">3xx</text>
  <text x="130" y="124" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b6472">場所が移った</text>
  <text x="330" y="124" font-family="sans-serif" font-size="11" fill="#8892a0">ブラウザが自動で追いかけます。気にしなくて大丈夫</text>

  <rect x="24" y="152" width="672" height="76" rx="8" fill="#eef4ff" stroke="#9fb4d8" stroke-width="2"/>
  <text x="52" y="184" font-family="monospace" font-size="19" font-weight="700" fill="#2f6fed">4xx</text>
  <text x="130" y="180" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#26456f">頼み方が悪い ＝ こちら側</text>
  <text x="330" y="180" font-family="sans-serif" font-size="11" font-weight="700" fill="#2f6fed">自分で直せることが多い</text>
  <text x="130" y="204" font-family="sans-serif" font-size="11" fill="#5a6f92"><tspan font-family="monospace" font-weight="700">401</tspan> あなたが誰か分からない　→ ログインで解決</text>
  <text x="130" y="220" font-family="sans-serif" font-size="11" fill="#5a6f92"><tspan font-family="monospace" font-weight="700">403</tspan> 誰かは分かるが権限がない　→ <tspan font-weight="700">ログインしても解決しません</tspan></text>
  <text x="450" y="204" font-family="sans-serif" font-size="11" fill="#5a6f92"><tspan font-family="monospace" font-weight="700">404</tspan> そんなものは無い</text>
  <text x="450" y="220" font-family="sans-serif" font-size="11" fill="#5a6f92">　　URLの打ち間違いが大半</text>

  <rect x="24" y="236" width="672" height="56" rx="8" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="2"/>
  <text x="52" y="268" font-family="monospace" font-size="19" font-weight="700" fill="#c0392b">5xx</text>
  <text x="130" y="264" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7a2f24">向こうで落ちた ＝ サーバー側</text>
  <text x="380" y="264" font-family="sans-serif" font-size="11" font-weight="700" fill="#c0392b">あなたには直せません</text>
  <text x="130" y="284" font-family="sans-serif" font-size="11" fill="#a05a4c"><tspan font-family="monospace" font-weight="700">500</tspan> 向こうのプログラムが落ちた　→ 粘らず、<tspan font-weight="700">すぐ報告するのが正解</tspan></text>

  <text x="24" y="316" font-family="sans-serif" font-size="12" font-weight="700" fill="#26456f">境目はここ ——  <tspan fill="#2f6fed">4xx は自分を疑う</tspan>　／　<tspan fill="#c0392b">5xx は向こうに伝える</tspan>。この一線だけ覚えてください。</text>
</svg>
