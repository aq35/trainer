<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="ブラウザのClaudeは会話だけ。Claude Codeはファイルを直接読み書きし、コマンドも実行できる">
  <rect width="720" height="360" fill="#ffffff"/>

  <text x="180" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#8892a0" text-anchor="middle">ブラウザの Claude</text>
  <text x="540" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#2f6fed" text-anchor="middle">Claude Code（VS Code の中）</text>

  <!-- 左: ブラウザ -->
  <rect x="24" y="40" width="312" height="248" rx="8" fill="#ffffff" stroke="#c7cede" stroke-width="1.5"/>
  <rect x="24" y="40" width="312" height="26" rx="8" fill="#eef1f6"/>
  <circle cx="42" cy="53" r="4" fill="#c7cede"/><circle cx="56" cy="53" r="4" fill="#c7cede"/><circle cx="70" cy="53" r="4" fill="#c7cede"/>

  <rect x="44" y="82" width="200" height="34" rx="10" fill="#eef1f6"/>
  <text x="56" y="104" font-family="sans-serif" font-size="12" fill="#3d4652">このコードを直して</text>
  <rect x="116" y="126" width="200" height="52" rx="10" fill="#e7efff"/>
  <text x="128" y="146" font-family="sans-serif" font-size="12" fill="#26456f">こう直すとよさそうです</text>
  <text x="128" y="166" font-family="monospace" font-size="11.5" fill="#26456f">function go() { ... }</text>

  <path d="M180 196 L180 224" stroke="#e07a3a" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M174 218 L180 226 L186 218 Z" fill="#e07a3a"/>
  <text x="180" y="246" font-family="sans-serif" font-size="12" font-weight="700" fill="#e07a3a" text-anchor="middle">自分でコピーして貼る</text>
  <text x="180" y="266" font-family="sans-serif" font-size="11.5" fill="#8892a0" text-anchor="middle">見せたものしか知らない</text>

  <!-- 右: VS Code -->
  <rect x="384" y="40" width="312" height="248" rx="8" fill="#1f2430"/>
  <rect x="384" y="40" width="312" height="26" rx="8" fill="#2a3040"/>
  <text x="398" y="58" font-family="sans-serif" font-size="11.5" fill="#9aa4b5">practice</text>

  <rect x="398" y="80" width="88" height="192" rx="6" fill="#252b38"/>
  <g font-family="monospace" font-size="11" fill="#9aa4b5">
    <text x="408" y="100">index.html</text>
    <text x="408" y="120">app.js</text>
    <text x="408" y="140">logic.js</text>
    <text x="408" y="160">style.css</text>
  </g>

  <rect x="498" y="80" width="184" height="112" rx="6" fill="#252b38"/>
  <text x="510" y="100" font-family="sans-serif" font-size="11.5" fill="#7dd3fc">✱ Claude Code</text>
  <text x="510" y="122" font-family="sans-serif" font-size="11.5" fill="#e6eaf2">logic.js を読みました</text>
  <text x="510" y="142" font-family="sans-serif" font-size="11.5" fill="#e6eaf2">33行目を直します</text>
  <rect x="510" y="152" width="72" height="24" rx="5" fill="#2f6fed"/>
  <text x="546" y="168" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">許可する</text>
  <rect x="590" y="152" width="60" height="24" rx="5" fill="#3a4152"/>
  <text x="620" y="168" font-family="sans-serif" font-size="11" fill="#c7cede" text-anchor="middle">断る</text>

  <rect x="498" y="200" width="184" height="72" rx="6" fill="#161a22"/>
  <g font-family="monospace" font-size="11" fill="#a7f3a0">
    <text x="510" y="220">$ npm test</text>
    <text x="510" y="240" fill="#e6eaf2"># pass 14</text>
    <text x="510" y="260" fill="#e6eaf2"># fail 0</text>
  </g>

  <text x="540" y="306" font-family="sans-serif" font-size="12" font-weight="700" fill="#2f6fed" text-anchor="middle">自分でファイルを開き、コマンドも打てる</text>
  <text x="540" y="326" font-family="sans-serif" font-size="11.5" fill="#8892a0" text-anchor="middle">ただし、書き換える前に必ず許可を聞く</text>

  <text x="360" y="348" font-family="sans-serif" font-size="12" fill="#8892a0" text-anchor="middle">中で動いている AI は、どちらも同じ Claude です</text>
</svg>
