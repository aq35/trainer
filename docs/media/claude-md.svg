<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="CLAUDE.md があると、毎回同じ前提を説明し直さなくてよくなるという図">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b6472" text-anchor="middle">CLAUDE.md ＝ AIに毎回読んでもらう「はじめに読む紙」</text>

  <!-- 左: ない場合 -->
  <rect x="24" y="46" width="322" height="230" rx="10" fill="#fff0f2" stroke="#f6cdd8" stroke-width="1.5"/>
  <text x="185" y="72" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#be3455" text-anchor="middle">無いとき</text>

  <rect x="44" y="86" width="200" height="30" rx="8" fill="#ffffff" stroke="#f0c2ce"/>
  <text x="58" y="106" font-family="sans-serif" font-size="11.5" fill="#5b6472">月: このアプリは家計簿で…</text>
  <rect x="44" y="124" width="200" height="30" rx="8" fill="#ffffff" stroke="#f0c2ce"/>
  <text x="58" y="144" font-family="sans-serif" font-size="11.5" fill="#5b6472">火: このアプリは家計簿で…</text>
  <rect x="44" y="162" width="200" height="30" rx="8" fill="#ffffff" stroke="#f0c2ce"/>
  <text x="58" y="182" font-family="sans-serif" font-size="11.5" fill="#5b6472">水: このアプリは家計簿で…</text>
  <text x="185" y="216" font-family="sans-serif" font-size="12" font-weight="700" fill="#be3455" text-anchor="middle">毎回、同じ説明からやり直し</text>
  <text x="185" y="238" font-family="sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle">説明を省くと、前と違う書き方をされる</text>
  <text x="185" y="258" font-family="sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle">「AIが的外れ」と感じる原因の多くがこれ</text>

  <!-- 右: ある場合 -->
  <rect x="374" y="46" width="322" height="230" rx="10" fill="#eefaf1" stroke="#b7e3c6" stroke-width="1.5"/>
  <text x="535" y="72" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#2b7d52" text-anchor="middle">あるとき</text>

  <rect x="396" y="86" width="278" height="116" rx="8" fill="#ffffff" stroke="#b7e3c6"/>
  <text x="410" y="106" font-family="monospace" font-size="11.5" fill="#2b7d52">CLAUDE.md</text>
  <path d="M410 114 L660 114" stroke="#dceee3"/>
  <text x="410" y="132" font-family="sans-serif" font-size="11" fill="#5b6472">・何を作っているか（家計簿のページ）</text>
  <text x="410" y="150" font-family="sans-serif" font-size="11" fill="#5b6472">・使っているもの（HTML と JavaScript だけ）</text>
  <text x="410" y="168" font-family="sans-serif" font-size="11" fill="#5b6472">・守ってほしいこと（変更は1ファイルずつ）</text>
  <text x="410" y="186" font-family="sans-serif" font-size="11" fill="#5b6472">・私は初心者（用語には短い説明を付ける）</text>

  <path d="M535 208 L535 226" stroke="#2b7d52" stroke-width="2"/><path d="M530 220 L535 228 L540 220 Z" fill="#2b7d52"/>
  <text x="535" y="248" font-family="sans-serif" font-size="12" font-weight="700" fill="#2b7d52" text-anchor="middle">毎朝、AIが勝手に読んでから答える</text>
  <text x="535" y="268" font-family="sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle">説明は1回書くだけ。直したくなったら書き足す</text>
</svg>
