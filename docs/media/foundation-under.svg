<svg xmlns="http://www.w3.org/2000/svg" width="720" height="272" viewBox="0 0 720 272" role="img" aria-label="今日使った道具がどれも、決まった形の約束ごとという同じ土台の上に乗っているという図">
<rect width="720" height="272" fill="#ffffff"/>
<text x="24" y="28" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#26456f">今日の道具は、どれも同じ土台の上に乗っています</text>
<rect x="24" y="44" width="160" height="76" rx="9" fill="#eef3ff" stroke="#9fb4d8" stroke-width="1.5"/>
<text x="104" y="70" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#26456f" text-anchor="middle">言語サーバ</text>
<text x="104" y="92" font-family="sans-serif" font-size="12" fill="#5a6f92" text-anchor="middle">プロセスと</text>
<text x="104" y="110" font-family="sans-serif" font-size="12" fill="#5a6f92" text-anchor="middle">プロトコル</text>
<rect x="196" y="44" width="160" height="76" rx="9" fill="#eef3ff" stroke="#9fb4d8" stroke-width="1.5"/>
<text x="276" y="70" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#26456f" text-anchor="middle">LSP / API / HTTP</text>
<text x="276" y="92" font-family="sans-serif" font-size="12" fill="#5a6f92" text-anchor="middle">決まった形で</text>
<text x="276" y="110" font-family="sans-serif" font-size="12" fill="#5a6f92" text-anchor="middle">やり取りする</text>
<rect x="368" y="44" width="160" height="76" rx="9" fill="#eef3ff" stroke="#9fb4d8" stroke-width="1.5"/>
<text x="448" y="70" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#26456f" text-anchor="middle">git bisect run</text>
<text x="448" y="92" font-family="sans-serif" font-size="12" fill="#5a6f92" text-anchor="middle">終了コード</text>
<text x="448" y="110" font-family="sans-serif" font-size="12" fill="#5a6f92" text-anchor="middle">0 なら成功</text>
<rect x="540" y="44" width="156" height="76" rx="9" fill="#eef3ff" stroke="#9fb4d8" stroke-width="1.5"/>
<text x="618" y="70" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#26456f" text-anchor="middle">4xx / 5xx</text>
<text x="618" y="92" font-family="sans-serif" font-size="12" fill="#5a6f92" text-anchor="middle">機械が判定</text>
<text x="618" y="110" font-family="sans-serif" font-size="12" fill="#5a6f92" text-anchor="middle">できる形</text>
<path d="M104 128 L104 146" stroke="#8892a0" stroke-width="2"/>
<path d="M276 128 L276 146" stroke="#8892a0" stroke-width="2"/>
<path d="M448 128 L448 146" stroke="#8892a0" stroke-width="2"/>
<path d="M618 128 L618 146" stroke="#8892a0" stroke-width="2"/>
<rect x="24" y="150" width="672" height="54" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="2"/>
<text x="360" y="175" font-family="sans-serif" font-size="14" font-weight="700" fill="#1f5c39" text-anchor="middle">約束ごとを決めて、機械に判定させる</text>
<text x="360" y="195" font-family="sans-serif" font-size="12.5" fill="#1f5c39" text-anchor="middle">名前が違うだけで、考え方は全部これです</text>
<rect x="24" y="216" width="672" height="42" rx="9" fill="#f6f8fc" stroke="#c7cede" stroke-width="1.5"/>
<text x="360" y="243" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">基礎とは、暗記する知識ではなく、それを説明できる言葉のことです</text>
</svg>
