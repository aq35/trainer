<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="Git-Flowでやっていいことと、原則やってはいけないこと">
<rect width="720" height="300" fill="#ffffff"/>
<text x="24" y="28" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#26456f">覚えるのはルールの数ではなく、<tspan fill="#c0392b">どれも同じ理由から出ている</tspan>ということです</text>

<rect x="24" y="42" width="330" height="238" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
<text x="40" y="66" font-family="sans-serif" font-size="13" font-weight="700" fill="#1f5c39">やっていいこと</text>
<text x="40" y="94" font-family="sans-serif" font-size="12" fill="#1f5c39">・<tspan font-weight="700">develop から feature を切る</tspan></text>
<text x="52" y="111" font-family="sans-serif" font-size="11.5" fill="#3f7a5c">1機能＝1ブランチ。短く終わらせる</text>
<text x="40" y="136" font-family="sans-serif" font-size="12" fill="#1f5c39">・<tspan font-weight="700">release の中で、細かい修正をする</tspan></text>
<text x="52" y="153" font-family="sans-serif" font-size="11.5" fill="#3f7a5c">誤字・表示崩れ・設定値。出す準備の作業</text>
<text x="40" y="178" font-family="sans-serif" font-size="12" fill="#1f5c39">・<tspan font-weight="700">main に出したら、タグを打つ</tspan></text>
<text x="52" y="195" font-family="sans-serif" font-size="11.5" fill="#3f7a5c">戻れるようにするため。毎回、必ず</text>
<text x="40" y="220" font-family="sans-serif" font-size="12" fill="#1f5c39">・<tspan font-weight="700">終わったブランチは消す</tspan></text>
<text x="52" y="237" font-family="sans-serif" font-size="11.5" fill="#3f7a5c">記録は履歴に残る。一覧を汚さない</text>
<text x="40" y="262" font-family="sans-serif" font-size="12" fill="#1f5c39">・<tspan font-weight="700">週に一度、develop を取り込む</tspan></text>
<text x="52" y="277" font-family="sans-serif" font-size="11.5" fill="#3f7a5c">作業が長引いたときの、唯一の防御</text>

<rect x="366" y="42" width="330" height="238" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
<text x="382" y="66" font-family="sans-serif" font-size="13" font-weight="700" fill="#c0392b">原則、やってはいけないこと</text>
<text x="382" y="94" font-family="sans-serif" font-size="12" fill="#7a2f24">・<tspan font-weight="700">main に直接コミットする</tspan></text>
<text x="394" y="111" font-family="sans-serif" font-size="11.5" fill="#9c5a4e">誰も確認していないものが、本番に載る</text>
<text x="382" y="136" font-family="sans-serif" font-size="12" fill="#7a2f24">・<tspan font-weight="700">release に新しい機能を足す</tspan></text>
<text x="394" y="153" font-family="sans-serif" font-size="11.5" fill="#9c5a4e">凍結の意味が消え、いつまでも出せなくなる</text>
<text x="382" y="178" font-family="sans-serif" font-size="12" fill="#7a2f24">・<tspan font-weight="700">hotfix を develop に戻し忘れる</tspan></text>
<text x="394" y="195" font-family="sans-serif" font-size="11.5" fill="#9c5a4e">次のリリースで、直した不具合が復活する</text>
<text x="382" y="220" font-family="sans-serif" font-size="12" fill="#7a2f24">・<tspan font-weight="700">feature を何週間も生かしておく</tspan></text>
<text x="394" y="237" font-family="sans-serif" font-size="11.5" fill="#9c5a4e">コンフリクトの大きさは、日数で決まる</text>
<text x="382" y="262" font-family="sans-serif" font-size="12" fill="#7a2f24">・<tspan font-weight="700">develop から、直接お客さんに出す</tspan></text>
<text x="394" y="277" font-family="sans-serif" font-size="11.5" fill="#9c5a4e">「出せるもの」と「作りかけ」が混ざる</text>
</svg>
