<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="一人開発ではブランチの決まりが要らなかった理由と、チームになると何が変わるか">
<rect width="720" height="300" fill="#ffffff"/>
<text x="24" y="28" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#26456f">ここまで、決まりごとは<tspan fill="#c0392b">1つも要りませんでした</tspan>。理由があります</text>

<rect x="24" y="42" width="330" height="176" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
<text x="40" y="66" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39">一人でやっていたとき</text>
<text x="40" y="92" font-family="monospace" font-size="12" font-weight="700" fill="#1f5c39">main</text>
<text x="92" y="92" font-family="sans-serif" font-size="12" fill="#3f7a5c">1本で足りていました</text>
<text x="40" y="122" font-family="sans-serif" font-size="12" fill="#1f5c39">① <tspan font-weight="700">何が入っているか、全部知っている</tspan></text>
<text x="56" y="139" font-family="sans-serif" font-size="11.5" fill="#3f7a5c">自分で入れたものしか、入っていない</text>
<text x="40" y="164" font-family="sans-serif" font-size="12" fill="#1f5c39">② <tspan font-weight="700">出す相手がいない</tspan></text>
<text x="56" y="181" font-family="sans-serif" font-size="11.5" fill="#3f7a5c">いつ出すかも、自分で決められる</text>
<text x="40" y="206" font-family="sans-serif" font-size="12" fill="#1f5c39">③ <tspan font-weight="700">壊れても、困るのは自分だけ</tspan></text>

<rect x="366" y="42" width="330" height="176" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
<text x="382" y="66" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">チームに入ると</text>
<text x="382" y="92" font-family="sans-serif" font-size="12" fill="#7a2f24">この3つが、<tspan font-weight="700">全部ひっくり返ります</tspan></text>
<text x="382" y="122" font-family="sans-serif" font-size="12" fill="#7a2f24">① <tspan font-weight="700">他人が入れたものが、いつの間にか入る</tspan></text>
<text x="398" y="139" font-family="sans-serif" font-size="11.5" fill="#9c5a4e">それが完成品か作りかけか、分からない</text>
<text x="382" y="164" font-family="sans-serif" font-size="12" fill="#7a2f24">② <tspan font-weight="700">出す日が、自分では決まらない</tspan></text>
<text x="398" y="181" font-family="sans-serif" font-size="11.5" fill="#9c5a4e">「明日出します」と急に言われる</text>
<text x="382" y="206" font-family="sans-serif" font-size="12" fill="#7a2f24">③ <tspan font-weight="700">壊すと、他人の手が止まる</tspan></text>

<rect x="24" y="234" width="672" height="54" rx="10" fill="#eef3ff" stroke="#9fb4d8" stroke-width="1.5"/>
<text x="40" y="256" font-family="sans-serif" font-size="12.5" fill="#26456f">開発フローは、<tspan font-weight="700">几帳面な人のための作法ではありません。</tspan></text>
<text x="40" y="278" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">この3つに困った人たちが、困らないように作った決まりごとです。</text>
</svg>
