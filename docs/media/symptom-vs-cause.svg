<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="データを直すのはその場しのぎで、コードを直せば同じ事故が二度と起きないという対比">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">同じ「直った」でも、次に同じことが起きるかが違います</text>

  <rect x="24" y="42" width="672" height="42" rx="9" fill="#f7f9fd" stroke="#c7cede" stroke-width="1.5"/>
  <text x="44" y="60" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#5b6472">症状</text>
  <text x="44" y="78" font-family="sans-serif" font-size="11.5" fill="#26456f">タイトルの <tspan font-family="monospace">&lt;第2版&gt;</tspan> が、画面から消えている（12件のうち1件だけ）</text>

  <rect x="24" y="100" width="330" height="164" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
  <text x="189" y="124" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7a2f24" text-anchor="middle">データのほうを直す</text>
  <rect x="44" y="136" width="290" height="30" rx="5" fill="#ffffff" stroke="#e6b5ad"/>
  <text x="54" y="155" font-family="monospace" font-size="10.5" fill="#7a2f24">"…手順 &lt;第2版&gt; を書く" → "…手順 第2版 を書く"</text>
  <text x="44" y="186" font-family="sans-serif" font-size="11.5" fill="#7a2f24">✓ 画面は、たしかに直ります</text>
  <text x="44" y="210" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#c0392b">✗ 次に誰かが記号を入れたら、また起きます</text>
  <text x="44" y="232" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#c0392b">✗ しかも「直した」ことになっている</text>
  <text x="189" y="254" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#8892a0" text-anchor="middle">＝ その場しのぎ。自動チェックでも指摘されます</text>

  <rect x="366" y="100" width="330" height="164" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
  <text x="531" y="124" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39" text-anchor="middle">コードのほうを直す</text>
  <rect x="386" y="136" width="290" height="30" rx="5" fill="#ffffff" stroke="#a9d5bb"/>
  <text x="396" y="155" font-family="monospace" font-size="10.5" fill="#1f5c39">${t.title} → ${escapeHtml(t.title)}</text>
  <text x="386" y="186" font-family="sans-serif" font-size="11.5" fill="#1f5c39">✓ 画面が直ります</text>
  <text x="386" y="210" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#2f8f4e">✓ どんな記号が来ても、もう起きません</text>
  <text x="386" y="232" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#2f8f4e">✓ XSS という事故も、同時にふさげます</text>
  <text x="531" y="254" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#8892a0" text-anchor="middle">＝ 原因を直した</text>

  <path d="M24 282 L696 282" stroke="#c7cede" stroke-width="1"/>
  <text x="24" y="306" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0392b">頼むときは「タイトルだけでなく、データ由来の文字列はすべて」を必ず入れてください。</text>
  <text x="24" y="328" font-family="sans-serif" font-size="12" fill="#26456f">1か所だけ直すと、<tspan font-weight="700">次は別の場所で、まったく同じ事故が起きます。</tspan></text>
</svg>
