<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="コンフリクトは長く持つほど大きくなる。こまめに取り込み、小さく出すと小さく済むという比較">
<rect width="720" height="300" fill="#ffffff"/>
<text x="24" y="28" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#26456f">コンフリクトの大きさは、腕前ではなく「持っていた日数」で決まります</text>

<text x="24" y="60" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">2週間ためた人</text>
<rect x="150" y="46" width="440" height="18" rx="4" fill="#f6dcd6" stroke="#e6b5ad"/>
<rect x="590" y="42" width="90" height="26" rx="5" fill="#e6b5ad" stroke="#c0392b" stroke-width="1.5"/>
<text x="635" y="60" font-family="sans-serif" font-size="12" font-weight="700" fill="#7a2f24" text-anchor="middle">大きな衝突</text>
<text x="150" y="82" font-family="sans-serif" font-size="12" fill="#9c5a4e">この間に、他の人も同じ場所を直しています</text>

<text x="24" y="122" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39">毎日取り込む人</text>
<rect x="150" y="108" width="60" height="18" rx="4" fill="#dff0e6" stroke="#a9d5bb"/>
<rect x="214" y="106" width="26" height="22" rx="4" fill="#a9d5bb" stroke="#2f8f4e"/>
<rect x="246" y="108" width="60" height="18" rx="4" fill="#dff0e6" stroke="#a9d5bb"/>
<rect x="310" y="106" width="26" height="22" rx="4" fill="#a9d5bb" stroke="#2f8f4e"/>
<rect x="342" y="108" width="60" height="18" rx="4" fill="#dff0e6" stroke="#a9d5bb"/>
<rect x="406" y="106" width="26" height="22" rx="4" fill="#a9d5bb" stroke="#2f8f4e"/>
<rect x="438" y="108" width="60" height="18" rx="4" fill="#dff0e6" stroke="#a9d5bb"/>
<text x="516" y="122" font-family="sans-serif" font-size="12" font-weight="700" fill="#1f5c39">小さい衝突が、たまに1回</text>
<text x="150" y="144" font-family="sans-serif" font-size="12" fill="#3f7a5c">■ が「取り込む」。ぶつかっても、直すのは1〜2行です</text>

<rect x="24" y="164" width="672" height="118" rx="10" fill="#eef3ff" stroke="#9fb4d8" stroke-width="1.5"/>
<text x="44" y="188" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f">チームで働くときの4つ</text>
<text x="44" y="212" font-family="sans-serif" font-size="12.5" fill="#26456f">① <tspan font-weight="700">作業を始める前に、必ず取り込む</tspan>（git switch main → git pull → 枝を作る）</text>
<text x="44" y="234" font-family="sans-serif" font-size="12.5" fill="#26456f">② <tspan font-weight="700">1つの枝で、1つのことだけ</tspan>。長く持たない。出せる大きさで出す</text>
<text x="44" y="256" font-family="sans-serif" font-size="12.5" fill="#26456f">③ <tspan font-weight="700">同じファイルを触る人がいたら、先に一言</tspan>。1分の相談が、1時間を防ぎます</text>
<text x="44" y="276" font-family="sans-serif" font-size="12.5" fill="#26456f">④ <tspan font-weight="700">どちらを残すか迷ったら、書いた人に聞く</tspan>。勝手に消さない</text>
</svg>
