<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="伝わらない相談文と、4つの要素が揃った相談文の比較">
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="180" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">これでは答えられない</text>
  <text x="540" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#2f8f4e" text-anchor="middle">これなら1往復で終わる</text>

  <rect x="24" y="40" width="312" height="96" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
  <text x="44" y="76" font-family="sans-serif" font-size="13.5" fill="#7a2f24">「push できません。</text>
  <text x="44" y="100" font-family="sans-serif" font-size="13.5" fill="#7a2f24">　助けてください」</text>
  <text x="180" y="164" font-family="sans-serif" font-size="12" fill="#8892a0" text-anchor="middle">読む人が、まず5つ質問し返すことになる</text>
  <text x="180" y="186" font-family="sans-serif" font-size="12" fill="#8892a0" text-anchor="middle">→ 解決まで何往復もかかる</text>

  <rect x="384" y="40" width="312" height="230" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="11.5">
    <text x="400" y="66" font-weight="700" fill="#2f8f4e">① 何をしようとしていたか</text>
    <text x="410" y="84" fill="#1f5c39">#2の修正をGitHubに上げようとしていました</text>
    <text x="400" y="112" font-weight="700" fill="#2f8f4e">② 何をしたか</text>
    <text x="410" y="130" font-family="monospace" font-size="10.5" fill="#1f5c39">git push -u origin fix/2-overdue</text>
    <text x="400" y="158" font-weight="700" fill="#2f8f4e">③ 何が起きたか（全文そのまま）</text>
    <text x="410" y="176" font-family="monospace" font-size="10.5" fill="#1f5c39">! [rejected] main -&gt; main (fetch first)</text>
    <text x="400" y="204" font-weight="700" fill="#2f8f4e">④ 自分で何を試したか</text>
    <text x="410" y="222" fill="#1f5c39">もう一度push / VS Code再起動 / 検索</text>
    <text x="400" y="250" font-weight="700" fill="#2f6fed">＋ 今どうしたいか を1行</text>
  </g>
  <text x="540" y="296" font-family="sans-serif" font-size="12" fill="#8892a0" text-anchor="middle">③のエラーは要約しない。英語のまま貼る</text>
</svg>
