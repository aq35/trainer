<svg xmlns="http://www.w3.org/2000/svg" width="720" height="272" viewBox="0 0 720 272" role="img" aria-label="調べるために撒くconsole.logと、あとで読むために残すログの違い">
<rect width="720" height="272" fill="#ffffff"/>
<rect x="24" y="20" width="330" height="164" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
<text x="189" y="45" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#c0392b" text-anchor="middle">撒く console.log</text>
<text x="44" y="72" font-family="sans-serif" font-size="12.5" fill="#7a2f24">いつ書く　　困ってから</text>
<text x="44" y="96" font-family="sans-serif" font-size="12.5" fill="#7a2f24">何を出す　　その場で見たい値</text>
<text x="44" y="120" font-family="sans-serif" font-size="12.5" fill="#7a2f24">読む人　　　いまの自分だけ</text>
<text x="44" y="144" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">終わったら　消す</text>
<rect x="44" y="154" width="290" height="22" rx="5" fill="#ffffff" stroke="#e6b5ad"/>
<text x="54" y="170" font-family="monospace" font-size="12" fill="#7a2f24">console.log(t)</text>
<rect x="366" y="20" width="330" height="164" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
<text x="531" y="45" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#1f5c39" text-anchor="middle">残すログ</text>
<text x="386" y="72" font-family="sans-serif" font-size="12.5" fill="#1f5c39">いつ書く　　困る前に</text>
<text x="386" y="96" font-family="sans-serif" font-size="12.5" fill="#1f5c39">何を出す　　いつ・何を・結果</text>
<text x="386" y="120" font-family="sans-serif" font-size="12.5" fill="#1f5c39">読む人　　　半年後の自分と、他の人</text>
<text x="386" y="144" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39">終わっても　消さない</text>
<rect x="386" y="154" width="290" height="22" rx="5" fill="#ffffff" stroke="#a9d5bb"/>
<text x="396" y="170" font-family="sans-serif" font-size="12" fill="#1f5c39">タスクを20000件読み込みました</text>
<rect x="24" y="202" width="672" height="48" rx="10" fill="#eef3ff" stroke="#9fb4d8" stroke-width="1.5"/>
<text x="360" y="223" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#26456f" text-anchor="middle">見分け方はひとつだけ　—　「これ、半年後の自分が読みたいか？」</text>
<text x="360" y="243" font-family="sans-serif" font-size="12" fill="#5a6f92" text-anchor="middle">読みたくない → 撒くやつ。消す　　　読みたい → ログ。残す</text>
</svg>
