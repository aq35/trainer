<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Consoleはブラウザの中で起きたことを見る道具で、Networkはブラウザとサーバーの境目を通った通信を見る道具だという図">
  <rect width="720" height="360" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">同じ画面の中にありますが、見ている場所がまったく違います</text>

  <rect x="24" y="44" width="300" height="170" rx="10" fill="#eef4ff" stroke="#9fb4d8" stroke-width="1.5"/>
  <text x="174" y="68" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#26456f" text-anchor="middle">ブラウザの中（あなたのパソコン）</text>
  <rect x="44" y="82" width="260" height="34" rx="6" fill="#ffffff" stroke="#c7cede"/>
  <text x="174" y="104" font-family="sans-serif" font-size="11.5" fill="#26456f" text-anchor="middle">あなたが書いた JavaScript が動く</text>
  <rect x="44" y="124" width="260" height="34" rx="6" fill="#ffffff" stroke="#c7cede"/>
  <text x="174" y="146" font-family="sans-serif" font-size="11.5" fill="#26456f" text-anchor="middle">画面（HTML）を組み立てる</text>
  <rect x="44" y="166" width="260" height="34" rx="6" fill="#ffffff" stroke="#c7cede"/>
  <text x="174" y="188" font-family="sans-serif" font-size="11.5" fill="#26456f" text-anchor="middle">受け取ったデータを読む・使う</text>

  <rect x="516" y="44" width="180" height="170" rx="10" fill="#f7f9fd" stroke="#c7cede" stroke-width="1.5"/>
  <text x="606" y="68" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#5b6472" text-anchor="middle">向こう側</text>
  <text x="606" y="90" font-family="sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle">サーバー</text>
  <text x="606" y="120" font-family="sans-serif" font-size="11" fill="#8892a0" text-anchor="middle">頼まれたものを返す</text>
  <text x="606" y="140" font-family="sans-serif" font-size="11" fill="#8892a0" text-anchor="middle">（練習では Live Server）</text>
  <text x="606" y="176" font-family="sans-serif" font-size="11" fill="#8892a0" text-anchor="middle">ここは、あなたには</text>
  <text x="606" y="194" font-family="sans-serif" font-size="11" fill="#8892a0" text-anchor="middle">直接のぞけません</text>

  <path d="M420 40 L420 218" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="420" y="34" font-family="sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">境目</text>

  <path d="M330 96 L410 96" stroke="#9fb4d8" stroke-width="2"/><path d="M404 91 L413 96 L404 101 Z" fill="#9fb4d8"/>
  <path d="M430 96 L510 96" stroke="#9fb4d8" stroke-width="2"/><path d="M504 91 L513 96 L504 101 Z" fill="#9fb4d8"/>
  <text x="420" y="86" font-family="sans-serif" font-size="10.5" fill="#5a6f92" text-anchor="middle">頼む</text>

  <path d="M510 160 L430 160" stroke="#2f8f4e" stroke-width="2"/><path d="M436 155 L427 160 L436 165 Z" fill="#2f8f4e"/>
  <path d="M410 160 L330 160" stroke="#2f8f4e" stroke-width="2"/><path d="M336 155 L327 160 L336 165 Z" fill="#2f8f4e"/>
  <text x="420" y="180" font-family="sans-serif" font-size="10.5" fill="#2f8f4e" text-anchor="middle">返る</text>

  <rect x="24" y="232" width="300" height="52" rx="9" fill="#f4eefc" stroke="#c4aee6" stroke-width="2"/>
  <text x="44" y="254" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#4a2f77">Console タブ — 中で起きたこと</text>
  <text x="44" y="273" font-family="sans-serif" font-size="11" fill="#6b4f96">エラー・console.log。つまり「あなたのコードの言い分」</text>
  <path d="M174 214 L174 230" stroke="#c4aee6" stroke-width="2"/>
  <path d="M168 222 L174 232 L180 222 Z" fill="#c4aee6"/>

  <rect x="352" y="232" width="344" height="52" rx="9" fill="#fdf7e8" stroke="#e2c98a" stroke-width="2"/>
  <text x="372" y="254" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7a5c1a">Network タブ — 境目を通ったもの</text>
  <text x="372" y="273" font-family="sans-serif" font-size="11" fill="#a8862f">何を頼んで、何が返ってきたか。Status と Response が見えます</text>
  <path d="M420 218 L420 230" stroke="#e2c98a" stroke-width="2"/>
  <path d="M414 222 L420 232 L426 222 Z" fill="#e2c98a"/>

  <path d="M24 300 L696 300" stroke="#c7cede" stroke-width="1"/>
  <text x="24" y="324" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0392b">Console だけ見ると誤診します。赤は「結果」であって、「原因」とは限りません。</text>
  <text x="24" y="346" font-family="sans-serif" font-size="12" fill="#26456f">だから <tspan font-weight="700">Network（何が返ってきたか）が先、Console（それをどう扱って失敗したか）が後</tspan>。</text>
</svg>
