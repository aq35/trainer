<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="hotfixはmainから切り、mainとdevelopの両方に戻す。develop側を忘れると不具合が復活する">
<rect width="720" height="300" fill="#ffffff"/>
<text x="24" y="28" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#26456f">本番が壊れたときだけ、<tspan fill="#c0392b">main から直接</tspan>ブランチを切ります</text>

<text x="60" y="72" font-family="monospace" font-size="12" font-weight="700" fill="#1f5c39" text-anchor="end">main</text>
<path d="M72 68 L668 68" stroke="#a9d5bb" stroke-width="3"/>
<circle cx="140" cy="68" r="8" fill="#ffffff" stroke="#a9d5bb" stroke-width="2.5"/>
<circle cx="470" cy="68" r="8" fill="#3aa76d" stroke="#3aa76d" stroke-width="2.5"/>
<text x="470" y="52" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1f5c39" text-anchor="middle">v1.0.1 を打つ</text>

<text x="60" y="256" font-family="monospace" font-size="12" font-weight="700" fill="#26456f" text-anchor="end">develop</text>
<path d="M72 252 L668 252" stroke="#9fb4d8" stroke-width="3"/>
<circle cx="560" cy="252" r="8" fill="#2f6fed" stroke="#2f6fed" stroke-width="2.5"/>

<rect x="230" y="140" width="180" height="34" rx="8" fill="#fdf0ee" stroke="#c0392b" stroke-width="2"/>
<text x="320" y="162" font-family="monospace" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="middle">hotfix/1.0.1</text>

<path d="M140 76 L140 157 L226 157" fill="none" stroke="#c0392b" stroke-width="2"/>
<path d="M220 151 L228 157 L220 163" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="150" y="118" font-family="sans-serif" font-size="11.5" fill="#c0392b">① main から切る</text>

<path d="M414 150 L470 150 L470 78" fill="none" stroke="#3aa76d" stroke-width="2"/>
<path d="M464 84 L470 76 L476 84" fill="none" stroke="#3aa76d" stroke-width="2"/>
<text x="480" y="118" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1f5c39">② main へ戻す（出荷）</text>

<path d="M414 165 L560 165 L560 242" fill="none" stroke="#2f6fed" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M554 236 L560 244 L566 236" fill="none" stroke="#2f6fed" stroke-width="2"/>
<text x="480" y="200" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#2f6fed">③ develop へも戻す</text>
<text x="480" y="216" font-family="sans-serif" font-size="11" fill="#c0392b">↑ ここを忘れる事故が、いちばん多い</text>

<rect x="24" y="272" width="672" height="22" rx="6" fill="#fdf0ee" stroke="#e6b5ad"/>
<text x="360" y="288" font-family="sans-serif" font-size="12" fill="#7a2f24" text-anchor="middle">③ を忘れると、<tspan font-weight="700" fill="#c0392b">次のリリースで、直したはずの不具合が復活します</tspan></text>
</svg>
