<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-label="毎回書いて消す使い捨てのコードと、一度作れば残る道具を比べた図">
  <rect width="720" height="310" fill="#ffffff"/>

  <text x="180" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">使い捨て（毎回やる）</text>
  <rect x="24" y="40" width="312" height="150" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
  <text x="44" y="66" font-family="sans-serif" font-size="12.5" fill="#7a2f24">① 測りたい所に3行、書き足す</text>
  <text x="58" y="88" font-family="monospace" font-size="10.5" fill="#7a2f24">console.time('x')  …  console.timeEnd('x')</text>
  <text x="44" y="112" font-family="sans-serif" font-size="12.5" fill="#7a2f24">② 走らせて、数字を見る</text>
  <text x="44" y="136" font-family="sans-serif" font-size="12.5" fill="#7a2f24">③ 消す（消し忘れると指摘される）</text>
  <text x="44" y="164" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">④ 次の日、また①に戻る</text>
  <path d="M300 158 a26 26 0 1 1 -18 -25" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M276 126 L286 133 L275 140 Z" fill="#c0392b"/>

  <text x="540" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#2f8f4e" text-anchor="middle">道具にする（1回だけ）</text>
  <rect x="384" y="40" width="312" height="150" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
  <text x="404" y="66" font-family="sans-serif" font-size="12.5" fill="#1f5c39">① 使い方を先に決める</text>
  <text x="418" y="88" font-family="monospace" font-size="10.5" fill="#1f5c39">measure('x', () =&gt; …)</text>
  <text x="404" y="112" font-family="sans-serif" font-size="12.5" fill="#1f5c39">② 記録は配列に貯まる → 一覧できる</text>
  <text x="404" y="136" font-family="sans-serif" font-size="12.5" fill="#1f5c39">③ テストを書けるので、壊れたら分かる</text>
  <text x="404" y="164" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#2f8f4e">④ 消さずに残せる。次の人も使える</text>

  <path d="M24 212 L696 212" stroke="#c7cede" stroke-width="1"/>

  <text x="24" y="238" font-family="sans-serif" font-size="12" font-weight="700" fill="#26456f">かかる手間</text>
  <text x="120" y="238" font-family="sans-serif" font-size="11.5" fill="#8892a0">1回目</text>
  <text x="240" y="238" font-family="sans-serif" font-size="11.5" fill="#8892a0">2回目</text>
  <text x="360" y="238" font-family="sans-serif" font-size="11.5" fill="#8892a0">3回目</text>
  <text x="480" y="238" font-family="sans-serif" font-size="11.5" fill="#8892a0">10回目</text>

  <rect x="120" y="248" width="40" height="18" rx="3" fill="#e6b5ad"/>
  <rect x="240" y="248" width="40" height="18" rx="3" fill="#e6b5ad"/>
  <rect x="360" y="248" width="40" height="18" rx="3" fill="#e6b5ad"/>
  <rect x="480" y="248" width="40" height="18" rx="3" fill="#e6b5ad"/>
  <text x="696" y="262" font-family="sans-serif" font-size="11.5" fill="#c0392b" text-anchor="end">ずっと同じだけ、かかる</text>

  <rect x="120" y="274" width="80" height="18" rx="3" fill="#a9d5bb"/>
  <rect x="240" y="274" width="8" height="18" rx="3" fill="#a9d5bb"/>
  <rect x="360" y="274" width="8" height="18" rx="3" fill="#a9d5bb"/>
  <rect x="480" y="274" width="8" height="18" rx="3" fill="#a9d5bb"/>
  <text x="696" y="288" font-family="sans-serif" font-size="11.5" fill="#2f8f4e" text-anchor="end">2回目で並び、3回目から得</text>
</svg>
