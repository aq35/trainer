<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="単体・結合・機能・シナリオの4つのテストが、それぞれ何を守り何を守らないかの一覧">
<rect width="720" height="360" fill="#ffffff"/>
<text x="24" y="28" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#26456f">テストは4段。<tspan fill="#c0392b">どれも「守らないもの」があります</tspan></text>
<rect x="24" y="40" width="126" height="26" rx="6" fill="#f6f8fc" stroke="#c7cede"/>
<text x="87" y="58" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#3d4652" text-anchor="middle">テスト</text>
<rect x="156" y="40" width="264" height="26" rx="6" fill="#eef7f1" stroke="#a9d5bb"/>
<text x="288" y="58" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39" text-anchor="middle">守るもの（これは言い切れる）</text>
<rect x="426" y="40" width="270" height="26" rx="6" fill="#fdf0ee" stroke="#e6b5ad"/>
<text x="561" y="58" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="middle">守らないもの（見ていない）</text>

<rect x="24" y="72" width="126" height="64" rx="8" fill="#eef3ff" stroke="#9fb4d8" stroke-width="1.5"/>
<text x="87" y="98" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">単体</text>
<text x="87" y="118" font-family="sans-serif" font-size="12" fill="#5a6f92" text-anchor="middle">コードで書く</text>
<text x="166" y="98" font-family="sans-serif" font-size="12.5" fill="#1f5c39">部品1つが、条件どおりに動くか</text>
<text x="166" y="120" font-family="sans-serif" font-size="12" fill="#3f7a5c">カバレッジで、どこを通ったか数えられる</text>
<text x="436" y="98" font-family="sans-serif" font-size="12.5" fill="#7a2f24">部品どうしの<tspan font-weight="700">つなぎ目</tspan></text>
<text x="436" y="120" font-family="sans-serif" font-size="12" fill="#9c5a4e">そして「通った」は「正しい」ではない</text>

<rect x="24" y="142" width="126" height="64" rx="8" fill="#eef3ff" stroke="#9fb4d8" stroke-width="1.5"/>
<text x="87" y="168" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">結合</text>
<text x="87" y="188" font-family="sans-serif" font-size="12" fill="#5a6f92" text-anchor="middle">疎通を確認する</text>
<text x="166" y="168" font-family="sans-serif" font-size="12.5" fill="#1f5c39">部品どうしが<tspan font-weight="700">つながっているか</tspan></text>
<text x="166" y="190" font-family="sans-serif" font-size="12" fill="#3f7a5c">呼べる・届く・返ってくる</text>
<text x="436" y="168" font-family="sans-serif" font-size="12.5" fill="#7a2f24">返ってきた<tspan font-weight="700">中身が合っているか</tspan></text>
<text x="436" y="190" font-family="sans-serif" font-size="12" fill="#9c5a4e">つながってさえいれば緑になります</text>

<rect x="24" y="212" width="126" height="64" rx="8" fill="#eef3ff" stroke="#9fb4d8" stroke-width="1.5"/>
<text x="87" y="238" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">機能</text>
<text x="87" y="258" font-family="sans-serif" font-size="12" fill="#5a6f92" text-anchor="middle">マトリクスで網羅</text>
<text x="166" y="238" font-family="sans-serif" font-size="12.5" fill="#1f5c39">1つの機能が、<tspan font-weight="700">仕様どおりか</tspan></text>
<text x="166" y="260" font-family="sans-serif" font-size="12" fill="#3f7a5c">表を作れば「どこを見たか」が言える</text>
<text x="436" y="238" font-family="sans-serif" font-size="12.5" fill="#7a2f24">機能を<tspan font-weight="700">またぐ流れ</tspan></text>
<text x="436" y="260" font-family="sans-serif" font-size="12" fill="#9c5a4e">表に無い欄は、見ていないのと同じ</text>

<rect x="24" y="282" width="126" height="64" rx="8" fill="#eef3ff" stroke="#9fb4d8" stroke-width="1.5"/>
<text x="87" y="308" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">シナリオ</text>
<text x="87" y="328" font-family="sans-serif" font-size="12" fill="#5a6f92" text-anchor="middle">マトリクスで網羅</text>
<text x="166" y="308" font-family="sans-serif" font-size="12.5" fill="#1f5c39">人が実際にやる<tspan font-weight="700">一連の流れ</tspan></text>
<text x="166" y="330" font-family="sans-serif" font-size="12" fill="#3f7a5c">軸は「機能」ではなく「場面」</text>
<text x="436" y="308" font-family="sans-serif" font-size="12.5" fill="#7a2f24">全部の<tspan font-weight="700">組み合わせ</tspan></text>
<text x="436" y="330" font-family="sans-serif" font-size="12" fill="#9c5a4e">数が爆発するので、選ぶしかありません</text>
</svg>
