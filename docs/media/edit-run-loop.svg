<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="書く・保存する・ブラウザで確認するの繰り返し">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b6472" text-anchor="middle">開発は、この3つをひたすら繰り返すだけです</text>

  <g>
    <circle cx="140" cy="140" r="58" fill="#eef3ff" stroke="#c9dbff" stroke-width="2"/>
    <text x="140" y="132" font-family="sans-serif" font-size="15" font-weight="700" fill="#2f6fed" text-anchor="middle">① 書く</text>
    <text x="140" y="156" font-family="sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle">VS Code</text>
  </g>
  <g>
    <circle cx="360" cy="140" r="58" fill="#fff8e9" stroke="#f0d9a8" stroke-width="2"/>
    <text x="360" y="132" font-family="sans-serif" font-size="15" font-weight="700" fill="#8a6412" text-anchor="middle">② 保存</text>
    <text x="360" y="156" font-family="sans-serif" font-size="11.5" fill="#8a6412" text-anchor="middle">Ctrl / Cmd + S</text>
  </g>
  <g>
    <circle cx="580" cy="140" r="58" fill="#eefaf1" stroke="#b7e3c6" stroke-width="2"/>
    <text x="580" y="132" font-family="sans-serif" font-size="15" font-weight="700" fill="#2b7d52" text-anchor="middle">③ 確認</text>
    <text x="580" y="156" font-family="sans-serif" font-size="11.5" fill="#2b7d52" text-anchor="middle">ブラウザを再読み込み</text>
  </g>

  <path d="M202 140 L296 140" stroke="#8892a0" stroke-width="2.5" marker-end="url(#l1)"/>
  <path d="M422 140 L516 140" stroke="#8892a0" stroke-width="2.5" marker-end="url(#l1)"/>
  <path d="M580 202 C 580 250 140 250 140 202" stroke="#8892a0" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#l1)"/>
  <text x="360" y="262" font-family="sans-serif" font-size="12" fill="#8892a0" text-anchor="middle">思ったとおりでなければ、また①へ</text>

  <text x="360" y="288" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#c0392b" text-anchor="middle">②の保存を忘れると、③で何も変わりません。いちばん多い勘違いです。</text>
  <defs><marker id="l1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8892a0"/></marker></defs>
</svg>
