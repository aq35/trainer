<svg xmlns="http://www.w3.org/2000/svg" width="720" height="272" viewBox="0 0 720 272" role="img" aria-label="動かない不具合はすぐ気づかれるが、遅い不具合は放置されてある日限界が来るという図">
<rect width="720" height="272" fill="#ffffff"/>
<rect x="24" y="20" width="330" height="126" rx="10" fill="#f6f8fc" stroke="#c7cede" stroke-width="1.5"/>
<text x="189" y="45" font-family="sans-serif" font-size="13" font-weight="700" fill="#3d4652" text-anchor="middle">「動きません」</text>
<text x="44" y="72" font-family="sans-serif" font-size="12.5" fill="#5b6472">エラーが出る　→　誰でも気づく</text>
<text x="44" y="98" font-family="sans-serif" font-size="12.5" fill="#5b6472">Console に赤い文字が出る</text>
<text x="189" y="130" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39" text-anchor="middle">すぐ直されます</text>
<rect x="366" y="20" width="330" height="126" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
<text x="531" y="45" font-family="sans-serif" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">「なんか重い」</text>
<text x="386" y="72" font-family="sans-serif" font-size="12.5" fill="#7a2f24">エラーは出ない　→　誰も気づかない</text>
<text x="386" y="98" font-family="sans-serif" font-size="12.5" fill="#7a2f24">Console にも何も出ない</text>
<text x="531" y="130" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="middle">放置されます</text>
<text x="24" y="176" font-family="sans-serif" font-size="12.5" fill="#3d4652">そして、データが増え続けたある日——</text>
<path d="M180 214 C 300 212, 400 206, 470 192 S 560 150, 600 120" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<path d="M24 214 L680 214" stroke="#c7cede" stroke-width="1.5"/>
<text x="240" y="234" font-family="sans-serif" font-size="12" fill="#8892a0">データが増える</text>
<text x="696" y="118" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="end">突然、限界が来ます</text>
<text x="24" y="258" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f">そのとき直すのは、今日直すより何倍も大変です。動いていても、遅ければ不具合です。</text>
</svg>
