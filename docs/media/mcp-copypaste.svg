<svg xmlns="http://www.w3.org/2000/svg" width="720" height="262" viewBox="0 0 720 262" role="img" aria-label="毎回コピーして貼っているものが、つなぐ候補になるという図">
<rect width="720" height="262" fill="#ffffff"/>
<text x="24" y="28" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#26456f">いま、あなたが毎回コピペしているもの</text>
<rect x="24" y="44" width="200" height="150" rx="10" fill="#f6f8fc" stroke="#c7cede" stroke-width="1.5"/>
<text x="124" y="68" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#3d4652" text-anchor="middle">GitHub の画面</text>
<text x="44" y="94" font-family="sans-serif" font-size="12.5" fill="#5b6472">・プルリクエストの差分</text>
<text x="44" y="118" font-family="sans-serif" font-size="12.5" fill="#5b6472">・自動チェックのコメント</text>
<text x="44" y="142" font-family="sans-serif" font-size="12.5" fill="#5b6472">・Issue やチケット</text>
<text x="44" y="166" font-family="sans-serif" font-size="12.5" fill="#5b6472">・エラーの画面</text>
<path d="M232 100 L306 100" stroke="#c0392b" stroke-width="2"/><path d="M306 94 L318 100 L306 106 Z" fill="#c0392b"/>
<text x="275" y="90" font-family="sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">選ぶ・コピー</text>
<path d="M318 140 L244 140" stroke="#c0392b" stroke-width="2"/><path d="M244 134 L232 140 L244 146 Z" fill="#c0392b"/>
<text x="275" y="160" font-family="sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">また戻る</text>
<rect x="326" y="44" width="200" height="150" rx="10" fill="#f6f8fc" stroke="#c7cede" stroke-width="1.5"/>
<text x="426" y="68" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#3d4652" text-anchor="middle">AIの画面</text>
<text x="426" y="120" font-family="sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle">貼る</text>
<text x="426" y="146" font-family="sans-serif" font-size="12.5" fill="#8892a0" text-anchor="middle">毎回、これの繰り返し</text>
<path d="M534 119 L588 119" stroke="#2f8f4e" stroke-width="2"/><path d="M588 113 L600 119 L588 125 Z" fill="#2f8f4e"/>
<rect x="596" y="76" width="100" height="86" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
<text x="646" y="106" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39" text-anchor="middle">つなぐと</text>
<text x="646" y="128" font-family="sans-serif" font-size="12" fill="#1f5c39" text-anchor="middle">AIが自分で</text>
<text x="646" y="146" font-family="sans-serif" font-size="12" fill="#1f5c39" text-anchor="middle">見に行きます</text>
<rect x="24" y="208" width="672" height="34" rx="9" fill="#eef3ff" stroke="#9fb4d8" stroke-width="1.5"/>
<text x="360" y="230" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">コピペしていないものは、つながなくて構いません。減らす往復があるから、つなぎます</text>
</svg>
