<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="進まなくなったときの決まった手順5つ。上から順に試して、最後は人に聞く">
  <rect width="720" height="330" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">進まなくなったら、上から順に。考えずに手が動く形にしておきます</text>

  <rect x="24" y="42" width="672" height="38" rx="8" fill="#fdf7e8" stroke="#e2c98a" stroke-width="2"/>
  <text x="44" y="66" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7a5c1a">① 15分やって進まなければ、粘るのをやめる</text>
  <text x="676" y="66" font-family="sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="end">ここが起点</text>

  <path d="M360 82 L360 94" stroke="#9fb4d8" stroke-width="2"/><path d="M354 86 L360 96 L366 86 Z" fill="#9fb4d8"/>

  <rect x="24" y="98" width="672" height="38" rx="8" fill="#eef4ff" stroke="#9fb4d8"/>
  <text x="44" y="116" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#26456f">② 動いていた地点に戻す</text>
  <text x="300" y="116" font-family="monospace" font-size="11" fill="#5a6f92">git restore .</text>
  <text x="44" y="130" font-family="sans-serif" font-size="10.5" fill="#5a6f92">それでもだめなら、commit まで戻す。<tspan font-weight="700">壊れた状態の上で考えないこと</tspan></text>

  <path d="M360 138 L360 150" stroke="#9fb4d8" stroke-width="2"/><path d="M354 142 L360 152 L366 142 Z" fill="#9fb4d8"/>

  <rect x="24" y="154" width="672" height="38" rx="8" fill="#eef4ff" stroke="#9fb4d8"/>
  <text x="44" y="172" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#26456f">③ もっと小さく割る</text>
  <text x="44" y="186" font-family="sans-serif" font-size="10.5" fill="#5a6f92">「ボタンを足す」　→　「<tspan font-weight="700">ボタンを1つ置くだけ</tspan>」。動く最小まで下げます</text>

  <path d="M360 194 L360 206" stroke="#9fb4d8" stroke-width="2"/><path d="M354 198 L360 208 L366 198 Z" fill="#9fb4d8"/>

  <rect x="24" y="210" width="672" height="38" rx="8" fill="#f4eefc" stroke="#c4aee6"/>
  <text x="44" y="228" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#4a2f77">④ AIに症状をそのまま伝える</text>
  <text x="44" y="242" font-family="sans-serif" font-size="10.5" fill="#6b4f96">やったこと ／ 出たエラー（<tspan font-weight="700">全文</tspan>）／ 期待したこと。<tspan font-weight="700">要約しないこと</tspan></text>

  <path d="M360 250 L360 262" stroke="#2f8f4e" stroke-width="2"/><path d="M354 254 L360 264 L366 254 Z" fill="#2f8f4e"/>

  <rect x="24" y="266" width="672" height="38" rx="8" fill="#eef7f1" stroke="#a9d5bb" stroke-width="2"/>
  <text x="44" y="290" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39">⑤ それでもだめなら、人に聞く　——　恥ではなく、正しい判断です</text>

  <text x="24" y="322" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#c0392b">いちばんやってはいけないのは、何時間も一人で粘って、心が折れることです。</text>
</svg>
