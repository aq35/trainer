<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コマンド練習 | エンジニア育成トレーナー</title>
<link rel="stylesheet" href="navi.css?v=30">
<style>
  .drillhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .qn{font-size:12px;color:var(--sub)}
  .scene{background:var(--soft);border-radius:9px;padding:11px 14px;margin:0 0 14px;font-size:14px}
  h2{font-size:19px}

  .choices{display:grid;gap:10px;margin-top:16px}
  button.ch{font:inherit;text-align:left;background:var(--card);color:var(--ink);
            border:2px solid var(--line);border-radius:10px;padding:13px 16px;cursor:pointer;font-size:15px}
  button.ch:hover:enabled{border-color:var(--blue);background:var(--blue-l)}
  button.ch.right{border-color:var(--green);background:var(--green-l)}
  button.ch.bad{border-color:var(--red);background:var(--red-l)}
  button.ch:disabled{cursor:default}

  .inputrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .inputrow input{flex:1;min-width:220px;font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;
                  font-size:15px;padding:13px 14px;border:2px solid var(--line);border-radius:10px;
                  background:var(--card);color:var(--ink)}
  .inputrow input:focus{outline:none;border-color:var(--blue)}
  .inputrow .ok{flex:none;min-width:0}
  .hintline{font-size:12px;color:var(--sub);margin:8px 0 0}

  .fb{border-radius:10px;padding:13px 15px;margin-top:16px;font-size:14px}
  .fb.y{background:var(--green-l);border:1px solid var(--green-b)}
  .fb.y b{color:var(--green)}
  .fb.n{background:var(--red-l);border:1px solid var(--red-b)}
  .fb.n b{color:var(--red)}
  .ansline{margin-top:6px}
  .ansline code{background:var(--code-bg);color:var(--code-fg);padding:2px 8px;border-radius:5px;
                font-family:ui-monospace,Menlo,Consolas,monospace}
  .whyline{margin-top:8px;color:var(--ink)}

  .catlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:8px}
  button.cat{font:inherit;background:var(--card);color:var(--ink);border:2px solid var(--line);
             border-radius:12px;padding:16px 14px;cursor:pointer;text-align:left;display:grid;gap:3px}
  button.cat:hover{border-color:var(--blue);background:var(--blue-l)}
  .cl{font-weight:700;font-size:16px}
  .cn{font-size:12px;color:var(--sub)}
  .cb{font-size:12px;color:var(--blue);font-weight:700}
</style>
  <link rel="canonical" href="https://aq35.github.io/trainer/drill.html">
</head>
<body>

<header>
  <div class="hd">
    <h1>コマンド練習</h1>
    <div class="spacer"></div>
    <a class="home" href="index.html">目次へ</a>
  </div>
</header>

<div class="wrap"><div id="view"></div></div>
<div class="toast" id="toast"></div>

<script src="drill.js?v=17"></script>
<script src="credit.js?v=17"></script>
</body>
</html>
