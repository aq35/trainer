<script>

  { q:'黒い画面（ターミナル）の出し方が分からない',

  { q:'コマンドを打っても何も起きない',

  { q:'打ち間違えた／やり直したい',

  { q:'command not found / not recognized と出た',

  { q:'permission denied と出た',

],

steps:[

},
{

  title:'VS Code を入れます',
  why:'プログラムを書くためのアプリです。まずはこれ1つだけ入れます。',
  todo:{
    win:['<a href="https://code.visualstudio.com" target="_blank" rel="noopener">code.visualstudio.com</a> を開きます',
         '青い大きなボタン「Download for Windows」を押します',
         'パソコンの「ダウンロード」フォルダに入ったファイルを、ダブルクリックします',
         '「同意する」を選び、あとは「次へ」を押し続けます。設定は変えなくて大丈夫です',
         '最後に「完了」を押します'],
    mac:['<a href="https://code.visualstudio.com" target="_blank" rel="noopener">code.visualstudio.com</a> を開きます',
         '青い大きなボタン「Download for Mac」を押します',
         'ダウンロードされたファイルをダブルクリックします',
         '出てきた「Visual Studio Code」のアイコンを、「アプリケーション」フォルダにドラッグして入れます']
  },
  expect:'デスクトップかアプリ一覧に、青い折り紙のようなアイコンが増えています。',
  ask:'VS Code を起動できましたか？',
  tb:[

    { q:'ダウンロードしたファイルがどこにあるか分からない',
      a:'ブラウザの画面の右上（または左下）に、いま落としたファイルが表示されています。そこをクリックすれば開けます。' },

      a:'アイコンを右クリック（または control を押しながらクリック）して「開く」を選ぶと、確認画面から開けます。' }

},
{
  id:'open-folder', phase:'1. 道具をそろえる',
  title:'作業用のフォルダを開きます',

  todo:{
    common:['VS Code のメニューから「ファイル」→「フォルダーを開く」を選びます',
            'デスクトップを選び、「新規フォルダ」を作ります',
            'フォルダの名前を <b>practice</b> にします',
            'その practice フォルダを選んで「開く」を押します',
            '「このフォルダー内のファイルの作成者を信頼しますか？」と聞かれたら「はい、作成者を信頼します」を押します']
  },
  expect:'VS Code の左側に「PRACTICE」という文字が表示されます。',
  ask:'左側に PRACTICE と表示されましたか？',
  tb:[
    { q:'信頼するか聞かれて怖い',
      a:'自分で作った空のフォルダなので安全です。「はい」を選んで大丈夫です。' },
    { q:'「フォルダーを開く」が見つからない',
      a:'Mac の場合はメニューが画面のいちばん上（時計と同じ行）にあります。VS Code をクリックしてから「ファイル」を探してください。' }
  ]
},
{
  id:'terminal', phase:'2. 黒い画面に慣れる',
  title:'ターミナルを出します',
  why:'この先の作業は、文字で命令する画面（ターミナル）を使います。ここで一度出しておきます。',

  },
  visual:'media/prompt-anatomy.svg',
  expect:'画面の下に、文字が表示されたエリアが出ます。ここが命令を打つ場所です。',

  ]

  why:'Claude Code を動かすための土台です。これ自体を使うわけではないので、意味は分からなくて大丈夫です。',
  todo:{
    win:['<a href="https://nodejs.org" target="_blank" rel="noopener">nodejs.org</a> を開きます',
         '「LTS」と書かれたボタンを押します（もう片方は押さないでください）',
         'ダウンロードされたファイルをダブルクリックします',
         '「Next」を押し続け、最後に「Install」を押します',
         '終わったら、<b>VS Code を一度閉じて、開き直します</b>'],
    mac:['<a href="https://nodejs.org" target="_blank" rel="noopener">nodejs.org</a> を開きます',
         '「LTS」と書かれたボタンを押します（もう片方は押さないでください）',
         'ダウンロードされたファイルをダブルクリックします',

      a:'会社のネットワークで制限されている場合があります。5分待っても進まなければサポート役に連絡してください。' }

  id:'git', phase:'3. 土台を入れる',
  title:'Git を入れます',

  todo:{
    win:['<a href="https://git-scm.com/download/win" target="_blank" rel="noopener">git-scm.com</a> を開きます',

         'ダウンロードされたファイルをダブルクリックします',
         '設定画面がたくさん出ますが、<b>すべて「Next」を押すだけ</b>で大丈夫です',
         '最後に「Install」を押し、終わったら VS Code を閉じて開き直します'],
    mac:['Mac には最初から入っていることが多いので、まず下のコマンドで確認します',

         '「インストールしますか」という画面が出た場合は、そのまま「インストール」を押します']
  },
  cmd:'git --version',
  cmdlabel:'ターミナルにこれを打って Enter を押します',
  expect:'git version 2.43.0 のような数字が表示されます。',
  note:'Windows の設定画面は10画面ほど続きますが、読まずに Next で進めて構いません。',
  ask:'git version と数字が表示されましたか？',
  tb:[
    { q:'設定画面が多すぎて不安',
      a:'初期設定のままで問題ありません。何も変えずに Next を押し続けてください。' },

      a:'VS Code を閉じて開き直してから、もう一度打ってください。それでも出る場合はインストールが完了していない可能性があるので、もう一度インストーラを実行してください。' }
  ]
},

  id:'claude-ext', phase:'4. Claude Code を入れる',

  why:'AIと相談しながら作業できるようになります。ここが今日のメインです。',
  todo:{
    common:['VS Code の左端に縦に並んだアイコンの中から、四角が4つ並んだアイコンを押します',
            '上に出てきた入力欄に <b>claude</b> と打ちます',
            '検索結果のいちばん上に出る「Claude Code」を選びます',
            '青い「Install」ボタンを押します']
  },
  visual:'media/vscode-extensions-icon.svg',
  visual2:'media/vscode-claude-search.svg',
  expect:'ボタンの表示が変わり、左端のアイコン一覧に新しいアイコンが増えます。',
  ask:'Install ボタンを押せましたか？',
  tb:[
    { q:'四角が4つ並んだアイコンがどれか分からない',
      a:'上の1枚目の絵で、赤い丸で囲んである位置です。左端の縦一列の、上から4番目あたりにあります。' },
    { q:'似た名前がたくさん出てきて選べない',
      a:'作者が「Anthropic」になっているものを選んでください。2枚目の絵と同じ見た目のものです。' },
    { q:'Install を押したのに変化がない',
      a:'完了まで数十秒かかることがあります。1分ほど待ってから、もう一度画面を見てください。' }
  ]
},
{
  id:'bedrock', phase:'5. つなぐ',
  title:'AIに接続するための設定をします',
  why:'ここで入れる文字列が、AIとつながるための鍵になります。担当者から配られた値を使います。',
  todo:{
    common:['担当者から配布された4つの値を手元に用意します',

            'Enter を押します（4行あるので4回）']
  },
  cmdMulti:{
    win:['$env:CLAUDE_CODE_USE_BEDROCK="1"',
         '$env:AWS_REGION="<配布されたリージョン>"',
         '$env:AWS_ACCESS_KEY_ID="<配布された値>"',
         '$env:AWS_SECRET_ACCESS_KEY="<配布された値>"'],
    mac:['export CLAUDE_CODE_USE_BEDROCK=1',
         'export AWS_REGION=<配布されたリージョン>',
         'export AWS_ACCESS_KEY_ID=<配布された値>',
         'export AWS_SECRET_ACCESS_KEY=<配布された値>']
  },
  expect:'何も表示されずに次の行が出れば成功です。ターミナルでは「無反応 = 成功」です。',
  note:'この鍵は他人に見せないでください。チャットやSNSに貼らないよう注意してください。',
  ask:'4行とも、エラーが出ずに打ち終わりましたか？',
  tb:[
    { q:'&lt; &gt; は消すの？残すの？',
      a:'記号ごと消して、配布された値に置き換えます。例えば <b>&lt;配布された値&gt;</b> の部分すべてを、配られた文字列に置き換えてください。' },
    { q:'貼り付けができない',
      a:'ターミナルの上で右クリックすると貼り付けられます。<span class="k">Ctrl</span>+<span class="k">V</span>（Mac は <span class="k">Cmd</span>+<span class="k">V</span>）でも入ります。' },
    { q:'配布された値を持っていない',
      a:'ここから先は進めません。サポート役に「Bedrockの接続情報がほしい」と連絡してください。' }
  ]
},
{
  id:'talk', phase:'5. つなぐ',
  title:'AIに話しかけてみます',
  why:'最後の確認です。ここで返事が来たら、環境構築は完了です。',
  todo:{
    common:['VS Code の左端に増えた Claude Code のアイコンを押します',
            '入力欄に「自己紹介して」と打ちます',
            'Enter を押します']
  },
  expect:'AIから日本語で返事が返ってきます。',
  ask:'AIから返事が来ましたか？',
  tb:[
    { q:'Authentication failed / 認証エラーと出た',
      a:'鍵の設定がうまく入っていません。1つ前のステップに戻り、4行をもう一度打ち直してください。文字が1つでも違うと失敗します。' },
    { q:'反応がない・ずっと待っている',
      a:'1分ほど待っても返事がなければ、VS Code を閉じて開き直し、鍵の設定（1つ前のステップ）からやり直してください。ターミナルを閉じると鍵の設定は消えます。' },
    { q:'Claude Code のアイコンが見つからない',
      a:'左端のアイコンをひとつずつ押してみてください。それでも無ければ、拡張機能のインストール（3つ前のステップ）に戻ってください。' }

  kind:'fin',
  title:'環境構築、完了です',
  lead:'ここまで来られれば、あとは実際に手を動かすだけです。<br>詰まりながら進むのが普通なので、自分を責めないでください。',
  gained:'VS Code が使える／ターミナルが出せる／Git が入っている／AIに相談できる',
  note:'この設定は<b>ターミナルを閉じると消えます</b>。次に使うときは「AIに接続するための設定」だけ、もう一度打ってください。慣れてきたら、消えないようにする方法をサポート役に聞いてみてください。',
  nextHref:'index.html#/step2-git',
  nextLabel:'Step 2: git を触ってみる'
}
]};
