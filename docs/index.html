<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>エンジニア育成トレーナー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="未経験者向けエンジニア育成カリキュラム">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-tabs@1/dist/docsify-tabs.min.css">
  <style>
    :root {
      --theme-color: #2f6fed;
    }
    body {
      font-feature-settings: "palt";
    }
    .markdown-section {
      max-width: 860px;
    }
    .markdown-section code {
      font-size: 0.9em;
    }
    .markdown-section pre {
      border-radius: 8px;
    }
    .markdown-section details {
      background: #f5f7fb;
      border: 1px solid #e1e6f0;
      border-radius: 8px;
      padding: 0.6em 1em;
      margin: 1em 0;
    }
    .markdown-section details summary {
      cursor: pointer;
      font-weight: 600;
      color: #2f6fed;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }

    /* 大段階カード */
    .step-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75em;
      margin: 1.5em 0;
    }
    .step-card {
      border: 1px solid #e1e6f0;
      background: #f5f7fb;
      border-radius: 10px;
      padding: 1em 0.8em;
      text-align: center;
    }
    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2em;
      height: 2em;
      border-radius: 50%;
      background: var(--theme-color);
      color: #fff;
      font-weight: 700;
      margin-bottom: 0.5em;
    }
    .step-title {
      font-weight: 600;
      font-size: 0.95em;
    }

    /* OSタブ */
    .docsify-tabs__tab {
      font-weight: 600;
    }

    /* 簡易UIモック図 */
    .ui-mock {
      display: block;
      max-width: 100%;
      margin: 1em 0;
      border: 1px solid #e1e6f0;
      border-radius: 8px;
    }

    /* 所要時間バッジ */
    .time {
      display: inline-block;
      background: #eef3ff;
      color: #2f6fed;
      border: 1px solid #c9dbff;
      border-radius: 999px;
      padding: 0.15em 0.8em;
      font-size: 0.78em;
      font-weight: 700;
      vertical-align: middle;
      margin-left: 0.5em;
    }

    /* ここまでOK チェックポイント */
    .checkpoint {
      background: #eefaf1;
      border: 1px solid #b7e3c6;
      border-left: 5px solid #3aa76d;
      border-radius: 8px;
      padding: 0.9em 1.1em;
      margin: 1.5em 0;
    }
    .checkpoint strong {
      color: #2b7d52;
    }

    /* ひとことメモ */
    .note {
      background: #fff8e9;
      border: 1px solid #f0d9a8;
      border-left: 5px solid #e8a53a;
      border-radius: 8px;
      padding: 0.9em 1.1em;
      margin: 1.5em 0;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'エンジニア育成トレーナー',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: '検索',
        noData: '見つかりませんでした',
        depth: 3
      },
      copyCode: {
        buttonText: 'コピー',
        errorText: '失敗しました',
        successText: 'コピーしました'
      },
      pagination: {
        previousText: '前へ',
        nextText: '次へ',
        crossChapter: true
      },
      mermaidConfig: {
        theme: 'default'
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1/dist/docsify-tabs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
</body>
</html>
