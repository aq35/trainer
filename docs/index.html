<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>エンジニア育成トレーナー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="未経験者向けエンジニア育成カリキュラム">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-tabs@1/dist/docsify-tabs.min.css">
  <style>
    :root {
      --theme-color: #2f6fed;
    }
    body {
      font-feature-settings: "palt";
    }
    .markdown-section {
      max-width: 860px;
    }
    .markdown-section code {
      font-size: 0.9em;
    }
    .markdown-section pre {
      border-radius: 8px;
    }
    .markdown-section details {
      background: var(--box-bg, #f5f7fb);
      border: 1px solid var(--box-bd, #e1e6f0);
      border-radius: 8px;
      padding: 0.6em 1em;
      margin: 1em 0;
    }
    .markdown-section details summary {
      cursor: pointer;
      font-weight: 600;
      color: #2f6fed;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }

    /* 目次ページの案内役 */
    .markdown-section .hero {
      display: flex; align-items: center; gap: 18px;
      background: #eef3ff; border: 1px solid #c9dbff;
      border-radius: 14px; padding: 18px 20px; margin: 1.4em 0;
    }
    .markdown-section .hero img { width: 88px; height: 88px; flex: none; }
    .markdown-section .hero p { margin: 0; font-size: 15px; }
    @media (max-width: 520px) { .markdown-section .hero { flex-direction: column; text-align: center; } }

    /* 表の中のツールアイコン */
    /* 表・段落・箇条書きなど、どこに置いても同じ大きさにする */
    .markdown-section img.ti {
      width: 26px !important; height: 26px !important;
      vertical-align: -7px; margin-right: 6px; display: inline;
    }

    /* 全体地図 */
    .markdown-section .map { display: grid; gap: 10px; margin: 1.2em 0; }
    .markdown-section .mapitem {
      display: grid; grid-template-columns: 30px 24px 1fr auto; gap: 12px; align-items: center;
      background: #fff; border: 1px solid #e1e6f0; border-radius: 10px;
      padding: 12px 14px; text-decoration: none; color: inherit; position: relative;
    }
    .markdown-section .mapitem:hover { border-color: #2f6fed; }
    .markdown-section .mapitem .n {
      width: 26px; height: 26px; border-radius: 50%; background: #e7ebf3; color: #6b7482;
      display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
    }
    .markdown-section .mapitem.now .n { background: #2f6fed; color: #fff; }
    .markdown-section .mapitem.done .n { background: #3aa76d; color: #fff; }
    .markdown-section .mapitem .l { font-weight: 600; font-size: 15px; }
    .markdown-section .mapitem .s { font-size: 12px; color: #6b7482; white-space: nowrap; }
    .markdown-section .mapitem .pb {
      grid-column: 1 / -1; height: 4px; background: #e7ebf3; border-radius: 99px; overflow: hidden;
    }
    .markdown-section .mapitem .pb i { display: block; height: 100%; background: #2f6fed; }
    .markdown-section .mapitem.done .pb i { background: #3aa76d; }
    .markdown-section .mapall {
      background: #eefaf1; border: 1px solid #b7e3c6; border-radius: 10px;
      padding: 12px 14px; font-size: 14px; color: #2b7d52; margin-top: 10px;
    }
    .markdown-section .task-list-item { list-style: none; }
    .markdown-section .task-list-item input { margin-right: 8px; transform: scale(1.3); }

    /* ダークモード */
    @media (prefers-color-scheme: dark) {
      :root { --box-bg:#232833; --box-bd:#333a48; }
      body, .sidebar, .content, .markdown-section { background:#14171d; color:#e6e9ef; }
      .sidebar { border-right:1px solid #333a48; }
      .sidebar ul li a { color:#c3c9d4; }
      .markdown-section h1, .markdown-section h2,
      .markdown-section h3, .markdown-section h4, .markdown-section strong { color:#f2f4f8; }
      .markdown-section tr { background:#1b1f27; border-top:1px solid #333a48; }
      .markdown-section tr:nth-child(2n) { background:#232833; }
      .markdown-section th, .markdown-section td { border:1px solid #333a48; }
      .markdown-section code { background:#232833; color:#e6c07b; }
      .markdown-section pre, .markdown-section pre > code { background:#0f1218 !important; color:#dfe5ef; }
      .markdown-section blockquote { border-left-color:#3a4a6b; color:#b6bdca; }
      .app-nav a, .app-name-link { color:#e6e9ef; }
      .markdown-section .note { background:#2a2318; border-color:#57462a; color:#e8c07a; }
      .markdown-section .checkpoint { background:#16271e; border-color:#2c5340; }
      .markdown-section .checkpoint strong { color:#7fd6a3; }
      .markdown-section .step-card { background:#232833; border-color:#333a48; }
      .markdown-section .time { background:#1b2437; border-color:#31456b; color:#6f9dff; }
      /* 図はSVGが白背景前提のため、余白を付けて浮かせる */
      .markdown-section .ui-mock { background:#fff; padding:6px; }
      .markdown-section .hero { background:#1b2437; border-color:#31456b; }
      .markdown-section .mapitem { background:#1b1f27; border-color:#333a48; }
      .markdown-section .mapitem .n { background:#2a303c; color:#9aa3b2; }
      .markdown-section .mapitem .pb { background:#2a303c; }
      .markdown-section .mapall { background:#16271e; border-color:#2c5340; color:#7fd6a3; }
    }

    /* 大段階カード */
    .step-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75em;
      margin: 1.5em 0;
    }
    .step-card {
      border: 1px solid #e1e6f0;
      background: #f5f7fb;
      border-radius: 10px;
      padding: 1em 0.8em;
      text-align: center;
    }
    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2em;
      height: 2em;
      border-radius: 50%;
      background: var(--theme-color);
      color: #fff;
      font-weight: 700;
      margin-bottom: 0.5em;
    }
    .step-title {
      font-weight: 600;
      font-size: 0.95em;
    }

    /* OSタブ */
    .docsify-tabs__tab {
      font-weight: 600;
    }

    /* 簡易UIモック図 */
    .ui-mock {
      display: block;
      max-width: 100%;
      margin: 1em 0;
      border: 1px solid #e1e6f0;
      border-radius: 8px;
    }

    /* 所要時間バッジ */
    .time {
      display: inline-block;
      background: #eef3ff;
      color: #2f6fed;
      border: 1px solid #c9dbff;
      border-radius: 999px;
      padding: 0.15em 0.8em;
      font-size: 0.78em;
      font-weight: 700;
      vertical-align: middle;
      margin-left: 0.5em;
    }

    /* ここまでOK チェックポイント */
    .checkpoint {
      background: #eefaf1;
      border: 1px solid #b7e3c6;
      border-left: 5px solid #3aa76d;
      border-radius: 8px;
      padding: 0.9em 1.1em;
      margin: 1.5em 0;
    }
    .checkpoint strong {
      color: #2b7d52;
    }

    /* ひとことメモ */
    .note {
      background: #fff8e9;
      border: 1px solid #f0d9a8;
      border-left: 5px solid #e8a53a;
      border-radius: 8px;
      padding: 0.9em 1.1em;
      margin: 1.5em 0;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // 各ナビは通常のHTMLページ。docsify のハッシュ経路に入ってしまった場合は実ファイルへ戻す。
    (function () {
      var PAGES = ['setup.html', 'github.html', 'diff.html', 'ai.html'];
      function bounce() {
        for (var i = 0; i < PAGES.length; i++) {
          if (location.hash.indexOf('#/' + PAGES[i]) === 0) {
            location.replace(location.pathname.replace(/[^/]*$/, '') + PAGES[i]);
            return;
          }
        }
      }
      bounce();
      window.addEventListener('hashchange', bounce);
    })();
  </script>
  <script>
    window.$docsify = {
      name: 'エンジニア育成トレーナー',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: '検索',
        noData: '見つかりませんでした',
        depth: 3
      },
      copyCode: {
        buttonText: 'コピー',
        errorText: '失敗しました',
        successText: 'コピーしました'
      },
      pagination: {
        previousText: '前へ',
        nextText: '次へ',
        crossChapter: true
      },
      mermaidConfig: {
        theme: 'default'
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1/dist/docsify-tabs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
  <script src="progress.js"></script>
</body>
</html>
