  cmdlabel:'本線に戻ります',
  expect:'<b>背景の色が消えて、元のページに戻ります。</b>ファイルを消していないのに、中身が切り替わります。',

{
  icon:'icon-git.svg', phase:'4. 合流させる',

  cmdlabel:'add-color の内容を、今いる main に取り込みます',
  expect:'本線でも背景の色が付きます。これで作業が本線に反映されました。',

  ask:'main でも色が付きましたか？',
  tb:[
    { q:'CONFLICT と出た',
      a:'同じ行を両方で変えた場合に出ます。一人で練習している今は起きにくいですが、出たら <code>git merge --abort</code> で中止して、サポート窓口に連絡してください。' },
    { q:'Already up to date と出た',
      a:'main にいないまま merge した可能性があります。<code>git switch main</code> をしてから、もう一度試してください。' }
  ]
},

  icon:'icon-key.svg', phase:'5. 上げてはいけないもの',

  todo:{
    common:['VS Code のファイル一覧で右クリック →「新しいファイル」',

  },
  cmdMulti:{
    common:['# ここに書いたものは git に記録されません\n.env\n*.key\nsecrets.txt\nnode_modules/\n.DS_Store',

            'git commit -m "上げないものを設定した"']
  },
  expect:'.gitignore が commit され、以後この名前のファイルは記録対象から外れます。',
  note:'<b>一度 commit して GitHub に上げてしまった秘密情報は、消しても履歴に残ります。</b>上げる前に防ぐしかありません。迷ったら上げる前に相談してください。',
  ask:'.gitignore を作って commit できましたか？',
  tb:[
    { q:'ファイル名の先頭にドットを付けたら見えなくなった',

  ]

  todo:{
    common:['<code>git switch -c add-title</code> で新しいブランチを作ります',

  expect:'GitHub に、変更内容（差分）が並んだページができます。これがプルリクエストです。',
