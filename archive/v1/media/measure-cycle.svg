<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="測る・特定する・直す・もう一度測る、の4ステップ。4番目を飛ばすと速くなったか分からない">
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="360" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#3d4652" text-anchor="middle">遅いときの、順番</text>

  <g font-family="sans-serif">
    <rect x="24" y="48" width="146" height="86" rx="10" fill="#eef4ff" stroke="#9fb4d8" stroke-width="1.5"/>
    <text x="97" y="76" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">① 測る</text>
    <text x="97" y="98" font-size="11" fill="#26456f" text-anchor="middle">どれくらい遅いか</text>
    <text x="97" y="116" font-size="11" fill="#26456f" text-anchor="middle">数字にする</text>

    <rect x="196" y="48" width="146" height="86" rx="10" fill="#eef4ff" stroke="#9fb4d8" stroke-width="1.5"/>
    <text x="269" y="76" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">② 特定する</text>
    <text x="269" y="98" font-size="11" fill="#26456f" text-anchor="middle">犯人を1つに</text>
    <text x="269" y="116" font-size="11" fill="#26456f" text-anchor="middle">絞る</text>

    <rect x="368" y="48" width="146" height="86" rx="10" fill="#eef4ff" stroke="#9fb4d8" stroke-width="1.5"/>
    <text x="441" y="76" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">③ 直す</text>
    <text x="441" y="104" font-size="11" fill="#26456f" text-anchor="middle">ここだけがコード</text>

    <rect x="540" y="48" width="156" height="86" rx="10" fill="#eef7f1" stroke="#2f8f4e" stroke-width="2.5"/>
    <text x="618" y="76" font-size="13" font-weight="700" fill="#1f5c39" text-anchor="middle">④ もう一度測る</text>
    <text x="618" y="98" font-size="11" fill="#1f5c39" text-anchor="middle">同じやり方で</text>
    <text x="618" y="116" font-size="11" font-weight="700" fill="#1f5c39" text-anchor="middle">3.1秒 → 0.03秒</text>
  </g>

  <g stroke="#9fb4d8" stroke-width="2" fill="none">
    <path d="M170 91 L190 91"/><path d="M342 91 L362 91"/><path d="M514 91 L534 91"/>
  </g>
  <g fill="#9fb4d8">
    <path d="M184 85 L194 91 L184 97 Z"/><path d="M356 85 L366 91 L356 97 Z"/><path d="M528 85 L538 91 L528 97 Z"/>
  </g>

  <text x="618" y="156" font-family="sans-serif" font-size="12" font-weight="700" fill="#2f8f4e" text-anchor="middle">ここが証拠になる</text>

  <path d="M24 180 L696 180" stroke="#c7cede" stroke-width="1"/>

  <text x="24" y="206" font-family="sans-serif" font-size="13" font-weight="700" fill="#c0392b">やりがちな失敗</text>

  <g font-family="sans-serif">
    <rect x="24" y="218" width="200" height="52" rx="8" fill="#fdf0ee" stroke="#e6b5ad"/>
    <text x="124" y="240" font-size="12" font-weight="700" fill="#7a2f24" text-anchor="middle">①②を飛ばして、直す</text>
    <text x="124" y="259" font-size="11" fill="#7a2f24" text-anchor="middle">＝ 推測。犯人でない所を直す</text>

    <rect x="248" y="218" width="200" height="52" rx="8" fill="#fdf0ee" stroke="#e6b5ad"/>
    <text x="348" y="240" font-size="12" font-weight="700" fill="#7a2f24" text-anchor="middle">④を飛ばす</text>
    <text x="348" y="259" font-size="11" fill="#7a2f24" text-anchor="middle">＝「速くなった気がする」</text>

    <rect x="472" y="218" width="224" height="52" rx="8" fill="#eef7f1" stroke="#a9d5bb"/>
    <text x="584" y="240" font-size="12" font-weight="700" fill="#1f5c39" text-anchor="middle">①②③④を、順番どおり</text>
    <text x="584" y="259" font-size="11" fill="#1f5c39" text-anchor="middle">＝ 数字で説明できる</text>
  </g>

  <text x="360" y="298" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#3d4652" text-anchor="middle">①で測った結果、遅くなかった——それも成果です。直さなくていいと分かったのですから</text>
</svg>
