<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="レビューで見る4つの観点。上ほど優先度が高く、4つ目は指摘しない">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">観点を先に決めてから読む。この順番が、そのまま指摘の優先順位です</text>

  <rect x="24" y="44" width="672" height="54" rx="9" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="2"/>
  <text x="44" y="66" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c0392b">① 戻せないもの</text>
  <text x="200" y="66" font-family="sans-serif" font-size="11.5" fill="#7a2f24">見せてはいけない情報が入っていないか</text>
  <text x="44" y="86" font-family="sans-serif" font-size="10.5" fill="#a05a4c">鍵・パスワード・お客様の情報。<tspan font-weight="700">push した時点で履歴に残り、消しても取り返せません</tspan></text>
  <text x="676" y="76" font-family="sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="end">Request changes</text>

  <rect x="24" y="106" width="672" height="54" rx="9" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
  <text x="44" y="128" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7a2f24">② 壊れるもの</text>
  <text x="200" y="128" font-family="sans-serif" font-size="11.5" fill="#7a2f24">動かなくなる／エラーが隠れる／データが変わる</text>
  <text x="44" y="148" font-family="sans-serif" font-size="10.5" fill="#a05a4c">いま動いていても、<tspan font-weight="700">条件が変わったときに壊れるもの</tspan>を含みます</text>
  <text x="676" y="138" font-family="sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="end">Request changes</text>

  <rect x="24" y="168" width="672" height="54" rx="9" fill="#eef4ff" stroke="#9fb4d8" stroke-width="1.5"/>
  <text x="44" y="190" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#26456f">③ 後で困るもの</text>
  <text x="200" y="190" font-family="sans-serif" font-size="11.5" fill="#26456f">読めない名前／消えたテスト／関係ない変更</text>
  <text x="44" y="210" font-family="sans-serif" font-size="10.5" fill="#5a6f92">いまは動きます。<tspan font-weight="700">困るのは半年後の誰か</tspan>です</text>
  <text x="676" y="200" font-family="sans-serif" font-size="11" font-weight="700" fill="#2f6fed" text-anchor="end">Comment</text>

  <rect x="24" y="230" width="672" height="54" rx="9" fill="#f7f9fd" stroke="#c7cede" stroke-dasharray="5 4"/>
  <text x="44" y="252" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#8892a0">④ 好みの問題</text>
  <text x="200" y="252" font-family="sans-serif" font-size="11.5" fill="#8892a0">書き方の流儀・自分ならこうする</text>
  <text x="44" y="272" font-family="sans-serif" font-size="10.5" fill="#8892a0">動作にも保守にも影響しないもの</text>
  <text x="676" y="262" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">指摘しません</text>

  <path d="M24 300 L696 300" stroke="#c7cede" stroke-width="1"/>
  <text x="24" y="322" font-family="sans-serif" font-size="12" fill="#26456f">何も決めずに読むと、<tspan font-weight="700">目立つものしか見つかりません。</tspan>——そして④ばかり指摘して、①を見落とします。</text>
</svg>
