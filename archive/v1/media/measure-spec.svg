<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="measure という道具が満たすべき5つの条件と、それぞれの理由をまとめた表">
  <rect width="720" height="360" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">中身から作らない。「どう呼ばれたいか」から決めます</text>

  <rect x="24" y="42" width="672" height="46" rx="9" fill="#eef4ff" stroke="#9fb4d8" stroke-width="2"/>
  <text x="40" y="62" font-family="sans-serif" font-size="11" fill="#5a6f92">目指す書き味</text>
  <text x="40" y="80" font-family="monospace" font-size="12.5" font-weight="700" fill="#26456f">const r = measure('名前', () =&gt; 重い処理());</text>
  <text x="676" y="72" font-family="sans-serif" font-size="11" font-weight="700" fill="#2f6fed" text-anchor="end">包むだけ</text>

  <text x="40" y="112" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8892a0">条件</text>
  <text x="330" y="112" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#8892a0">なぜ、それが要るのか</text>

  <rect x="24" y="120" width="672" height="34" rx="6" fill="#f7f9fd" stroke="#c7cede"/>
  <text x="40" y="141" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#26456f">① 結果をそのまま返す</text>
  <text x="330" y="141" font-family="sans-serif" font-size="11" fill="#5a6f92">入れても、コードの意味が変わらないため</text>

  <rect x="24" y="158" width="672" height="34" rx="6" fill="#eef7f1" stroke="#a9d5bb" stroke-width="2"/>
  <text x="40" y="179" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1f5c39">② 記録を配列に貯める</text>
  <text x="330" y="179" font-family="sans-serif" font-size="11" fill="#4a7a5f"><tspan font-family="monospace">console.log</tspan> だけだと、<tspan font-weight="700">あとで一覧できない</tspan></text>

  <rect x="24" y="196" width="672" height="34" rx="6" fill="#eef7f1" stroke="#a9d5bb" stroke-width="2"/>
  <text x="40" y="217" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1f5c39">③ 記録を取り出せる（getMarks）</text>
  <text x="330" y="217" font-family="sans-serif" font-size="11" fill="#4a7a5f"><tspan font-weight="700">テストで確かめられる</tspan>ようにするため</text>

  <rect x="24" y="234" width="672" height="34" rx="6" fill="#f7f9fd" stroke="#c7cede"/>
  <text x="40" y="255" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#26456f">④ 記録を消せる（clearMarks）</text>
  <text x="330" y="255" font-family="sans-serif" font-size="11" fill="#5a6f92">テストのたびに、前の記録が混ざらないように</text>

  <rect x="24" y="272" width="672" height="34" rx="6" fill="#fdf7e8" stroke="#e2c98a"/>
  <text x="40" y="293" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#7a5c1a">⑤ 失敗しても、記録は残る</text>
  <text x="330" y="293" font-family="sans-serif" font-size="11" fill="#a8862f"><tspan font-weight="700">落ちたときこそ、時間を知りたい</tspan>から</text>

  <path d="M24 320 L696 320" stroke="#c7cede" stroke-width="1"/>
  <text x="24" y="342" font-family="sans-serif" font-size="12" font-weight="700" fill="#2f8f4e">② と ③ が、いちばん大事です。<tspan font-family="monospace" fill="#26456f">console.log</tspan> <tspan fill="#26456f">に出すだけの道具は、テストできません。</tspan></text>
  <text x="24" y="358" font-family="sans-serif" font-size="11.5" fill="#8892a0">出しっぱなしにせず、取り出せる所に置く —— 計測にかぎらず、道具を作るときの共通の考え方です。</text>
</svg>
