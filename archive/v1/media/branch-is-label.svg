<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-label="gitにとってブランチはただの目印で、名前の意味は人が決めた約束であること">
<rect width="720" height="310" fill="#ffffff"/>
<text x="24" y="28" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#26456f">git にとって、ブランチは<tspan fill="#c0392b">ただの目印</tspan>です</text>
<text x="24" y="50" font-family="sans-serif" font-size="12" fill="#5a6f92"><tspan font-family="monospace">.git/refs/heads/</tspan> にある、<tspan font-weight="700">40文字が1行書いてあるだけのファイル</tspan>です</text>

<rect x="24" y="62" width="672" height="106" rx="10" fill="#f8fafd" stroke="#c7cede" stroke-width="1.5"/>
<text x="40" y="86" font-family="monospace" font-size="12.5" font-weight="700" fill="#2f6fed">main</text>
<text x="160" y="86" font-family="monospace" font-size="12" fill="#3d4652">d8d2001b6dfe2097ab6014d02697abb102dc698a</text>
<text x="40" y="112" font-family="monospace" font-size="12.5" font-weight="700" fill="#2f6fed">develop</text>
<text x="160" y="112" font-family="monospace" font-size="12" fill="#3d4652">d8d2001b6dfe2097ab6014d02697abb102dc698a</text>
<text x="40" y="138" font-family="monospace" font-size="12.5" font-weight="700" fill="#c0392b">banana</text>
<text x="160" y="138" font-family="monospace" font-size="12" fill="#3d4652">d8d2001b6dfe2097ab6014d02697abb102dc698a</text>
<text x="40" y="160" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0392b">まったく同じです。git は「develop」も「banana」も、特別扱いしません</text>

<path d="M360 174 L360 194" stroke="#9fb4d8" stroke-width="2"/>
<path d="M354 188 L360 196 L366 188" fill="none" stroke="#9fb4d8" stroke-width="2"/>

<rect x="24" y="202" width="672" height="44" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
<text x="360" y="230" font-family="sans-serif" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">では、なぜ名前に意味を持たせたのか</text>

<rect x="24" y="254" width="672" height="46" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
<text x="40" y="276" font-family="sans-serif" font-size="12.5" fill="#1f5c39"><tspan font-weight="700">名前を見ただけで「これは出せるのか、作りかけか」が分かるように</tspan>するためです。</text>
<text x="40" y="294" font-family="sans-serif" font-size="12.5" fill="#1f5c39">git が決めたのではなく、<tspan font-weight="700">混ざって困った人たちが決めた約束</tspan>です。</text>
</svg>
