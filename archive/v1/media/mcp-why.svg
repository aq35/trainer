<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="MCPが無いとサービスの数かけるAIの数だけ対応が必要になるが、共通の口を決めれば1つずつで済むという図">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="170" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">共通の口が無いと</text>
  <text x="540" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#2f8f4e" text-anchor="middle">MCP という口を決めると</text>

  <g font-family="sans-serif" font-size="10.5">
    <rect x="30" y="46" width="76" height="26" rx="5" fill="#eef1f6" stroke="#c7cede"/><text x="68" y="63" fill="#3d4652" text-anchor="middle">GitHub</text>
    <rect x="30" y="86" width="76" height="26" rx="5" fill="#eef1f6" stroke="#c7cede"/><text x="68" y="103" fill="#3d4652" text-anchor="middle">課題管理</text>
    <rect x="30" y="126" width="76" height="26" rx="5" fill="#eef1f6" stroke="#c7cede"/><text x="68" y="143" fill="#3d4652" text-anchor="middle">DB</text>
    <rect x="30" y="166" width="76" height="26" rx="5" fill="#eef1f6" stroke="#c7cede"/><text x="68" y="183" fill="#3d4652" text-anchor="middle">ブラウザ</text>

    <rect x="234" y="66" width="76" height="26" rx="5" fill="#e7efff" stroke="#9fb4d8"/><text x="272" y="83" fill="#26456f" text-anchor="middle">AI-A</text>
    <rect x="234" y="112" width="76" height="26" rx="5" fill="#e7efff" stroke="#9fb4d8"/><text x="272" y="129" fill="#26456f" text-anchor="middle">AI-B</text>
    <rect x="234" y="158" width="76" height="26" rx="5" fill="#e7efff" stroke="#9fb4d8"/><text x="272" y="175" fill="#26456f" text-anchor="middle">AI-C</text>
  </g>
  <g stroke="#e0a9a0" stroke-width="1">
    <path d="M106 59 L234 79"/><path d="M106 59 L234 125"/><path d="M106 59 L234 171"/>
    <path d="M106 99 L234 79"/><path d="M106 99 L234 125"/><path d="M106 99 L234 171"/>
    <path d="M106 139 L234 79"/><path d="M106 139 L234 125"/><path d="M106 139 L234 171"/>
    <path d="M106 179 L234 79"/><path d="M106 179 L234 125"/><path d="M106 179 L234 171"/>
  </g>
  <text x="170" y="228" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="middle">4 × 3 = 12 通り、別々に作る</text>
  <text x="170" y="250" font-family="sans-serif" font-size="11.5" fill="#8892a0" text-anchor="middle">サービスが増えるたび、全部のAIが対応し直す</text>

  <g font-family="sans-serif" font-size="10.5">
    <rect x="392" y="46" width="76" height="26" rx="5" fill="#eef1f6" stroke="#c7cede"/><text x="430" y="63" fill="#3d4652" text-anchor="middle">GitHub</text>
    <rect x="392" y="86" width="76" height="26" rx="5" fill="#eef1f6" stroke="#c7cede"/><text x="430" y="103" fill="#3d4652" text-anchor="middle">課題管理</text>
    <rect x="392" y="126" width="76" height="26" rx="5" fill="#eef1f6" stroke="#c7cede"/><text x="430" y="143" fill="#3d4652" text-anchor="middle">DB</text>
    <rect x="392" y="166" width="76" height="26" rx="5" fill="#eef1f6" stroke="#c7cede"/><text x="430" y="183" fill="#3d4652" text-anchor="middle">ブラウザ</text>

    <rect x="512" y="46" width="52" height="146" rx="8" fill="#2f8f4e"/>
    <text x="538" y="112" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" transform="rotate(-90 538 112)">MCP</text>

    <rect x="608" y="66" width="76" height="26" rx="5" fill="#e7efff" stroke="#9fb4d8"/><text x="646" y="83" fill="#26456f" text-anchor="middle">AI-A</text>
    <rect x="608" y="112" width="76" height="26" rx="5" fill="#e7efff" stroke="#9fb4d8"/><text x="646" y="129" fill="#26456f" text-anchor="middle">AI-B</text>
    <rect x="608" y="158" width="76" height="26" rx="5" fill="#e7efff" stroke="#9fb4d8"/><text x="646" y="175" fill="#26456f" text-anchor="middle">AI-C</text>
  </g>
  <g stroke="#8ac2a2" stroke-width="1.5">
    <path d="M468 59 L512 78"/><path d="M468 99 L512 98"/><path d="M468 139 L512 122"/><path d="M468 179 L512 142"/>
    <path d="M564 96 L608 79"/><path d="M564 118 L608 125"/><path d="M564 140 L608 171"/>
  </g>
  <text x="540" y="228" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#2f8f4e" text-anchor="middle">4 + 3 = 7 通り。それぞれ1回作るだけ</text>
  <text x="540" y="250" font-family="sans-serif" font-size="11.5" fill="#8892a0" text-anchor="middle">差し込み口の形を決めておく。USB と同じ発想です</text>

  <text x="360" y="284" font-family="sans-serif" font-size="11.5" fill="#8892a0" text-anchor="middle">MCP = Model Context Protocol（AIに外の道具を使わせるための共通の約束ごと）</text>
</svg>
