<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="AIの用意のしかたが3通りあり、どれを選んでも学ぶ内容は同じだという図">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">変わるのは「AIをどこで動かすか」だけです</text>

  <rect x="24" y="42" width="216" height="150" rx="10" fill="#eef4ff" stroke="#9fb4d8" stroke-width="1.5"/>
  <text x="132" y="66" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#26456f" text-anchor="middle">① Claude Code を契約</text>
  <text x="132" y="86" font-family="sans-serif" font-size="10.5" fill="#5a6f92" text-anchor="middle">自分のアカウントでサインイン</text>
  <rect x="44" y="98" width="176" height="30" rx="5" fill="#ffffff" stroke="#c7cede"/>
  <text x="132" y="117" font-family="sans-serif" font-size="11" fill="#26456f" text-anchor="middle">VS Code の中でAIが動く</text>
  <text x="132" y="146" font-family="sans-serif" font-size="11" fill="#5a6f92" text-anchor="middle">AIがファイルを直接読み書き</text>
  <text x="132" y="168" font-family="sans-serif" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">有料（月額 or 従量）</text>
  <text x="132" y="185" font-family="sans-serif" font-size="10.5" fill="#8892a0" text-anchor="middle">いちばん素直な形</text>

  <rect x="252" y="42" width="216" height="150" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
  <text x="360" y="66" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39" text-anchor="middle">② 会社のキーを使う</text>
  <text x="360" y="86" font-family="sans-serif" font-size="10.5" fill="#4a7a5f" text-anchor="middle">APIキーとリージョンをもらう</text>
  <rect x="272" y="98" width="176" height="30" rx="5" fill="#ffffff" stroke="#c7cede"/>
  <text x="360" y="117" font-family="sans-serif" font-size="11" fill="#1f5c39" text-anchor="middle">VS Code の中でAIが動く</text>
  <text x="360" y="146" font-family="sans-serif" font-size="11" fill="#4a7a5f" text-anchor="middle">会社の AWS 経由でつなぐ</text>
  <text x="360" y="168" font-family="sans-serif" font-size="11" font-weight="700" fill="#2f8f4e" text-anchor="middle">自分の負担は0円</text>
  <text x="360" y="185" font-family="sans-serif" font-size="10.5" fill="#8892a0" text-anchor="middle">配られた人だけ</text>

  <rect x="480" y="42" width="216" height="150" rx="10" fill="#fdf7e8" stroke="#e2c98a" stroke-width="1.5"/>
  <text x="588" y="66" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7a5c1a" text-anchor="middle">③ 0円で進む</text>
  <text x="588" y="86" font-family="sans-serif" font-size="10.5" fill="#a8862f" text-anchor="middle">ブラウザの Claude を使う</text>
  <rect x="500" y="98" width="176" height="30" rx="5" fill="#ffffff" stroke="#c7cede"/>
  <text x="588" y="117" font-family="sans-serif" font-size="11" fill="#7a5c1a" text-anchor="middle">別のタブでAIが動く</text>
  <text x="588" y="146" font-family="sans-serif" font-size="11" fill="#a8862f" text-anchor="middle">コードは自分でコピーして貼る</text>
  <text x="588" y="168" font-family="sans-serif" font-size="11" font-weight="700" fill="#2f8f4e" text-anchor="middle">完全に0円</text>
  <text x="588" y="185" font-family="sans-serif" font-size="10.5" fill="#8892a0" text-anchor="middle">貼るぶん、差分を読む力がつく</text>

  <path d="M132 196 L132 216 L588 216 L588 196" stroke="#2f8f4e" stroke-width="2" fill="none"/>
  <path d="M360 196 L360 216" stroke="#2f8f4e" stroke-width="2"/>
  <path d="M360 216 L360 236" stroke="#2f8f4e" stroke-width="2"/>
  <path d="M354 228 L360 238 L366 228 Z" fill="#2f8f4e"/>

  <rect x="150" y="242" width="420" height="44" rx="9" fill="#eef7f1" stroke="#a9d5bb" stroke-width="2"/>
  <text x="360" y="270" font-family="sans-serif" font-size="13" font-weight="700" fill="#1f5c39" text-anchor="middle">この先の22ステップは、3つとも完全に同じ内容です</text>

  <text x="360" y="312" font-family="sans-serif" font-size="12" fill="#26456f" text-anchor="middle">自分に関係ないステップには「飛ばしてよい」と青い案内が出ます。</text>
  <text x="360" y="332" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">迷ったら ③ で一周してから ① に切り替えるのが、いちばん損がありません。あとから変えられます。</text>
</svg>
