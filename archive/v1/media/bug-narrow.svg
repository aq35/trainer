<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="あいまいな不具合報告を、再現できる一行まで4段階で絞り込む図">
  <rect width="720" height="330" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">あいまいな報告を、直せる形に絞っていく</text>

  <rect x="60" y="42" width="600" height="52" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
  <text x="80" y="66" font-family="sans-serif" font-size="12.5" fill="#7a2f24">① 受け取った言葉</text>
  <text x="80" y="86" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7a2f24">「なんか、タスクの表示がおかしい気がします」</text>
  <text x="640" y="86" font-family="sans-serif" font-size="11" fill="#c0392b" text-anchor="end">まだ直せない</text>

  <path d="M360 96 L360 116" stroke="#9fb4d8" stroke-width="2"/>
  <path d="M354 108 L360 118 L366 108 Z" fill="#9fb4d8"/>

  <rect x="100" y="120" width="520" height="52" rx="10" fill="#fdf7e8" stroke="#e2c98a" stroke-width="1.5"/>
  <text x="120" y="144" font-family="sans-serif" font-size="12.5" fill="#7a5c1a">② 自分の目で再現する</text>
  <text x="120" y="164" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7a5c1a">同じ画面を開いて、同じ操作をする</text>
  <text x="600" y="164" font-family="sans-serif" font-size="11" fill="#a8862f" text-anchor="end">見えた</text>

  <path d="M360 174 L360 194" stroke="#9fb4d8" stroke-width="2"/>
  <path d="M354 186 L360 196 L366 186 Z" fill="#9fb4d8"/>

  <rect x="140" y="198" width="440" height="52" rx="10" fill="#eef4ff" stroke="#9fb4d8" stroke-width="1.5"/>
  <text x="160" y="222" font-family="sans-serif" font-size="12.5" fill="#26456f">③ どの1件かに絞る</text>
  <text x="160" y="242" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#26456f">12件のうち、崩れているのは id: 8 だけ</text>

  <path d="M360 252 L360 272" stroke="#9fb4d8" stroke-width="2"/>
  <path d="M354 264 L360 274 L366 264 Z" fill="#9fb4d8"/>

  <rect x="180" y="276" width="360" height="52" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
  <text x="200" y="300" font-family="sans-serif" font-size="12.5" fill="#1f5c39">④ 違いを1つに言い切る</text>
  <text x="200" y="320" font-family="monospace" font-size="11.5" font-weight="700" fill="#1f5c39">&lt;第2版&gt; が、画面から消えている</text>
  <text x="520" y="320" font-family="sans-serif" font-size="11" fill="#2f8f4e" text-anchor="end">直せる</text>
</svg>
