<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-label="forの中にforがあると、件数の2乗で処理回数が増えるという図">
  <rect width="720" height="350" fill="#ffffff"/>

  <text x="360" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#26456f" text-anchor="middle">for の中の for —— 遅さの、いちばん多い原因</text>

  <rect x="24" y="42" width="300" height="118" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
  <text x="44" y="66" font-family="monospace" font-size="11" fill="#7a2f24">for (const a of tasks) {</text>
  <rect x="60" y="76" width="240" height="46" rx="5" fill="#f7dfda" stroke="#e6b5ad"/>
  <text x="72" y="94" font-family="monospace" font-size="11" fill="#7a2f24">  for (const b of tasks) {</text>
  <text x="72" y="112" font-family="monospace" font-size="11" fill="#7a2f24">    // 全件を、もう一度</text>
  <text x="44" y="140" font-family="monospace" font-size="11" fill="#7a2f24">}</text>
  <text x="174" y="154" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#c0392b" text-anchor="middle">1件ごとに、全件を見に行っている</text>

  <text x="510" y="62" font-family="sans-serif" font-size="12" font-weight="700" fill="#26456f" text-anchor="middle">何回動くか</text>
  <g font-family="sans-serif" font-size="11.5">
    <text x="366" y="88" fill="#5b6472">10 件</text>
    <rect x="440" y="78" width="6" height="12" rx="2" fill="#9fb4d8"/>
    <text x="470" y="88" fill="#26456f">100 回</text>

    <text x="366" y="112" fill="#5b6472">100 件</text>
    <rect x="440" y="102" width="24" height="12" rx="2" fill="#9fb4d8"/>
    <text x="486" y="112" fill="#26456f">10,000 回</text>

    <text x="366" y="136" fill="#5b6472">1,000 件</text>
    <rect x="440" y="126" width="70" height="12" rx="2" fill="#e6b5ad"/>
    <text x="532" y="136" fill="#26456f">1,000,000 回</text>

    <text x="366" y="160" fill="#5b6472">20,000 件</text>
    <rect x="440" y="150" width="240" height="12" rx="2" fill="#c0392b"/>
    <text x="440" y="176" font-size="11" font-weight="700" fill="#c0392b">400,000,000 回（4億）</text>
    <text x="440" y="192" font-size="11" fill="#c0392b">実測で約3秒、画面が固まります</text>
  </g>

  <path d="M24 200 L696 200" stroke="#c7cede" stroke-width="1"/>

  <rect x="24" y="216" width="330" height="76" rx="10" fill="#fdf0ee" stroke="#e6b5ad" stroke-width="1.5"/>
  <text x="44" y="240" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7a2f24">件数が 20 倍になると</text>
  <text x="44" y="264" font-family="sans-serif" font-size="12" fill="#7a2f24">回数は <tspan font-weight="700" font-size="14">400 倍</tspan>（20 × 20）</text>
  <text x="44" y="284" font-family="sans-serif" font-size="10.5" fill="#a05a4c">＝ データが増えるほど、加速度的に苦しくなる</text>

  <rect x="366" y="216" width="330" height="76" rx="10" fill="#eef7f1" stroke="#a9d5bb" stroke-width="1.5"/>
  <text x="386" y="240" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#1f5c39">全体を1〜2回通るだけにすると</text>
  <text x="386" y="264" font-family="sans-serif" font-size="12" fill="#1f5c39">件数が 20 倍なら、回数も <tspan font-weight="700" font-size="14">20 倍</tspan></text>
  <text x="386" y="284" font-family="sans-serif" font-size="10.5" fill="#4a7a5f">＝ データが増えても、こわくない</text>

  <text x="24" y="322" font-family="sans-serif" font-size="12" font-weight="700" fill="#c0392b">同じ形は <tspan font-family="monospace">filter</tspan> の中の <tspan font-family="monospace">find</tspan> でも起きます。書き方が違うだけで、中身は二重ループです。</text>
  <text x="24" y="342" font-family="sans-serif" font-size="12" fill="#26456f">見つけたら、いつもこう考えてください —— <tspan font-weight="700">「件数が増えたら、これは何回動く？」</tspan></text>
</svg>
