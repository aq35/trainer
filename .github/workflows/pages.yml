# 教材を sunao でビルドし、公開用の docs/ を作り直す。
# GitHub Pages は「main ブランチの docs/ をそのまま配信する」設定のまま使う。
#   - プルリクエスト: テストとビルドだけ（壊れた教材が main に入る前に止める）
#   - main への push: docs/ を作り直し、変わっていればコミットする
#     （このコミットは GITHUB_TOKEN で作るので、このワークフローをもう一度起こさない）
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # フォーク（受講者の練習場所）では動かさない。本家でだけ、ビルドと公開をする
    if: github.repository == 'aq35/trainer'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 出力の記録（tools/record.mjs）は、この教材の過去のコミットから始めるため
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # 教材に載せた出力を、いまの Git で打ち直して比べる。版が違って表示が変わっていたら警告を出す
      - run: node tools/record.mjs --check
      - run: npm run build:docs
      - name: docs/ が変わっていればコミットする（main のときだけ）
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git add -A docs
          if git diff --cached --quiet; then
            echo "docs/ は最新です"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: ビルド結果を更新（${GITHUB_SHA::7}）"
          git push
